<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071823">
<title>Employer Verification | Alygnn Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=DM+Serif+Display&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}:root{--bg:#071823;--panel:#0E1F2D;--border:#294054;--text:#F6F8FA;--muted:#A9B6C5;--brand:#6F99C4;--brand2:#3B6FA7;--sage:#8CB69B;--green:#5ED49A;--green-bg:#123A2A;--amber:#F3C66E;--amber-bg:#3A2C0F;--red:#FF9D9D;--red-bg:#401F25}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,rgba(111,153,196,.16),transparent 28%),radial-gradient(circle at 90% 10%,rgba(140,182,155,.11),transparent 25%),var(--bg);color:var(--text);font-family:'DM Sans',Arial,sans-serif}button,a{font:inherit}button{cursor:pointer}.shell{max-width:1180px;margin:0 auto;padding:28px 22px 60px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-family:'DM Serif Display',Georgia,serif;font-size:34px;color:var(--brand)}.brand span{color:var(--sage)}.admin-pill{padding:9px 12px;border:1px solid var(--border);border-radius:999px;background:var(--panel);font-size:11px;font-weight:900;letter-spacing:.4px;color:var(--muted)}.hero{margin-top:34px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;color:var(--brand)}h1{font-size:38px;line-height:1.05;margin:8px 0 9px;letter-spacing:-1.1px}.hero p{margin:0;max-width:720px;color:var(--muted);font-size:14px;line-height:1.6}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:24px}.stat{padding:17px 18px;border:1px solid var(--border);border-radius:18px;background:rgba(14,31,45,.86)}.stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.7px;font-weight:900;color:var(--muted)}.stat-value{margin-top:5px;font-size:29px;font-weight:900}.toolbar{margin-top:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab,.refresh{min-height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--border);background:var(--panel);color:var(--muted);font-weight:900;font-size:12px}.tab.active{background:var(--brand2);border-color:var(--brand2);color:#fff}.refresh{color:var(--text)}.status-message{margin-top:18px;padding:14px 15px;border:1px solid var(--border);border-radius:14px;background:var(--panel);color:var(--muted);font-size:12px;display:none}.status-message.show{display:block}.status-message.error{background:var(--red-bg);border-color:#6B303A;color:var(--red)}.queue{display:grid;gap:16px;margin-top:18px}.card{border:1px solid var(--border);border-radius:22px;background:linear-gradient(180deg,rgba(18,38,56,.95),rgba(14,31,45,.98));overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.14)}.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:20px 20px 15px;border-bottom:1px solid var(--border)}.company-name{font-size:20px;font-weight:900;letter-spacing:-.35px}.company-sub{margin-top:4px;color:var(--muted);font-size:11px}.badge{padding:8px 11px;border-radius:999px;font-size:10px;font-weight:900;white-space:nowrap;text-transform:uppercase;letter-spacing:.45px}.badge.pending_review{background:var(--amber-bg);color:var(--amber)}.badge.approved{background:var(--green-bg);color:var(--green)}.badge.rejected{background:var(--red-bg);color:var(--red)}.card-body{padding:18px 20px 20px}.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.fact{min-height:78px;padding:12px 13px;border:1px solid var(--border);border-radius:14px;background:rgba(7,24,35,.42)}.fact-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.65px;font-weight:900}.fact-value{margin-top:7px;font-size:12px;font-weight:800;line-height:1.45;word-break:break-word}.checks{margin-top:14px;display:flex;gap:7px;flex-wrap:wrap}.check{padding:7px 9px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--border);font-size:10px;font-weight:800;color:var(--muted)}.check.good{background:var(--green-bg);border-color:#24563F;color:var(--green)}.check.warn{background:var(--amber-bg);border-color:#5C4718;color:var(--amber)}.doc{margin-top:14px;padding:14px;border:1px solid var(--border);border-radius:15px;background:rgba(7,24,35,.45);display:flex;align-items:center;justify-content:space-between;gap:12px}.doc-title{font-size:12px;font-weight:900}.doc-meta{margin-top:3px;color:var(--muted);font-size:10px}.doc-link{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 13px;border-radius:11px;background:#fff;color:#172333;text-decoration:none;font-size:11px;font-weight:900}.doc-link.disabled{pointer-events:none;opacity:.45}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.btn{min-height:43px;padding:0 16px;border-radius:12px;font-weight:900;font-size:12px}.approve{border:0;background:var(--brand2);color:#fff}.reject{border:1px solid #68313A;background:var(--red-bg);color:var(--red)}.empty{padding:34px 20px;text-align:center;border:1px dashed var(--border);border-radius:20px;background:rgba(14,31,45,.7);color:var(--muted)}.loading{opacity:.55;pointer-events:none}@media(max-width:820px){.facts{grid-template-columns:1fr 1fr}}@media(max-width:560px){.shell{padding:22px 14px 48px}h1{font-size:31px}.summary{grid-template-columns:1fr}.facts{grid-template-columns:1fr 1fr}.card-head{padding:17px}.card-body{padding:16px}.doc{align-items:flex-start;flex-direction:column}.doc-link{width:100%}.actions{display:grid;grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main class="shell">
<header class="topbar"><div class="brand">Alygnn<span>.</span></div><div class="admin-pill">ADMIN • EMPLOYER VERIFICATION</div></header>
<section class="hero"><div class="eyebrow">Trust & Safety</div><h1>Employer verification queue</h1><p>Review companies that require manual verification. Approved employers can publish jobs; rejected employers remain blocked until they correct the issue and resubmit.</p></section>
<section class="summary"><article class="stat"><div class="stat-label">Pending</div><div class="stat-value" id="count-pending">—</div></article><article class="stat"><div class="stat-label">Approved</div><div class="stat-value" id="count-approved">—</div></article><article class="stat"><div class="stat-label">Rejected</div><div class="stat-value" id="count-rejected">—</div></article></section>
<div class="toolbar"><div class="tabs"><button class="tab active" data-status="pending_review">Pending</button><button class="tab" data-status="approved">Approved</button><button class="tab" data-status="rejected">Rejected</button></div><button class="refresh" id="refresh">Refresh</button></div>
<div class="status-message" id="message"></div><section class="queue" id="queue"></section>
</main>
<script>
const SUPABASE_URL='https://auth.alygnn.com';
const SUPABASE_KEY='sb_publishable_3l8krRh6WCyvKfNumWDBDw_C6CKr7rG';
const API_CANDIDATES=['https://alygnn.com/api/admin/employer-verifications','https://alygnn.com/api/admin/employer-verification'];
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let currentStatus='pending_review',reviews=[];
const $=id=>document.getElementById(id);
function esc(value){const div=document.createElement('div');div.textContent=String(value??'');return div.innerHTML}
function fmtStatus(value){return String(value||'pending_review').replaceAll('_',' ')}
function digits(value){return String(value||'').replace(/\D/g,'')}
function hasValidPhone(value){return digits(value).length===10}
function hasValidEinLast4(value){return /^\d{4}$/.test(String(value||''))}
function showMessage(text,type=''){const box=$('message');box.textContent=text;box.className='status-message show'+(type?' '+type:'')}
function clearMessage(){const box=$('message');box.textContent='';box.className='status-message'}
async function sessionToken(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='app-employer-login.html';throw new Error('Sign in first.')}return session.access_token}
async function request(path='',options={}){const token=await sessionToken();let lastError=null;for(const base of API_CANDIDATES){const response=await fetch(base+path,{...options,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json',...(options.headers||{})}});const result=await response.json().catch(()=>({}));if(response.ok)return result;if(response.status===404){lastError=new Error(result.error||'Admin verification endpoint not found.');continue}throw new Error(result.error||('Request failed with status '+response.status))}throw lastError||new Error('Admin verification endpoint not found.')}
function render(){const queue=$('queue');if(!reviews.length){queue.innerHTML='<div class="empty">No '+esc(fmtStatus(currentStatus))+' employer verifications.</div>';return}queue.innerHTML=reviews.map(row=>{const doc=row.document||null,documentReady=!!doc,websiteReady=!!String(row.website||'').trim(),phoneReady=hasValidPhone(row.business_phone),einReady=hasValidEinLast4(row.ein_last4),hqReady=!!String(row.headquarters||'').trim();const checks=[`<span class="check ${documentReady?'good':'warn'}">${documentReady?'✓':'○'} Verification PDF</span>`,`<span class="check ${websiteReady?'good':'warn'}">${websiteReady?'✓':'○'} Website</span>`,`<span class="check ${phoneReady?'good':'warn'}">${phoneReady?'✓':'○'} 10-digit phone</span>`,`<span class="check ${einReady?'good':'warn'}">${einReady?'✓':'○'} EIN last 4</span>`,`<span class="check ${hqReady?'good':'warn'}">${hqReady?'✓':'○'} Headquarters</span>`].join('');return `<article class="card"><div class="card-head"><div><div class="company-name">${esc(row.company_name||'Unnamed company')}</div><div class="company-sub">Company ID: ${esc(row.company_id||'Not connected')}</div></div><span class="badge ${esc(row.verification_status)}">${esc(fmtStatus(row.verification_status))}</span></div><div class="card-body"><div class="facts"><div class="fact"><div class="fact-label">Website</div><div class="fact-value">${esc(row.website||'Not provided')}</div></div><div class="fact"><div class="fact-label">Phone</div><div class="fact-value">${esc(row.business_phone||'Not provided')}</div></div><div class="fact"><div class="fact-label">Industry</div><div class="fact-value">${esc(row.industry||'Not provided')}</div></div><div class="fact"><div class="fact-label">Company size</div><div class="fact-value">${esc(row.company_size||'Not provided')}</div></div><div class="fact"><div class="fact-label">Headquarters</div><div class="fact-value">${esc(row.headquarters||'Not provided')}</div></div><div class="fact"><div class="fact-label">EIN last 4</div><div class="fact-value">${esc(row.ein_last4||'Not provided')}</div></div><div class="fact"><div class="fact-label">Submitted</div><div class="fact-value">${row.created_at?esc(new Date(row.created_at).toLocaleString()):'Unknown'}</div></div><div class="fact"><div class="fact-label">Document status</div><div class="fact-value">${esc(doc?.review_status?fmtStatus(doc.review_status):'Not uploaded')}</div></div></div><div class="checks">${checks}</div><div class="doc"><div><div class="doc-title">${esc(doc?.original_file_name||'No verification document found')}</div><div class="doc-meta">${documentReady?'Secure link expires shortly. Review the legal business name and EIN before approval.':'Employer must upload a verification PDF before approval.'}</div></div>${row.document_url?`<a class="doc-link" href="${esc(row.document_url)}" target="_blank" rel="noopener">View PDF</a>`:`<span class="doc-link disabled">View PDF</span>`}</div>${row.verification_status==='pending_review'?`<div class="actions"><button class="btn approve" onclick="reviewCompany('${esc(row.company_id)}','approved',this)">Approve employer</button><button class="btn reject" onclick="reviewCompany('${esc(row.company_id)}','rejected',this)">Decline</button></div>`:row.verification_status==='rejected'&&row.rejection_reason?`<div class="status-message show error" style="margin-top:14px">Reason: ${esc(row.rejection_reason)}</div>`:''}</div></article>`}).join('')}
async function loadStatus(status=currentStatus){clearMessage();currentStatus=status;$('queue').classList.add('loading');try{const result=await request('?status='+encodeURIComponent(status));reviews=result.reviews||[];render()}catch(error){reviews=[];$('queue').innerHTML='';showMessage(error.message,'error')}finally{$('queue').classList.remove('loading')}}
async function loadCounts(){const statuses=['pending_review','approved','rejected'];await Promise.all(statuses.map(async status=>{try{const result=await request('?status='+encodeURIComponent(status));const key=status==='pending_review'?'pending':status;$('count-'+key).textContent=String((result.reviews||[]).length)}catch(error){const key=status==='pending_review'?'pending':status;$('count-'+key).textContent='—'}}))}
async function reviewCompany(companyId,decision,button){if(!companyId){showMessage('This verification is missing a company ID.','error');return}let reason='';if(decision==='rejected'){reason=prompt('Why are you declining this employer?')||'';if(!reason.trim())return}else{if(!confirm('Approve this employer and allow verified job publishing?'))return}button.disabled=true;const oldText=button.textContent;button.textContent=decision==='approved'?'Approving…':'Declining…';try{await request('',{method:'PATCH',body:JSON.stringify({company_id:companyId,decision,reason:reason.trim()})});showMessage(decision==='approved'?'Employer approved.':'Employer declined.');await Promise.all([loadStatus(currentStatus),loadCounts()])}catch(error){showMessage(error.message,'error');button.disabled=false;button.textContent=oldText}}
document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(item=>item.classList.remove('active'));button.classList.add('active');loadStatus(button.dataset.status)}));
$('refresh').addEventListener('click',()=>Promise.all([loadStatus(currentStatus),loadCounts()]));
(async()=>{try{await sessionToken();await Promise.all([loadStatus('pending_review'),loadCounts()])}catch(error){showMessage(error.message,'error')}})();
</script>
</body>
</html>
