<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Messages — Alygnn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --brand:#5D7FA3;--sage:#8CB69B;--bg:#F6F8F7;--card:#FCFCFA;
    --text:#1A2530;--muted:#4A5968;--border:#DDE3E8;--mint:#6FBF8F;
    --rose:#D79A9A;--brand-light:rgba(93,127,163,.10)
  }
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;visibility:hidden}
  body.ready{visibility:visible}
  #loading{
    visibility:visible;position:fixed;inset:0;background:var(--bg);z-index:9999;
    display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px
  }
  body.ready #loading{display:none}
  nav{
    height:64px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--border);background:rgba(246,248,247,.95);
    backdrop-filter:blur(12px);position:sticky;top:0;z-index:50
  }
  .logo{font-family:'DM Serif Display',serif;font-size:22px;color:var(--brand);text-decoration:none}.logo span{color:var(--sage)}
  .nav-right{display:flex;align-items:center;gap:12px}.nav-name{font-size:13px;color:var(--muted)}
  .nav-btn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--border);background:white;color:var(--text);text-decoration:none;font-size:12px;font-weight:600}
  .nav-btn.primary{background:var(--brand);color:white;border-color:var(--brand)}
  .layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 64px)}
  .sidebar{border-right:1px solid var(--border);padding:28px 18px;background:rgba(252,252,250,.65)}
  .sidebar-label{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:#8794A0;margin:0 10px 10px}
  .side-link{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:500;margin-bottom:5px}
  .side-link:hover{background:white;color:var(--text)}.side-link.active{background:var(--brand-light);color:var(--brand)}
  .side-icon{
    width:20px;
    height:20px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .side-icon svg{
    width:18px;
    height:18px;
    display:block;
    fill:none;
    stroke:currentColor;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .sidebar hr{border:0;border-top:1px solid var(--border);margin:18px 0}
  main{padding:36px 4.5% 70px;max-width:1420px;width:100%;margin:0 auto}
  .page-kicker{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--brand);font-weight:700;margin-bottom:6px}
  h1{font-family:'DM Serif Display',serif;font-size:34px;line-height:1.05;margin-bottom:6px}
  .page-sub{font-size:13px;line-height:1.55;color:var(--muted);margin-bottom:24px}
  .chat-shell{height:680px;display:grid;grid-template-columns:320px minmax(0,1fr);background:var(--card);border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 12px 32px rgba(38,54,70,.04)}
  .conversations{border-right:1px solid var(--border);background:rgba(255,255,255,.7);min-width:0;display:flex;flex-direction:column}
  .conversations-head{padding:18px;border-bottom:1px solid var(--border)}.conversations-title{font-size:14px;font-weight:700;margin-bottom:10px}
  .search{width:100%;border:1px solid var(--border);background:white;color:var(--text);border-radius:11px;padding:10px 12px;font:12px 'DM Sans',sans-serif;outline:none}
  .search:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(93,127,163,.08)}
  .conversation-list{flex:1;overflow-y:auto}
  .conversation{width:100%;border:0;border-bottom:1px solid rgba(221,227,232,.75);background:transparent;padding:15px 16px;display:flex;gap:11px;text-align:left;cursor:pointer;font-family:inherit}
  .conversation:hover{background:rgba(93,127,163,.04)}.conversation.active{background:var(--brand-light)}
  .avatar{width:42px;height:42px;border-radius:13px;background:var(--brand-light);color:var(--brand);display:grid;place-items:center;font-family:'DM Serif Display',serif;font-size:16px;flex-shrink:0}
  .conversation-copy{min-width:0;flex:1}.conversation-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px}
  .conversation-name{font-size:12.5px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.conversation-time{font-size:9.5px;color:#8A96A0;flex-shrink:0}
  .conversation-job{font-size:10.5px;color:var(--brand);margin-bottom:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .conversation-preview{font-size:10.5px;line-height:1.4;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.unread-dot{width:7px;height:7px;border-radius:50%;background:var(--brand);margin-top:6px;flex-shrink:0}
  .chat-panel{min-width:0;display:flex;flex-direction:column;background:white}.chat-head{height:78px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 20px}
  .chat-person{display:flex;align-items:center;gap:11px;min-width:0}.chat-head-name{font-size:13px;font-weight:700;margin-bottom:2px}.chat-head-job{font-size:10.5px;color:var(--muted)}
  .context-pill{display:inline-flex;align-items:center;min-height:30px;padding:0 11px;border-radius:999px;background:var(--brand-light);color:var(--brand);font-size:10.5px;font-weight:700;text-decoration:none;white-space:nowrap}
  .messages{flex:1;overflow-y:auto;padding:22px 22px 14px;background:radial-gradient(circle at top left,rgba(140,182,155,.055),transparent 34%),white}
  .date-divider{text-align:center;font-size:9px;color:#8A96A0;margin:2px 0 18px}.msg-row{display:flex;margin-bottom:11px}.msg-row.mine{justify-content:flex-end}
  .bubble{max-width:min(72%,560px);border:1px solid var(--border);border-radius:15px 15px 15px 5px;padding:10px 12px;background:white;font-size:12px;line-height:1.55;color:var(--text)}
  .mine .bubble{background:var(--brand);color:white;border-color:var(--brand);border-radius:15px 15px 5px 15px}.bubble-time{margin-top:5px;font-size:8.5px;color:#8A96A0}.mine .bubble-time{color:rgba(255,255,255,.72);text-align:right}
  .composer{border-top:1px solid var(--border);padding:14px 16px;display:flex;gap:9px;align-items:flex-end;background:var(--card)}
  .composer textarea{flex:1;min-height:46px;max-height:110px;resize:none;border:1px solid var(--border);border-radius:13px;padding:12px 13px;font:12px/1.45 'DM Sans',sans-serif;outline:none;color:var(--text);background:white}
  .composer textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(93,127,163,.08)}.send-btn{min-width:78px;height:46px;border:0;border-radius:13px;background:var(--brand);color:white;font:700 12px 'DM Sans',sans-serif;cursor:pointer}.send-btn:hover{opacity:.92}
  .empty-chat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--muted)}
  .empty-chat-icon{width:54px;height:54px;border-radius:17px;background:var(--brand-light);color:var(--brand);display:grid;place-items:center;font-size:22px;margin-bottom:12px}
  .empty-chat-title{font-family:'DM Serif Display',serif;color:var(--text);font-size:21px;margin-bottom:5px}.empty-chat-copy{font-size:12px;line-height:1.55;max-width:360px}
  .error-note{margin-top:14px;border:1px solid rgba(215,154,154,.3);background:rgba(215,154,154,.1);color:#8a5555;border-radius:12px;padding:11px 13px;font-size:11.5px;line-height:1.5}
  @media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{display:none}.chat-shell{grid-template-columns:280px minmax(0,1fr)}}
  @media(max-width:680px){main{padding:24px 14px 50px}.chat-shell{grid-template-columns:1fr;height:auto;min-height:700px}.conversations{max-height:280px;border-right:0;border-bottom:1px solid var(--border)}.chat-panel{min-height:520px}.chat-head{padding:0 14px}.context-pill{display:none}.bubble{max-width:86%}}

    /* Readability pass — slightly larger messaging text without changing layout */
    .messages-title{font-size:30px}
    .messages-sub{font-size:14px}
    .conversation-name{font-size:15px}
    .conversation-preview{font-size:13px}
    .conversation-time{font-size:12px}
    .chat-person{font-size:17px}
    .chat-job{font-size:13px}
    .message-bubble{font-size:15px; line-height:1.5}
    .message-time{font-size:11px}
    .composer textarea{font-size:15px}
    .send-btn{font-size:14px}

/* Candidate-only active-page marker. Employer navigation is intentionally untouched. */
.candidate-role .side-label-text{
  display:inline-block;
  padding-bottom:4px;
  border-bottom:2px solid transparent;
}
.candidate-role .side-link.active .side-label-text{
  border-bottom-color:var(--brand);
}

  /* Candidate Messages matches the Account / My Jobs top navigation.
     Employer Messages keeps its existing sidebar and dashboard controls. */
  .candidate-nav-links,
  .candidate-nav-actions{display:none}

  body.candidate-role .candidate-nav-links.nav-readiness-pending{visibility:hidden}

  body.candidate-role .candidate-nav-links{
    display:flex;
    align-items:center;
    gap:28px;
  }

  body.candidate-role .candidate-nav-links a{
    color:var(--muted);
    text-decoration:none;
    font-size:14px;
    padding:6px 0;
    border-bottom:2px solid transparent;
  }

  body.candidate-role .candidate-nav-links a:hover{color:var(--text)}
  body.candidate-role .candidate-nav-links a.active{
    color:var(--text);
    border-bottom-color:var(--brand);
  }

  body.candidate-role .candidate-nav-actions{
    display:flex;
    align-items:center;
  }

  .candidate-nav-signout{
    font:500 13px 'DM Sans',sans-serif;
    color:var(--muted);
    background:transparent;
    border:1px solid var(--border);
    border-radius:999px;
    padding:7px 15px;
    cursor:pointer;
    transition:border-color .2s,color .2s;
  }
  .candidate-nav-signout:hover{
    border-color:var(--brand);
    color:var(--brand);
  }

  body.candidate-role #employer-nav-right{display:none}
  body.candidate-role .layout{
    display:block;
    min-height:calc(100vh - 64px);
  }
  body.candidate-role .sidebar{display:none}
  body.candidate-role main{
    max-width:1100px;
    margin:0 auto;
    padding:40px 6% 90px;
  }

  body.candidate-role .page-kicker{margin-bottom:6px}
  body.candidate-role .page-sub{
    font-size:14px;
    margin-bottom:26px;
  }

  @media(max-width:720px){
    body.candidate-role nav{padding:0 18px}
    body.candidate-role .candidate-nav-links{gap:14px}
    body.candidate-role .candidate-nav-links a{font-size:12px}
    body.candidate-role .candidate-nav-signout{font-size:12px;padding:6px 11px}
  }

  /* Employer desktop shell:
     The header and left navigation stay in place. The sidebar is not a
     separate scroll container; wheel/trackpad scrolling continues the page. */
  @media (min-width: 901px) {
    body:not(.candidate-role) nav {
      position: sticky !important;
      top: 0;
      z-index: 100;
    }
    body:not(.candidate-role) .sidebar {
      position: sticky;
      top: 64px;
      align-self: start;
      height: calc(100vh - 64px);
      overflow: hidden;
      overscroll-behavior: none;
    }
  }


  /* Employer Messages uses the exact same fixed shell as Employer Dashboard.
     Candidate Messages keeps its existing candidate navigation. */
  @media (min-width: 901px) {
    body:not(.candidate-role) nav {
      position: fixed !important;
      top: 0; left: 0; right: 0;
      width: 100%;
      height: 64px;
      z-index: 1000;
      padding: 0 5%;
      background: rgba(246,248,247,.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    body:not(.candidate-role) .layout {
      display:block !important;
      min-height:100vh !important;
      padding-top:64px;
    }

    body:not(.candidate-role) .sidebar {
      position:fixed !important;
      top:64px !important;
      left:0 !important;
      width:240px !important;
      height:calc(100vh - 64px) !important;
      padding:32px 20px !important;
      overflow:hidden !important;
      overscroll-behavior:none;
      background:var(--card);
      border-right:1px solid var(--border);
      z-index:90;
    }

    body:not(.candidate-role) main {
      margin-left:240px !important;
      max-width:none !important;
      padding:36px 5% 70px !important;
    }
  }

  body:not(.candidate-role) #employer-nav-right {
    display:flex;
    align-items:center;
    gap:16px;
  }
  .employer-workspace-bell {
    position:relative; display:flex; align-items:center; justify-content:center;
    width:36px; height:36px; border-radius:10px; border:1px solid var(--border);
    background:var(--card); color:var(--muted); cursor:pointer;
  }
  .employer-workspace-bell:hover { color:var(--brand); border-color:var(--brand); }
  .employer-workspace-bell svg { width:18px; height:18px; }
  .employer-workspace-signout {
    font-size:13px; color:var(--muted); background:none;
    border:1px solid var(--border); border-radius:8px; padding:6px 14px;
    cursor:pointer; font-family:'DM Sans',sans-serif;
  }
  .employer-workspace-signout:hover { border-color:var(--rose); color:var(--rose); }

  body:not(.candidate-role) .sidebar-label {
    font-size:10px !important; letter-spacing:2px !important;
    color:var(--muted) !important; font-weight:500; padding:0 8px;
    margin-bottom:10px !important;
  }
  body:not(.candidate-role) .side-link {
    padding:10px 12px !important;
    font-size:14px !important;
    font-weight:400 !important;
    margin-bottom:2px !important;
  }
  body:not(.candidate-role) .side-link.active { font-weight:500 !important; }


  /* Width correction for the fixed employer sidebar.
     Keep candidate Messages unchanged; this only affects employer mode. */
  html, body {
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
  }

  @media (min-width: 901px) {
    body:not(.candidate-role) .layout {
      width: 100% !important;
      max-width: 100% !important;
      overflow-x: clip !important;
    }

    body:not(.candidate-role) main {
      box-sizing: border-box !important;
      margin-left: 240px !important;
      width: calc(100% - 240px) !important;
      max-width: calc(100% - 240px) !important;
      min-width: 0 !important;
      overflow-x: hidden !important;
    }

    body:not(.candidate-role) main > * {
      max-width: 100%;
      min-width: 0;
    }

    body:not(.candidate-role) .chat-shell {
      width: 100% !important;
      max-width: 100% !important;
      min-width: 0 !important;
    }
  }


  /* Keep the message composer fully inside the chat card.
     Flex children default to min-height:auto, which let a long message history
     push the composer below the visible chat-shell. */
  .chat-panel {
    min-height: 0 !important;
    overflow: hidden;
  }

  .messages {
    min-height: 0 !important;
    overflow-y: auto;
  }

  .composer {
    flex: 0 0 auto;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
  }

  .composer textarea {
    min-width: 0;
  }

  .conversations {
    min-height: 0;
  }

  .conversation-list {
    min-height: 0;
  }


  /* Single-screen Messages workspace.
     The browser page itself does not scroll. The chat history is the primary
     vertical scroll area; the conversation list can still handle overflow
     without adding a second visible scrollbar. */
  html, body {
    width: 100%;
    height: 100%;
    max-width: 100%;
    overflow: hidden !important;
  }

  body {
    min-height: 0 !important;
  }

  nav {
    position: fixed !important;
    top: 0;
    left: 0;
    right: 0;
    width: 100%;
    z-index: 1000;
  }

  .layout {
    height: 100vh !important;
    min-height: 0 !important;
    padding-top: 64px;
    overflow: hidden !important;
  }

  main {
    height: calc(100vh - 64px) !important;
    min-height: 0 !important;
    overflow: hidden !important;
    display: flex;
    flex-direction: column;
    padding-top: 22px !important;
    padding-bottom: 10px !important;
  }

  .page-kicker,
  h1,
  .page-sub,
  #setup-note,
  .messages-legal {
    flex: 0 0 auto;
  }

  .page-sub {
    margin-bottom: 14px !important;
  }

  .chat-shell {
    flex: 1 1 auto;
    height: auto !important;
    min-height: 0 !important;
    max-height: none !important;
  }

  .conversations,
  .chat-panel {
    min-height: 0 !important;
  }

  .conversation-list {
    min-height: 0 !important;
    overflow-y: auto;
    scrollbar-width: none;
  }

  .conversation-list::-webkit-scrollbar {
    width: 0;
    height: 0;
  }

  .messages {
    min-height: 0 !important;
    overflow-y: auto !important;
    overscroll-behavior: contain;
  }

  .messages-legal {
    min-height: 26px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 7px;
    padding-top: 8px;
    font-size: 11px;
    color: var(--muted);
  }

  .messages-legal a {
    color: var(--muted);
    text-decoration: none;
  }

  .messages-legal a:hover {
    color: var(--brand);
  }

  .chat-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .delete-chat-btn {
    min-height: 30px;
    padding: 0 11px;
    border-radius: 999px;
    border: 1px solid rgba(215,154,154,.48);
    background: rgba(215,154,154,.10);
    color: #a05858;
    font: 700 10.5px 'DM Sans', sans-serif;
    cursor: pointer;
    white-space: nowrap;
  }

  .delete-chat-btn:hover {
    background: rgba(215,154,154,.18);
    border-color: var(--rose);
  }

  .delete-chat-btn:disabled {
    opacity: .55;
    cursor: not-allowed;
  }

  @media (max-width: 680px) {
    html, body {
      overflow: auto !important;
      height: auto;
      min-height: 100%;
    }

    nav {
      position: sticky !important;
    }

    .layout {
      height: auto !important;
      min-height: calc(100vh - 64px) !important;
      padding-top: 0;
      overflow: visible !important;
    }

    main {
      height: auto !important;
      min-height: 0 !important;
      overflow: visible !important;
    }

    .messages-legal {
      padding-bottom: 8px;
    }

    .delete-chat-btn {
      font-size: 10px;
      padding: 0 9px;
    }
  }

</style>
</head>
<body>
<div id="loading">Loading messages…</div>

<nav>
  <a class="logo" href="index.html">Alygnn<span>.</span></a>

  <div class="candidate-nav-links nav-readiness-pending" id="candidate-nav-links">
    <a href="account.html">Account</a>
    <a href="my-jobs.html">My jobs</a>
    <a href="messages.html" class="active">Messages</a>
    <a href="swipe.html" id="candidate-swipe-link" style="display:none;">Swipe</a>
  </div>

  <div class="candidate-nav-actions" id="candidate-nav-actions">
    <button class="candidate-nav-signout" type="button" onclick="candidateSignOut()">Sign out</button>
  </div>

  <div class="nav-right" id="employer-nav-right">
    <button class="employer-workspace-bell" type="button" aria-label="Notifications" onclick="window.location.href='employer-dashboard.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </button>
    <span class="nav-name" id="nav-name"></span>
    <button class="employer-workspace-signout" type="button" onclick="candidateSignOut()">Sign out</button>
  </div>
</nav>
<script>
(function(){
  const nav = document.getElementById('candidate-nav-links');
  const swipe = document.getElementById('candidate-swipe-link') || document.getElementById('nav-swipe-link');
  if(!nav || !swipe) return;

  let cached = null;
  try { cached = window.sessionStorage.getItem('alygnn_matching_ready_v1'); } catch (_) {}

  if(cached === '1'){
    swipe.style.display = '';
    nav.classList.remove('nav-readiness-pending');
  }else if(cached === '0'){
    swipe.style.display = 'none';
    nav.classList.remove('nav-readiness-pending');
  }
})();
</script>


<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main>
    <div class="page-kicker">Alygnn messages</div>
    <h1>Messages</h1>
    <div class="page-sub">Conversations stay tied to the application and job that connected you.</div>

    <section class="chat-shell">
      <div class="conversations">
        <div class="conversations-head">
          <div class="conversations-title">Conversations</div>
          <input class="search" id="conversation-search" type="text" placeholder="Search person or job…" oninput="renderConversationList()">
        </div>
        <div class="conversation-list" id="conversation-list"></div>
      </div>
      <div class="chat-panel" id="chat-panel"></div>
    </section>

    <div class="error-note" id="setup-note" style="display:none"></div>

    <div class="messages-legal" aria-label="Legal links">

function escapeHtml(v){
  return String(v||'')
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;').replaceAll("'",'&#039;');
}
function initials(name){
  return String(name||'?').trim().split(/\s+/).map(x=>x[0]||'').join('').slice(0,2).toUpperCase()||'?';
}
function timeLabel(iso){
  if(!iso)return '';
  const d=new Date(iso);
  const now=new Date();
  if(d.toDateString()===now.toDateString())return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  const yesterday=new Date(now);yesterday.setDate(now.getDate()-1);
  if(d.toDateString()===yesterday.toDateString())return 'Yesterday';
  return d.toLocaleDateString([],{month:'short',day:'numeric'});
}
function fullTime(iso){
  if(!iso)return '';
  return new Date(iso).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
}

function parseProfileResumeData(value){
  if(!value)return {};
  if(typeof value==='object'&&!Array.isArray(value))return value;
  if(typeof value==='string'){
    try{
      const parsed=JSON.parse(value);
      return parsed&&typeof parsed==='object'?parsed:{};
    }catch(_){
      return {};
    }
  }
  return {};
}

function candidateNameFromProfile(profile){
  const p=profile||{};
  const resume=parseProfileResumeData(p.resume_data);
  const personal=(resume?.personal&&typeof resume.personal==='object')
    ?resume.personal
    :{};

  const resumePersonalName=[
    personal.first_name,
    personal.last_name
  ].filter(Boolean).join(' ').trim();

  return String(
    p.full_name ||
    resume.name ||
    resume.full_name ||
    resumePersonalName ||
    'Candidate'
  ).trim();
}

async function loadRequestedApplicationContext(){
  const params=new URLSearchParams(location.search);
  requestedApplicationId=params.get('application');
  if(!requestedApplicationId)return null;

  // Resolve the exact real application first. This makes the chat header open
  // immediately even when the thread has never had a message before.
  const {data:application,error:appError}=await sb
    .from('applications')
    .select('id,job_id,candidate_id,status,applied_at')
    .eq('id',requestedApplicationId)
    .maybeSingle();

  if(appError||!application){
    console.error('Could not load requested application:',appError);
    showSetup('Could not open this application for messaging.');
    return null;
  }

  const jobId=new URLSearchParams(location.search).get('job')||application.job_id;

  const [jobResult,candidateResult]=await Promise.all([
    sb.from('jobs')
      .select('id,title,status,location,employer_id,company')
      .eq('id',jobId)
      .maybeSingle(),
    sb.from('profiles')
      .select('id,full_name,company_name,resume_data')
      .eq('id',application.candidate_id)
      .maybeSingle()
  ]);

  if(jobResult.error)console.error('Could not load message job:',jobResult.error);
  if(candidateResult.error)console.error('Could not load message candidate:',candidateResult.error);

  const job=jobResult.data||{id:jobId,title:'Job'};
  const candidate=candidateResult.data||{id:application.candidate_id,full_name:'Candidate'};

  // Validate that the signed-in user is actually part of the application.
  const isEmployer=currentUser.id===job.employer_id;
  const isCandidate=currentUser.id===application.candidate_id;
  if(!isEmployer&&!isCandidate){
    showSetup('You do not have access to this conversation.');
    return null;
  }

  requestedApplicationContext={
    application,
    job,
    candidate,
    employerId:job.employer_id,
    candidateId:application.candidate_id
  };
  return requestedApplicationContext;
}

async function getOrCreateRequestedThread(){
  const applicationId=requestedApplicationId||new URLSearchParams(location.search).get('application');
  if(!applicationId)return null;

  const {data,error}=await sb.rpc('get_or_create_application_thread',{p_application_id:applicationId});
  if(error){
    console.error('Could not create/open message thread:',error);
    showSetup('This application loaded, but the private message thread could not be created. Run the updated Alygnn messaging SQL in Supabase, then refresh.');
    return null;
  }
  return typeof data==='string'?data:(data?.id||data?.thread_id||null);
}

async function loadThreads(){
  const {data,error}=await sb
    .from('message_threads')
    .select('id,application_id,job_id,employer_id,candidate_id,created_at,updated_at,last_message_at,employer_deleted_at,candidate_deleted_at')
    .order('last_message_at',{ascending:false,nullsFirst:false});

  if(error){
    console.error(error);
    showSetup('Messaging tables are not available yet. Run the Alygnn messaging SQL in Supabase once, then refresh.');
    threads=[];
    return;
  }
  threads=data||[];
}

async function loadThreadDetails(){
  threadDetails=new Map();
  if(!threads.length)return;

  const jobIds=[...new Set(threads.map(t=>t.job_id).filter(Boolean))];
  const userIds=[...new Set(threads.flatMap(t=>[t.employer_id,t.candidate_id]).filter(Boolean))];

  const [jobsResult,profilesResult,lastMessagesResult]=await Promise.all([
    jobIds.length
      ? sb.from('jobs').select('id,title,status,location,company').in('id',jobIds)
      : Promise.resolve({data:[]}),
    userIds.length
      ? sb.from('profiles').select('id,full_name,company_name,resume_data').in('id',userIds)
      : Promise.resolve({data:[]}),
    threads.length
      ? sb.from('messages').select('id,thread_id,sender_id,body,created_at,read_at').in('thread_id',threads.map(t=>t.id)).order('created_at',{ascending:false})
      : Promise.resolve({data:[]})
  ]);

  if(jobsResult.error)console.error(jobsResult.error);
  if(profilesResult.error)console.error(profilesResult.error);
  if(lastMessagesResult.error)console.error(lastMessagesResult.error);

  const jobsMap=Object.fromEntries((jobsResult.data||[]).map(j=>[j.id,j]));
  const profilesMap=Object.fromEntries((profilesResult.data||[]).map(p=>[p.id,p]));

  const newestByThread={};
  const unreadByThread={};
  for(const m of (lastMessagesResult.data||[])){
    if(!newestByThread[m.thread_id])newestByThread[m.thread_id]=m;
    if(m.sender_id!==currentUser.id&&!m.read_at){
      unreadByThread[m.thread_id]=(unreadByThread[m.thread_id]||0)+1;
    }
  }

  for(const t of threads){
    const otherId=currentUser.id===t.employer_id?t.candidate_id:t.employer_id;
    const other=profilesMap[otherId]||{};
    const job=jobsMap[t.job_id]||{};
    const displayName=currentRole==='employer'
      ? candidateNameFromProfile(other)
      : (job.company||other.company_name||other.full_name||'Company');

    threadDetails.set(t.id,{
      thread:t,
      otherId,
      name:displayName,
      initials:initials(displayName),
      job,
      lastMessage:newestByThread[t.id]||null,
      unread:unreadByThread[t.id]||0
    });
  }
}

function filteredThreads(){
  const q=(document.getElementById('conversation-search')?.value||'').trim().toLowerCase();
  if(!q)return threads;
  return threads.filter(t=>{
    const d=threadDetails.get(t.id)||{};
    return [d.name,d.job?.title,d.lastMessage?.body].join(' ').toLowerCase().includes(q);
  });
}

function renderConversationList(){
  const el=document.getElementById('conversation-list');
  const list=filteredThreads();

  if(!list.length){
    const emptyListCopy = threads.length
      ? 'No conversations match your search.'
      : currentRole === 'employer'
        ? 'No conversations yet. Start from a candidate application to begin messaging.'
        : 'No conversations yet. Messages about your applications will appear here.';

    el.innerHTML=`<div style="padding:30px 18px;text-align:center;color:var(--muted);font-size:12px;line-height:1.55">
      ${emptyListCopy}
    </div>`;
    return;
  }

  el.innerHTML=list.map(t=>{
    const d=threadDetails.get(t.id)||{};
    const last=d.lastMessage;
    return `
      <button class="conversation ${t.id===activeThreadId?'active':''}" onclick="openThread('${t.id}')">
        <div class="avatar">${escapeHtml(d.initials||'?')}</div>
        <div class="conversation-copy">
          <div class="conversation-top">
            <div class="conversation-name">${escapeHtml(d.name||'Conversation')}</div>
            <div class="conversation-time">${escapeHtml(timeLabel(last?.created_at||t.last_message_at||t.updated_at))}</div>
          </div>
          <div class="conversation-job">${escapeHtml(d.job?.title||'Job')}</div>
          <div class="conversation-preview">${escapeHtml(last?.body||'Start the conversation')}</div>
        </div>
        ${d.unread?'<span class="unread-dot" title="Unread messages"></span>':''}
      </button>`;
  }).join('');
}

async function markThreadRead(threadId){
  const {error}=await sb
    .from('messages')
    .update({read_at:new Date().toISOString()})
    .eq('thread_id',threadId)
    .neq('sender_id',currentUser.id)
    .is('read_at',null);
  if(error)console.warn('Could not mark messages read:',error);
}

async function openThread(threadId){
  activeThreadId=threadId;
  await markThreadRead(threadId);
  await loadMessages(threadId);
  const d=threadDetails.get(threadId);
  if(d)d.unread=0;
  renderConversationList();
  renderChat();
  subscribeToMessages(threadId);
}

async function loadMessages(threadId){
  const {data,error}=await sb
    .from('messages')
    .select('id,thread_id,sender_id,body,created_at,read_at')
    .eq('thread_id',threadId)
    .order('created_at',{ascending:true});
  if(error){
    console.error(error);
    activeMessages=[];
    return;
  }
  activeMessages=data||[];
}

function activeConversationDetails(){
  if(activeThreadId){
    const existing=threadDetails.get(activeThreadId);
    if(existing)return existing;
  }

  // If the employer just clicked Message on a candidate and there are no
  // prior messages yet, still render that exact candidate/job as a new chat.
  if(requestedApplicationContext){
    const c=requestedApplicationContext;
    const otherName=currentRole==='employer'
      ? candidateNameFromProfile(c.candidate)
      : (c.job?.company||'Company');

    return {
      thread:{
        id:activeThreadId,
        application_id:c.application.id,
        job_id:c.job.id,
        employer_id:c.employerId,
        candidate_id:c.candidateId
      },
      otherId:currentRole==='employer'?c.candidateId:c.employerId,
      name:otherName,
      initials:initials(otherName),
      job:c.job,
      lastMessage:null,
      unread:0,
      pendingThread:!activeThreadId
    };
  }

  return null;
}

function renderChat(){
  const panel=document.getElementById('chat-panel');

  const d=activeConversationDetails();

  if(!d){
    const emptyChatCopy = currentRole === 'employer'
      ? 'Choose a conversation from the left, or start one from a candidate application.'
      : 'Choose a conversation from the left when you receive a message about one of your applications.';

    panel.innerHTML=`
      <div class="empty-chat">
        <div class="empty-chat-icon">✉</div>
        <div class="empty-chat-title">No conversation selected</div>
        <div class="empty-chat-copy">${emptyChatCopy}</div>
      </div>`;
    return;
  }
  const jobClosed=String(d.job?.status||'').toLowerCase()==='closed';

  panel.innerHTML=`
    <div class="chat-head">
      <div class="chat-person">
        <div class="avatar">${escapeHtml(d.initials||'?')}</div>
        <div>
          <div class="chat-head-name">${escapeHtml(d.name||'Conversation')}</div>
          <div class="chat-head-job">${currentRole==='employer'?'Applied for':'Conversation about'} ${escapeHtml(d.job?.title||'this job')}${jobClosed?' · Closed':''}</div>
        </div>
      </div>
      <div class="chat-actions">
        ${currentRole==='employer'
          ? `<a class="context-pill" href="candidates.html?job=${encodeURIComponent(d.thread?.job_id||'')}&application=${encodeURIComponent(d.thread?.application_id||'')}">View candidate</a>`
          : `<a class="context-pill" href="my-jobs.html">View application</a>`}
        ${d.thread?.id
          ? `<button type="button" class="delete-chat-btn" onclick="deleteCurrentConversation()">Delete chat</button>`
          : ''}
      </div>
    </div>

    <div class="messages" id="messages">
      ${activeMessages.length
        ? `<div class="date-divider">${new Date(activeMessages[0].created_at).toLocaleDateString([],{month:'long',day:'numeric',year:'numeric'})}</div>
           ${activeMessages.map(m=>`
             <div class="msg-row ${m.sender_id===currentUser.id?'mine':''}">
               <div class="bubble">
                 ${escapeHtml(m.body)}
                 <div class="bubble-time">${escapeHtml(fullTime(m.created_at))}</div>
               </div>
             </div>`).join('')}`
        : `<div class="empty-chat" style="min-height:100%">
             <div class="empty-chat-icon">✉</div>
             <div class="empty-chat-title">Start the conversation</div>
             <div class="empty-chat-copy">This thread is connected to ${escapeHtml(d.job?.title||'the application')}.</div>
           </div>`}
    </div>

    <div class="composer">
      <textarea id="message-input" maxlength="2000" placeholder="Write a message…" onkeydown="handleComposerKey(event)"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()">Send</button>
    </div>`;

  requestAnimationFrame(()=>{
    const messages=document.getElementById('messages');
    if(messages)messages.scrollTop=messages.scrollHeight;
  });
}


async function deleteCurrentConversation(){
  if(!activeThreadId)return;

  const d=threadDetails.get(activeThreadId);
  const personName=String(d?.name||'this conversation').trim();

  const confirmed=window.confirm(
    `Delete your chat with ${personName}? This removes it from your Alygnn inbox. The other participant keeps their copy.`
  );
  if(!confirmed)return;

  const deleteButton=document.querySelector('.delete-chat-btn');
  if(deleteButton){
    deleteButton.disabled=true;
    deleteButton.textContent='Deleting…';
  }

  const threadToDelete=activeThreadId;

  const {error}=await sb.rpc('delete_message_thread_for_me',{
    p_thread_id:threadToDelete
  });

  if(error){
    console.error('Could not delete conversation:',error);
    if(deleteButton){
      deleteButton.disabled=false;
      deleteButton.textContent='Delete chat';
    }
    showSetup(error.message||'Could not delete this conversation. Run the updated messaging SQL, then try again.');
    return;
  }

  if(messageChannel){
    sb.removeChannel(messageChannel);
    messageChannel=null;
  }

  requestedApplicationId=null;
  requestedApplicationContext=null;
  activeThreadId=null;
  activeMessages=[];

  try{
    const cleanUrl=new URL(window.location.href);
    cleanUrl.searchParams.delete('thread');
    cleanUrl.searchParams.delete('application');
    cleanUrl.searchParams.delete('job');
    history.replaceState({},'',cleanUrl.pathname+cleanUrl.search);
  }catch(_){}

  await loadThreads();
  await loadThreadDetails();

  activeThreadId=threads[0]?.id||null;

  if(activeThreadId){
    await markThreadRead(activeThreadId);
    await loadMessages(activeThreadId);
    subscribeToMessages(activeThreadId);
  }

  renderConversationList();
  renderChat();
}

function handleComposerKey(event){
  if(event.key==='Enter'&&!event.shiftKey){
    event.preventDefault();
    sendMessage();
  }
}

async function sendMessage(){
  const input=document.getElementById('message-input');
  const btn=document.getElementById('send-btn');
  if(!input||!btn)return;
  const body=input.value.trim();
  if(!body)return;

  btn.disabled=true;

  // A brand-new application may not have a thread until the first chat is
  // opened. Create/fetch it now rather than leaving the employer on an empty page.
  if(!activeThreadId&&requestedApplicationId){
    activeThreadId=await getOrCreateRequestedThread();
    if(activeThreadId){
      await loadThreads();
      await loadThreadDetails();
    }
  }

  if(!activeThreadId){
    btn.disabled=false;
    showSetup('Could not start this conversation. Run the updated Alygnn messaging SQL in Supabase, then try again.');
    return;
  }

  const {data,error}=await sb
    .from('messages')
    .insert({thread_id:activeThreadId,sender_id:currentUser.id,body})
    .select('id,thread_id,sender_id,body,created_at,read_at')
    .single();

  btn.disabled=false;
  if(error){
    console.error(error);
    showSetup('Could not send the message. Check the messaging SQL/RLS setup.');
    return;
  }

  input.value='';
  activeMessages.push(data);
  const d=threadDetails.get(activeThreadId);
  if(d)d.lastMessage=data;
  renderConversationList();
  renderChat();
}

function subscribeToMessages(threadId){
  if(messageChannel)sb.removeChannel(messageChannel);

  messageChannel=sb.channel('messages-thread-'+threadId)
    .on('postgres_changes',{
      event:'INSERT',schema:'public',table:'messages',
      filter:`thread_id=eq.${threadId}`
    },async payload=>{
      const m=payload.new;
      if(!activeMessages.some(x=>x.id===m.id))activeMessages.push(m);
      if(m.sender_id!==currentUser.id)await markThreadRead(threadId);
      const d=threadDetails.get(threadId);
      if(d){d.lastMessage=m;d.unread=0}
      renderConversationList();
      renderChat();
    })
    .subscribe();
}

function subscribeToThreads(){
  if(threadChannel)sb.removeChannel(threadChannel);

  threadChannel=sb.channel('message-threads-'+currentUser.id)
    .on('postgres_changes',{
      event:'*',schema:'public',table:'message_threads'
    },async ()=>{
      await refreshAll(false);
    })
    .on('postgres_changes',{
      event:'INSERT',schema:'public',table:'messages'
    },async payload=>{
      if(payload.new.thread_id===activeThreadId)return;
      await refreshAll(false);
    })
    .subscribe();
}

async function refreshAll(chooseFirst=true){
  await loadThreads();
  await loadThreadDetails();

  if(activeThreadId&&!threads.some(t=>t.id===activeThreadId))activeThreadId=null;
  if(!activeThreadId&&chooseFirst&&threads.length)activeThreadId=threads[0].id;

  renderConversationList();

  if(activeThreadId){
    await loadMessages(activeThreadId);
    renderChat();
  }else{
    renderChat();
  }
}

async function resolveEmployerCompanyName(profile, sessionUser){
  // Google/email metadata may already contain the company name.
  const fromMetadata = String(sessionUser?.user_metadata?.company_name || '').trim();
  if(fromMetadata) return fromMetadata;

  // Backward-compatible fallback in case an older employer row stores the
  // company name in the employers table instead of profiles.
  try{
    const {data,error}=await sb
      .from('employers')
      .select('company_name')
      .eq('id',sessionUser.id)
      .maybeSingle();

    if(!error && String(data?.company_name || '').trim()){
      return String(data.company_name).trim();
    }
  }catch(error){
    console.warn('Could not read employer company name fallback:', error);
  }

  // Never show the generic word "Employer" as the account name.
  return String(profile?.full_name || sessionUser?.user_metadata?.full_name || sessionUser?.user_metadata?.name || 'Company').trim();
}

async function init(){
  let {data:{session},error}=await sb.auth.getSession();

  if(!session && !error){
    await new Promise(resolve=>setTimeout(resolve,120));
    const retry=await sb.auth.getSession();
    session=retry.data?.session||null;
    error=retry.error||null;
  }

  if(error||!session){
    location.replace('login.html');
    return;
  }

  currentUser=session.user;

  const {data:profile,error:profileError}=await sb
    .from('profiles')
    .select('id,role,full_name,resume_file_path,resume_data,preferences')
    .eq('id',currentUser.id)
    .maybeSingle();

  if(profileError){
    console.error('Could not load Alygnn profile for Messages:', profileError);
  }

  currentProfile=profile||{};
  currentRole=String(
    profile?.role ||
    currentUser.user_metadata?.role ||
    currentUser.app_metadata?.role ||
    'candidate'
  ).toLowerCase();

  // Older candidate accounts may use "seeker" / "jobseeker" instead of
  // "candidate". They are all candidate-side accounts.
  if(currentRole==='seeker'||currentRole==='jobseeker'){
    currentRole='candidate';
  }

  // Candidate Swipe stays unavailable until both onboarding pieces exist,
  // but the whole candidate nav resolves at once so Swipe never pops in late.
  if(currentRole!=='employer'){
    const hasResume=!!(profile?.resume_file_path||profile?.resume_data);
    const hasPreferences=!!profile?.preferences;
    syncCandidateSwipeNav(hasResume && hasPreferences);
  }

  if(currentRole==='employer'){
    document.getElementById('nav-name').textContent=
      await resolveEmployerCompanyName(profile,currentUser);
  }else{
    document.getElementById('nav-name').textContent=
      profile?.full_name||currentUser.user_metadata?.full_name||currentUser.user_metadata?.name||'Candidate';
  }

  setSidebar();

  // If arriving from Candidates → Message, resolve that exact application
  // first so the correct candidate/job chat appears immediately.
  await loadRequestedApplicationContext();

  const requestedThreadId=await getOrCreateRequestedThread();
  await loadThreads();
  await loadThreadDetails();

  const urlThread=new URLSearchParams(location.search).get('thread');

  // Prefer the exact requested application. Do not silently open some other
  // existing conversation when the user clicked Message on a candidate.
  if(requestedApplicationId){
    const matchingThread=threads.find(t=>t.application_id===requestedApplicationId);
    activeThreadId=requestedThreadId||matchingThread?.id||null;
  }else{
    activeThreadId=urlThread||threads[0]?.id||null;
  }

  renderConversationList();
  if(activeThreadId){
    await markThreadRead(activeThreadId);
    await loadMessages(activeThreadId);
  }else{
    activeMessages=[];
  }

  // Even with zero previous messages, renderChat() uses the resolved real
  // application context and shows "Start the conversation" for that candidate.
  renderChat();
  subscribeToThreads();
  if(activeThreadId)subscribeToMessages(activeThreadId);

  document.body.classList.add('ready');
}

window.addEventListener('beforeunload',()=>{
  if(messageChannel)sb.removeChannel(messageChannel);
  if(threadChannel)sb.removeChannel(threadChannel);
});

init();
</script>
