<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Confirm name change — Alygnn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --brand: #5D7FA3; --bg: #F6F8F7; --card-bg: #FCFCFA;
    --text: #1A2530; --border: #DDE3E8; --mint: #6FBF8F; --text-muted: #4A5968;
  }
  body {
    font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 420px; background: var(--card-bg);
    border: 1px solid var(--border); border-radius: 20px; padding: 40px;
    text-align: center;
  }
  .logo {
    font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--brand);
    margin-bottom: 24px; text-decoration: none; display: block;
  }
  .icon { font-size: 40px; margin-bottom: 16px; }
  h1 {
    font-family: 'DM Serif Display', serif; font-size: 24px; letter-spacing: -0.5px;
    margin-bottom: 10px;
  }
  p { font-size: 14px; color: var(--text-muted); line-height: 1.6; margin-bottom: 24px; }
  .btn {
    display: inline-block; background: var(--brand); color: white; text-decoration: none;
    border-radius: 100px; padding: 13px 28px; font-size: 15px; font-weight: 500;
  }
  .btn:hover { opacity: 0.88; }
  .loading { font-size: 14px; color: var(--text-muted); }
</style>
</head>
<body>

<div class="loading" id="loading">Confirming…</div>

<div class="card" id="card" style="display:none;">
  <a href="index.html" class="logo">Alygnn.</a>
  <div class="icon" id="icon"></div>
  <h1 id="title"></h1>
  <p id="message"></p>
  <a href="account.html" class="btn">Go to my account</a>
</div>

<script>
  const SUPABASE_URL = 'https://auth.alygnn.com';

  function showResult(icon, title, message) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('icon').textContent = icon;
    document.getElementById('title').textContent = title;
    document.getElementById('message').textContent = message;
    document.getElementById('card').style.display = 'block';
  }

  (async () => {
    const token = new URLSearchParams(window.location.search).get('token');

    if (!token) {
      showResult('⚠️', 'Missing confirmation link', 'This link looks incomplete. Please request the name change again from your account page.');
      return;
    }

    try {
      const res = await fetch(SUPABASE_URL + '/functions/v1/confirm-name-change', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token }),
      });

      const result = await res.json().catch(() => ({}));

      if (!res.ok) {
        showResult('⚠️', 'Could not confirm', result.error || 'Something went wrong. Please try requesting the change again.');
        return;
      }

      showResult('✓', 'Name updated', `Your name has been changed to "${result.newName}".`);
    } catch (err) {
      console.error('confirm-name-change page error:', err);
      showResult('⚠️', 'Something went wrong', 'Please try again, or request the name change again from your account page.');
    }
  })();
</script>
</body>
</html>
