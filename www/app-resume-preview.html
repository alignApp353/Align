<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'DM Sans',Arial,sans-serif!important}
:root{--brand:#5D7FA3;--brand-dark:#35679A;--sage:#8CB69B;--bg:#F5F8F8;--card:#fff;--text:#172333;--muted:#66788A;--border:#DCE5EB;--soft:#EFF4F7;--shadow:0 14px 38px rgba(23,35,51,.055)}

<script>
const sb=supabase.createClient(
  'https://auth.alygnn.com',
  'sb_publishable_3l8krRh6WCyvKfNumWDBDw_C6CKr7rG',
  {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}
);

let user=null;
let profile=null;
let signedUrl='';
const RESUME_TEMPLATES=[
  {id:'prime-ats',name:'Prime ATS'},{id:'pure-ats',name:'Pure ATS'},{id:'simple-ats',name:'Simple ATS'},
  {id:'classic',name:'Classic'},{id:'traditional',name:'Traditional'},{id:'modern',name:'Modern'},
  {id:'minimal',name:'Minimal'},{id:'professional',name:'Professional'},{id:'executive',name:'Executive'},
  {id:'two-column',name:'Two Column ATS'},{id:'skills-first',name:'Skills First'},{id:'combination',name:'Combination'},
  {id:'technical',name:'Technical'},{id:'student',name:'Student / Entry'},{id:'creative',name:'Creative'},{id:'compact',name:'Compact'}
];
const $=id=>document.getElementById(id);

function parseObject(value){
  if(!value)return {};
  if(typeof value==='object'&&!Array.isArray(value))return value;
  if(typeof value==='string'){
    try{
      const parsed=JSON.parse(value);
      return parsed&&typeof parsed==='object'?parsed:{};
    }catch(_){return {}}
  }
  return {};
}
function esc(value){
  return String(value??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  })[c]);
}
function showError(text){
  $('message').textContent=text;
  $('message').hidden=false;
}
function hasResume(){
  return Boolean(
    profile?.resume_file_path||
    profile?.resume_url||
    profile?.resume_text||
    Object.keys(parseObject(profile?.resume_data)).length
  );
}
function currentSource(){
  if(profile?.resume_file_path) return 'upload';
  if(String(profile?.resume_source||'').toLowerCase()==='upload') return 'upload';
  return 'builder';
}
function templateName(id){return RESUME_TEMPLATES.find(t=>t.id===id)?.name||'Prime ATS'}
function resumeParts(data){
  const person=parseObject(data.personal);
  const fullName=[person.first_name,person.last_name].filter(Boolean).join(' ').trim()||profile?.full_name||user?.email?.split('@')[0]||'Alygnn Candidate';
  const contact=[[person.city,person.state].filter(Boolean).join(', '),person.email||user?.email,person.phone].filter(Boolean).join(' · ');
  const experience=Array.isArray(data.experience)?data.experience:[];
  const education=Array.isArray(data.education)?data.education:[];
  const skills=Array.isArray(data.skills)?data.skills:[];
  const experienceHtml=experience.length?experience.map(item=>{const role=[item.title||item.job_title,item.company].filter(Boolean).join(' · ');const dates=[item.start||item.start_date,item.end||item.end_date].filter(Boolean).join(' – ');const meta=[dates,item.location].filter(Boolean).join(' · ');const details=item.description||item.details||'';return `<div class="rd-item"><div class="rd-item-title">${esc(role||'Experience')}</div>${meta?`<div class="rd-meta">${esc(meta)}</div>`:''}${details?`<div class="rd-copy">${esc(details)}</div>`:''}</div>`;}).join(''):'<div class="rd-muted">No work experience added.</div>';
  const educationHtml=education.length?education.map(item=>{const title=[item.degree,item.school||item.school_name||item.institution].filter(Boolean).join(' · ');const dates=[item.start||item.start_date,item.end||item.end_date||item.graduation_date].filter(Boolean).join(' – ');const meta=[dates,item.location].filter(Boolean).join(' · ');return `<div class="rd-item"><div class="rd-item-title">${esc(title||'Education')}</div>${meta?`<div class="rd-meta">${esc(meta)}</div>`:''}</div>`;}).join(''):'<div class="rd-muted">No education added.</div>';
  const skillsHtml=skills.length?`<div class="rd-skills">${skills.map(skill=>`<span class="rd-skill">${esc(skill)}</span>`).join('')}</div>`:'<div class="rd-muted">No skills added.</div>';
  return {fullName,contact,experience:experienceHtml,education:educationHtml,skills:skillsHtml};
}
function rdSection(title,content){return `<section class="rd-section"><div class="rd-title">${title}</div>${content}</section>`}
function buildResumeHtml(data){
  const design=parseObject(data._alygnn_design);
  const id=design.template||'prime-ats',accent=design.accent||'#35679A',font=design.font||'sans',density=design.density||'comfortable';
  const parts=resumeParts(data);
  const header=`<header class="resume-header"><div class="rd-name">${esc(parts.fullName)}</div><div class="rd-contact">${esc(parts.contact||'Contact information')}</div></header>`;
  const exp=rdSection('Experience',parts.experience),edu=rdSection('Education',parts.education),sk=rdSection('Skills',parts.skills);
  let body='';
  if(id==='student')body=edu+sk+exp;else if(['skills-first','technical','combination'].includes(id))body=sk+exp+edu;else body=exp+edu+sk;
  if(['professional','two-column','creative'].includes(id))return `<article class="resume-design template-${id} ${font==='serif'?'font-serif':''} ${density==='compact'?'compact':''}" style="--resume-accent:${esc(accent)}"><div class="resume-inner">${header}<div class="rd-two"><aside class="rd-side">${rdSection('Contact',`<div class="rd-copy">${esc(parts.contact||'Contact information')}</div>`)}${sk}</aside><main class="rd-main">${exp}${edu}</main></div></div></article>`;
  return `<article class="resume-design template-${id} ${font==='serif'?'font-serif':''} ${density==='compact'?'compact':''}" style="--resume-accent:${esc(accent)}"><div class="resume-inner">${header}${body}</div></article>`;
}
function renderBuilderResume(){
  const data=parseObject(profile?.resume_data);
  $('previewBody').innerHTML=buildResumeHtml(data);
  const design=parseObject(data._alygnn_design);
  $('sourceBadge').textContent=templateName(design.template||'prime-ats');
}


async function renderPdfWithPdfJs(url){
  const previewBody=$('previewBody');

  previewBody.innerHTML=`
    <div class="pdf-preview" id="pdfPreview">
      <div class="pdf-preview-loading" id="pdfPreviewLoading">
        <div>
          <div class="spinner"></div>
          <div>Rendering your resume…</div>
        </div>
      </div>
    </div>
  `;

  const container=$('pdfPreview');

  try{
    if(!window.pdfjsLib){
      throw new Error('PDF preview library did not load.');
    }

    window.pdfjsLib.GlobalWorkerOptions.workerSrc=
      'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

    const loadingTask=window.pdfjsLib.getDocument({
      url,
      withCredentials:false
    });

    const pdf=await loadingTask.promise;

    container.innerHTML='';

    /*
     * Deliberately render a little smaller than the available card width.
     * This keeps the full Letter/A4 page visible on phones instead of making
     * uploaded resumes feel zoomed or clipping the right edge.
     */
    const containerWidth=
      container.getBoundingClientRect().width ||
      container.clientWidth ||
      520;

    const maxWidth=Math.max(
      240,
      Math.min(
        820,
        (containerWidth - 40) * 0.92
      )
    );

    // Render every page so the user can scroll through the entire resume.
    for(let pageNumber=1;pageNumber<=pdf.numPages;pageNumber+=1){
      const page=await pdf.getPage(pageNumber);
      const baseViewport=page.getViewport({scale:1});
      const cssScale=maxWidth/baseViewport.width;

      // Render at a higher internal resolution for crisp text on phones.
      const outputScale=Math.min(
        window.devicePixelRatio || 1,
        2
      );

      const viewport=page.getViewport({
        scale:cssScale*outputScale
      });

      const pageWrap=document.createElement('div');
      pageWrap.className='pdf-page';

      const canvas=document.createElement('canvas');
      const context=canvas.getContext('2d',{
        alpha:false
      });

      canvas.width=Math.floor(viewport.width);
      canvas.height=Math.floor(viewport.height);
      canvas.style.width='100%';
      canvas.style.height='auto';

      pageWrap.appendChild(canvas);
      container.appendChild(pageWrap);

      await page.render({
        canvasContext:context,
        viewport
      }).promise;
    }

  }catch(error){
    console.error('PDF preview error:',error);

    container.innerHTML=`
      <div class="pdf-preview-error">
        <div>
          <strong>Preview unavailable</strong>
          <div>
            Your resume is saved, but this device could not render the PDF preview.
          </div>
          <button
            class="pdf-open-fallback"
            id="pdfOpenFallback"
            type="button"
          >
            Open Resume
          </button>
        </div>
      </div>
    `;

    $('pdfOpenFallback').onclick=()=>{
      window.location.href=url;
    };
  }
}

async function renderUploadedResume(){
  const path=profile?.resume_file_path;
  if(!path){
    showError('The uploaded resume file could not be found.');
    return;
  }

  const {data,error}=await sb.storage.from('resumes').createSignedUrl(path,900);
  if(error||!data?.signedUrl){
    showError(error?.message||'Unable to open your uploaded resume.');
    return;
  }

  signedUrl=data.signedUrl;
  const ext=String(path).split('.').pop().toLowerCase();
  const fileLabel=path.split('/').pop();

  if(ext==='pdf'){
    await renderPdfWithPdfJs(signedUrl);
  }else{
    $('previewBody').innerHTML=`
      <div class="file-fallback">
        <div class="file-icon">▤</div>
        <div class="file-name">${esc(fileLabel)}</div>
        <div class="file-copy">Your resume is saved. Word files may open in the device viewer instead of displaying directly inside Alygnn.</div>
        <button class="open-file" id="openFileBtn" type="button">Open Resume</button>
      </div>
    `;
    $('openFileBtn').onclick=()=>window.location.href=signedUrl;
  }
}


function preferencesAreComplete(){
  const preferences=parseObject(profile?.preferences);
  const meta=parseObject(user?.user_metadata);
  const jobTypes=Array.isArray(preferences.jobTypes)
    ?preferences.jobTypes
    :[];

  return Boolean(
    preferences.preferences_complete ||
    profile?.preferences_complete ||
    meta.preferences_complete ||
    (
      String(preferences.query||'').trim() &&
      String(
        preferences.location ||
        preferences.city ||
        preferences.state ||
        preferences.country ||
        ''
      ).trim() &&
      (
        jobTypes.length ||
        String(preferences.jobType||'').trim()
      )
    )
  );
}

function configureResumeFlow(){
  const complete=preferencesAreComplete();
  $('continueBtn').textContent=complete?'Go to Preferences':'Continue to Preferences';
  $('backBtn').setAttribute('aria-label','Back to dashboard');
}

function goBackFromResume(){
  window.location.href='app-account.html';
}

function editResume(){
  if(currentSource()==='builder'){
    window.location.href='app-resume-builder.html';
    return;
  }
  $('replaceResumeInput').click();
}

async function replaceUploadedResume(file){
  if(!file || !user || !profile) return;

  const extension=(file.name.split('.').pop()||'').toLowerCase();
  if(!['pdf','doc','docx'].includes(extension)){
    showError('Choose a PDF, DOC, or DOCX resume.');
    return;
  }
  if(file.size<=0 || file.size>10*1024*1024){
    showError(file.size<=0?'That file appears to be empty.':'Your resume must be 10MB or smaller.');
    return;
  }

  const button=$('editBtn');
  const original=button.textContent;
  button.disabled=true;
  button.textContent='Replacing…';
  $('message').hidden=true;

  try{
    const oldPath=profile.resume_file_path || null;
    const newPath=`${user.id}/resume-${Date.now()}.${extension}`;

    const {error:uploadError}=await sb.storage
      .from('resumes')
      .upload(newPath,file,{cacheControl:'3600',upsert:false,contentType:file.type||undefined});
    if(uploadError) throw uploadError;

    const resumeData=parseObject(profile.resume_data);
    const onboarding=parseObject(resumeData._alygnn_onboarding);
    resumeData._alygnn_onboarding={...onboarding,preview_reviewed:false};

    const {error:saveError}=await sb.from('profiles').update({
      resume_file_path:newPath,
      resume_source:'upload',
      resume_data:resumeData,
      updated_at:new Date().toISOString()
    }).eq('id',user.id);

    if(saveError){
      await sb.storage.from('resumes').remove([newPath]).catch(()=>{});
      throw saveError;
    }

    if(oldPath && oldPath!==newPath){
      await sb.storage.from('resumes').remove([oldPath]).catch(()=>{});
    }

    profile.resume_file_path=newPath;
    profile.resume_source='upload';
    profile.resume_data=resumeData;
    $('sourceBadge').textContent='Uploaded resume';
    button.textContent='Change Resume';
    await renderUploadedResume();
    window.scrollTo({top:0,behavior:'smooth'});
  }catch(error){
    console.error('Resume replacement failed:',error);
    showError(error?.message||'We could not replace your resume. Please try again.');
    button.textContent=original;
  }finally{
    button.disabled=false;
    $('replaceResumeInput').value='';
  }
}

async function initialize(){
  const {data,error}=await sb.auth.getSession();
  if(error||!data.session){
    window.location.replace('app-login.html');
    return;
  }

  user=data.session.user;

  const {data:profileData,error:profileError}=await sb
    .from('profiles')
    .select('*')
    .eq('id',user.id)
    .maybeSingle();

  if(profileError){
    console.error(profileError);
    window.location.replace('app-home.html');
    return;
  }

  profile=profileData;

  configureResumeFlow();

  if(!hasResume()){
    window.location.replace('app-account.html');
    return;
  }

  const source=currentSource();
  $('sourceBadge').textContent=source==='builder'?'Resume template':'Uploaded resume';
  $('editBtn').textContent=source==='builder'?'Edit Resume':'Change Resume';

  if(source==='builder'){
    renderBuilderResume();
  }else{
    await renderUploadedResume();
  }

  $('loading').hidden=true;
  $('content').hidden=false;
  $('footer').hidden=false;
}

async function continueToPreferences(){
  if(preferencesAreComplete()){
    window.location.href='app-preferences.html?edit=1';
    return;
  }

  const button=$('continueBtn');
  button.disabled=true;
  button.textContent='Saving…';

  try{
    const resumeData=parseObject(profile?.resume_data);
    const onboarding=parseObject(resumeData._alygnn_onboarding);

    resumeData._alygnn_onboarding={
      ...onboarding,
      preview_reviewed:true,
      preview_reviewed_at:new Date().toISOString()
    };

    const {error}=await sb
      .from('profiles')
      .update({
        resume_data:resumeData,
        updated_at:new Date().toISOString()
      })
      .eq('id',user.id);

    if(error)throw error;

    profile.resume_data=resumeData;
    window.location.href='app-preferences.html';
  }catch(error){
    console.error(error);
    showError(error?.message||'We could not save your resume review. Please try again.');
    button.disabled=false;
    button.textContent='Continue to Preferences';
  }
}

$('backBtn').onclick=goBackFromResume;
$('editBtn').onclick=editResume;
$('replaceResumeInput').addEventListener('change',event=>{
  const file=event.target.files?.[0];
  if(file) replaceUploadedResume(file);
});
$('continueBtn').onclick=continueToPreferences;

initialize();
</script>
