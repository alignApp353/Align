<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark">
<title>Alygnn — Chat</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'DM Sans',Arial,sans-serif!important}:root{--brand:#5D7FA3;--brand-dark:#345F91;--sage:#8CB69B;--bg:#F6F8F7;--card:#fff;--text:#172333;--muted:#647282;--border:#DDE3E8;--soft:#EAF0F6;--danger:#C74747}@media(prefers-color-scheme:dark){:root{--bg:#061821;--card:#10232D;--text:#F3F7FA;--muted:#A9B8C5;--border:#29404C;--soft:#172A40}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}body{overflow:hidden}.app{height:100dvh;display:grid;grid-template-rows:auto auto 1fr auto}.header{padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;border-bottom:1px solid var(--border);background:var(--bg)}.back{width:44px;height:44px;border:1px solid var(--border);border-radius:50%;background:var(--card);color:var(--text);font-size:21px}.logo{text-align:center;font-family:'DM Serif Display',Georgia,serif!important;color:var(--brand);font-size:30px}.logo span{color:var(--sage)}.context{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--card)}.person{font-size:16px;font-weight:900}.job{margin-top:3px;color:var(--muted);font-size:11px}.rule{margin-top:7px;color:var(--muted);font-size:10px;line-height:1.4}.messages{overflow-y:auto;padding:18px 16px 24px;display:flex;flex-direction:column;gap:9px}.bubble{max-width:82%;padding:11px 13px;border-radius:17px;font-size:13px;line-height:1.45;white-space:pre-wrap;word-break:break-word}.mine{align-self:flex-end;background:var(--brand-dark);color:#fff;border-bottom-right-radius:5px}.theirs{align-self:flex-start;background:var(--card);border:1px solid var(--border);border-bottom-left-radius:5px}.stamp{display:block;margin-top:5px;font-size:8px;opacity:.65}.empty{margin:auto;padding:28px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.55}.empty strong{display:block;color:var(--text);font-size:16px;margin-bottom:6px}.composer{padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr auto;gap:8px;border-top:1px solid var(--border);background:var(--card)}textarea{resize:none;max-height:120px;min-height:46px;border:1px solid var(--border);border-radius:15px;background:var(--bg);color:var(--text);padding:12px 13px;outline:none;font-size:13px}.send{min-width:72px;border:0;border-radius:15px;background:var(--brand-dark);color:#fff;font-weight:900;padding:0 16px}.send:disabled{opacity:.45}.notice{margin:10px 16px 0;padding:11px 13px;border-radius:13px;background:var(--soft);color:var(--brand-dark);font-size:11px;font-weight:700;line-height:1.45}.notice.error{background:#FCECEC;color:var(--danger)}
</style></head><body><div class="app"><header class="header"><button class="back" id="back">←</button><div class="logo">Alygnn<span>.</span></div><div></div></header><div><div class="context"><div class="person" id="person">Conversation</div><div class="job" id="job">Job application</div><div class="rule" id="rule"></div></div><div class="notice" id="notice" hidden></div></div><main class="messages" id="messages"><div class="empty"><strong>Loading conversation…</strong></div></main><div class="composer" id="composer"><textarea id="input" maxlength="2000" rows="1" placeholder="Write a message…"></textarea><button class="send" id="send">Send</button></div></div>
<script>
const sb=supabase.createClient('https://auth.alygnn.com','sb_publishable_3l8krRh6WCyvKfNumWDBDw_C6CKr7rG',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let session=null,role='candidate',applicationId='',conversation=null,application=null,job=null,profile=null,channel=null,sending=false;
function fmt(v){const d=new Date(v);return Number.isNaN(d.getTime())?'':d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}
function candidateName(){return profile?.full_name||profile?.name||[profile?.first_name,profile?.last_name].filter(Boolean).join(' ')||application?.candidate_name||'Candidate'}function companyName(){return job?.company||job?.company_name||job?.employer_name||'Employer'}
function setNotice(text,error=false){$('notice').hidden=!text;$('notice').className='notice'+(error?' error':'');$('notice').textContent=text||''}
async function metadata(){const ar=await sb.from('applications').select('*').eq('id',applicationId).maybeSingle();if(ar.error)throw ar.error;application=ar.data;if(!application)throw new Error('Application not found.');const jr=await sb.from('jobs').select('*').eq('id',application.job_id).maybeSingle();if(!jr.error)job=jr.data||null;const pid=application.candidate_id||application.user_id||application.profile_id;if(pid){const pr=await sb.from('profiles').select('*').eq('id',pid).maybeSingle();if(!pr.error)profile=pr.data||null}$('person').textContent=role==='employer'?candidateName():companyName();$('job').textContent=job?.title||application.job_title||'Job application';$('rule').textContent=role==='employer'?'You control the first contact. The candidate can reply only after you send the first message.':'This chat was opened by the employer after you applied. You can reply here.'}
async function findConversation(){const r=await sb.from('application_conversations').select('*').eq('application_id',applicationId).maybeSingle();if(r.error){const msg=String(r.error.message||'');if(msg.toLowerCase().includes('does not exist'))throw new Error('Messaging is not installed yet.');throw r.error}conversation=r.data||null}
async function loadMessages(){if(!conversation){$('messages').innerHTML=`<div class="empty"><strong>${role==='employer'?'Send the first message':'No conversation yet'}</strong>${role==='employer'?'The candidate will not see a chat until you send this first message.':'The employer has not started a conversation for this application.'}</div>`;if(role==='candidate'){$('composer').style.display='none'}return}const r=await sb.from('application_messages').select('*').eq('conversation_id',conversation.id).order('created_at',{ascending:true});if(r.error)throw r.error;const rows=r.data||[];$('messages').innerHTML=rows.length?rows.map(m=>`<div class="bubble ${String(m.sender_id)===String(session.user.id)?'mine':'theirs'}">${esc(m.body)}<span class="stamp">${esc(fmt(m.created_at))}</span></div>`).join(''):'<div class="empty"><strong>Conversation started</strong>No messages yet.</div>';$('messages').scrollTop=$('messages').scrollHeight;await markRead()}
async function markRead(){if(!conversation)return;try{await sb.rpc('mark_application_conversation_read',{p_conversation_id:conversation.id})}catch(e){console.warn(e)}}
function subscribe(){if(channel)sb.removeChannel(channel);if(!conversation)return;channel=sb.channel('chat-'+conversation.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'application_messages',filter:`conversation_id=eq.${conversation.id}`},async()=>{await loadMessages()}).subscribe()}
async function send(){const body=$('input').value.trim();if(!body||sending)return;sending=true;$('send').disabled=true;setNotice('');try{if(!conversation){if(role!=='employer')throw new Error('Only the employer can start this conversation.');const r=await sb.rpc('start_application_conversation',{p_application_id:applicationId,p_body:body});if(r.error)throw r.error;conversation={id:r.data?.conversation_id,application_id:applicationId};$('input').value='';await findConversation();await loadMessages();subscribe();return}const r=await sb.from('application_messages').insert({conversation_id:conversation.id,sender_id:session.user.id,body});if(r.error)throw r.error;$('input').value='';await loadMessages()}catch(error){console.error(error);setNotice(error?.message||'Message could not be sent.',true)}finally{sending=false;$('send').disabled=false;$('input').focus()}}
$('send').onclick=send;$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('back').onclick=()=>location.href='app-messages.html?role='+role;
(async()=>{const q=new URLSearchParams(location.search);role=q.get('role')==='employer'?'employer':'candidate';applicationId=String(q.get('application')||'');if(!applicationId){setNotice('Application ID is missing.',true);$('composer').style.display='none';return}const {data,error}=await sb.auth.getSession();if(error||!data.session){location.replace('app-login.html');return}session=data.session;try{await metadata();await findConversation();if(role==='candidate'&&!conversation){$('composer').style.display='none'}await loadMessages();subscribe()}catch(error){console.error(error);setNotice(error?.message||'Conversation could not be loaded.',true);$('composer').style.display='none'}})();
</script></body></html>
