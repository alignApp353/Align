<script>
(function(){
  const saved=
    localStorage.getItem('alygnn_candidate_theme') ||
    localStorage.getItem('alygnn_theme') ||
    localStorage.getItem('alygnn-theme') ||
    'system';

  const preference=['system','light','dark'].includes(saved)?saved:'system';
  const resolved=preference==='system'
    ?((window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light')
    :preference;

  document.documentElement.dataset.theme=resolved;
  document.documentElement.dataset.themePreference=preference;

  const meta=document.getElementById('alygnn-theme-color');
  if(meta)meta.setAttribute('content',resolved==='dark'?'#061821':'#F6F8F7');
})();
</script>

<body data-employer-login-build="2026-08-27-employer-detection-theme-fix">
<main class="page">

</div>

</div>
<div class="form">
<div class="field">
<div class="label-row"><label for="email">Email address</label></div>
<div class="input-wrap">
<svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>

</div></section></main>
<script>
const sb=supabase.createClient('https://auth.alygnn.com','sb_publishable_3l8krRh6WCyvKfNumWDBDw_C6CKr7rG',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const ACCOUNT_TYPE='employer';
const TARGET_PAGE='app-employer-dashboard.html';
const ONBOARDING_PAGE='app-employer-onboarding.html';
const STATUS_PAGE='app-employer-verification-status.html';
function showMessage(text,type){const m=document.getElementById('message');m.textContent=text;m.className='message '+type}
function setLoading(b,l,lt,nt){b.disabled=l;b.textContent=l?lt:nt}
function friendlyError(error){const raw=String(error?.message||'').toLowerCase();if(raw.includes('invalid login credentials')||raw.includes('invalid credentials'))return'Incorrect email or password. Please try again.';if(raw.includes('email not confirmed')||raw.includes('confirm your email'))return'Please verify your email before signing in.';if(raw.includes('fetch')||raw.includes('network')||raw.includes('failed to fetch'))return'Unable to connect. Please check your internet connection.';if(raw.includes('too many requests')||raw.includes('rate limit'))return'Too many attempts. Please wait a few minutes and try again.';return error?.message||'Unable to sign in. Please try again.'}
function employerSetupKey(userId){
  return `alygnn_employer_setup_complete_${userId}`;
}
function employerCompanyKey(userId){
  return `alygnn_company_id_${userId}`;
}
function employerStatusKey(userId){
  return `alygnn_employer_verification_status_${userId}`;
}
function normalizeEmployerStatus(value){
  const status=String(value||'pending_review').toLowerCase().trim();
  if(status==='approved')return'approved';
  if(status==='rejected'||status==='denied')return'rejected';
  if(status==='deactivated')return'deactivated';
  return'pending_review';
}
function rememberEmployerCompany(userId,companyId,status,accountNumber=''){
  const normalized=normalizeEmployerStatus(status);

  if(companyId){
    localStorage.setItem('alygnn_company_id',String(companyId));
    sessionStorage.setItem('alygnn_company_id',String(companyId));
    localStorage.setItem(employerCompanyKey(userId),String(companyId));
  }

  localStorage.setItem('alygnn_employer_verification_status',normalized);
  localStorage.setItem(employerStatusKey(userId),normalized);
  localStorage.setItem(employerSetupKey(userId),'true');

  if(accountNumber){
    localStorage.setItem('alygnn_company_account_number',String(accountNumber));
  }
}
function routeExistingEmployer(status){
  return normalizeEmployerStatus(status)==='approved'
    ? TARGET_PAGE
    : STATUS_PAGE;
}
async function employerDestination(userId){
  /*
    IMPORTANT:
    An employer is NEW only when we cannot find an existing company/workspace
    anywhere. Do NOT use blueprint_complete as the deciding factor.
  */
  const {data:{session}}=await sb.auth.getSession();
  const user=session?.user;

  // 1. The verification row is a strong signal that the employer already
  // created a company. company_id is enough to skip onboarding.
  try{
    const {data:verification,error}=await sb
      .from('employer_verifications')
      .select('company_id,blueprint_complete,verification_status')
      .eq('user_id',userId)
      .limit(1)
      .maybeSingle();

    if(error){
      console.warn('Employer verification lookup failed:',error);
    }else if(verification?.company_id || verification?.blueprint_complete){
      const companyId=String(verification.company_id||'').trim();
      const status=normalizeEmployerStatus(
        verification.verification_status||'pending_review'
      );

      rememberEmployerCompany(userId,companyId,status);
      return routeExistingEmployer(status);
    }
  }catch(error){
    console.warn('Employer verification lookup threw:',error);
  }

  // 2. Ask Alygnn's server-side company resolver. This avoids browser RLS
  // hiding an existing company from the app.
  if(session?.access_token){
    try{
      const response=await fetch('https://alygnn.com/api/company/my-company',{
        method:'GET',
        headers:{'Authorization':'Bearer '+session.access_token}
      });

      if(response.ok){
        const result=await response.json().catch(()=>({}));
        const company=result.company||{};
        const companyId=String(
          company.id||
          result.company_id||
          result.companyId||
          ''
        ).trim();

        if(companyId){
          const status=normalizeEmployerStatus(
            company.verificationStatus||
            company.verification_status||
            result.verification_status||
            'pending_review'
          );

          const accountNumber=
            company.accountNumber||
            company.account_number||
            result.account_number||
            '';

          rememberEmployerCompany(
            userId,
            companyId,
            status,
            accountNumber
          );

          return routeExistingEmployer(status);
        }
      }
    }catch(error){
      console.warn('Server company resolver failed:',error);
    }
  }

  // 3. Direct membership fallback. Include BOTH active and pending
  // memberships because pending verification is still an existing company.
  try{
    const {data:membership,error}=await sb
      .from('company_members')
      .select('company_id,companies(id,account_number,verification_status)')
      .eq('user_id',userId)
      .in('membership_status',['active','pending'])
      .limit(1)
      .maybeSingle();

    if(error){
      console.warn('Company membership lookup failed:',error);
    }else if(membership?.company_id){
      const company=Array.isArray(membership.companies)
        ? membership.companies[0]
        : membership.companies;

      const companyId=String(membership.company_id).trim();
      const status=normalizeEmployerStatus(
        company?.verification_status||'pending_review'
      );

      rememberEmployerCompany(
        userId,
        companyId,
        status,
        company?.account_number||''
      );

      return routeExistingEmployer(status);
    }
  }catch(error){
    console.warn('Company membership lookup threw:',error);
  }

  // 4. Account-scoped saved state / Auth metadata fallback.
  // Never use another employer's generic browser state as proof.
  const metadata=user?.user_metadata||{};
  const profile=metadata.onboarding_company_profile||{};
  const aiProfile=metadata.employer_ai_profile||{};

  const savedCompanyId=String(
    localStorage.getItem(employerCompanyKey(userId))||
    profile.company_id||
    aiProfile.company_id||
    metadata.company_id||
    ''
  ).trim();

  if(savedCompanyId){
    const savedStatus=normalizeEmployerStatus(
      localStorage.getItem(employerStatusKey(userId))||
      profile.verification_status||
      metadata.verification_status||
      'pending_review'
    );

    rememberEmployerCompany(userId,savedCompanyId,savedStatus);
    return routeExistingEmployer(savedStatus);
  }

  // ONLY now is this truly treated as a brand-new employer.
  return ONBOARDING_PAGE;
}

function authAccountType(user){
  return String(
    user?.user_metadata?.account_type ||
    user?.app_metadata?.account_type ||
    ''
  ).toLowerCase().trim();
}

function hasAccountScopedEmployerCompany(userId,user){
  const metadata=user?.user_metadata||{};
  const profile=metadata.onboarding_company_profile||{};
  const aiProfile=metadata.employer_ai_profile||{};

  return Boolean(
    String(
      localStorage.getItem(employerCompanyKey(userId)) ||
      profile.company_id ||
      aiProfile.company_id ||
      metadata.company_id ||
      ''
    ).trim()
  );
}

async function resolveEmployerLoginAccess(user){
  const role=authAccountType(user);

  // Modern employer accounts: metadata is enough to allow the employer flow.
  if(role==='employer'){
    return {
      allowed:true,
      destination:await employerDestination(user.id),
      source:'auth_metadata'
    };
  }

  /*
    Legacy employers can have a real company workspace even when
    auth.user_metadata.account_type was never written.

    employerDestination() checks:
      - employer_verifications
      - Alygnn server company resolver
      - company_members
      - account-scoped company metadata/local storage
  */
  const destination=await employerDestination(user.id);
  const existingEmployerFound=
    destination!==ONBOARDING_PAGE ||
    hasAccountScopedEmployerCompany(user.id,user);

  if(existingEmployerFound){
    return {
      allowed:true,
      destination,
      source:'existing_company_workspace'
    };
  }

  // An explicitly candidate-only account should still be kept out.
  if(role==='candidate'){
    return {
      allowed:false,
      reason:'candidate'
    };
  }

  return {
    allowed:false,
    reason:'not_registered'
  };
}

async function redirectIfLoggedIn(){
  const params=new URLSearchParams(location.search);
  if(params.has('logout'))return;
  const {data}=await sb.auth.getSession();
  if(data?.session)location.replace('app-workspaces.html?after_login=1&preferred=employer');
}
async function signIn(){
  const email=document.getElementById('email').value.trim().toLowerCase();
  const password=document.getElementById('password').value;
  const button=document.getElementById('sign-in-btn');
  if(!email){showMessage('Please enter your email address.','error');return}
  if(!password){showMessage('Please enter your password.','error');return}
  setLoading(button,true,'Signing in…','Sign in');
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error){showMessage(friendlyError(error),'error');setLoading(button,false,'Signing in…','Sign in');return}
  localStorage.setItem('alygnn_account_type',ACCOUNT_TYPE);
  showMessage('Welcome back. Checking your Alygnn workspaces…','success');
  setTimeout(()=>location.replace('app-workspaces.html?after_login=1&preferred=employer'),300);
}
async function googleLogin(){showMessage('Employer Google sign-in is disabled. Sign in with your verified company email and password.','error')}
document.getElementById('back-btn').addEventListener('click',()=>location.href='index.html');
document.getElementById('show-btn').addEventListener('click',e=>{const i=document.getElementById('password');const s=i.type==='text';i.type=s?'password':'text';e.currentTarget.textContent=s?'Show':'Hide'});
document.getElementById('forgot-btn').addEventListener('click',()=>location.href='app-forgot-password.html');
document.getElementById('sign-in-btn').addEventListener('click',signIn);
document.getElementById('google-btn').addEventListener('click',googleLogin);
document.getElementById('apple-btn').addEventListener('click',()=>showMessage('Apple sign-in is not connected yet.','error'));
document.getElementById('switch-btn').addEventListener('click',()=>location.href=ACCOUNT_TYPE==='employer'?'app-login.html':'app-employer-login.html');
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')signIn()});

function currentSavedTheme(){
  const saved=
    localStorage.getItem('alygnn_candidate_theme') ||
    localStorage.getItem('alygnn_theme') ||
    localStorage.getItem('alygnn-theme') ||
    'system';

  return ['system','light','dark'].includes(saved)?saved:'system';
}

function applyEmployerLoginTheme(){
  const preference=currentSavedTheme();
  const resolved=preference==='system'
    ?((window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light')
    :preference;

  document.documentElement.dataset.theme=resolved;
  document.documentElement.dataset.themePreference=preference;

  const meta=document.getElementById('alygnn-theme-color');
  if(meta)meta.setAttribute('content',resolved==='dark'?'#061821':'#F6F8F7');
}

if(window.matchMedia){
  const themeMedia=window.matchMedia('(prefers-color-scheme: dark)');
  const syncSystemTheme=()=>{
    if(currentSavedTheme()==='system')applyEmployerLoginTheme();
  };

  if(typeof themeMedia.addEventListener==='function'){
    themeMedia.addEventListener('change',syncSystemTheme);
  }else if(typeof themeMedia.addListener==='function'){
    themeMedia.addListener(syncSystemTheme);
  }
}

window.addEventListener('pageshow',applyEmployerLoginTheme);
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden)applyEmployerLoginTheme();
});

redirectIfLoggedIn();
</script>
