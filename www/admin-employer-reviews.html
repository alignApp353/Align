<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07121D">
<title>Employer Reviews | Alygnn Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=DM+Serif+Display&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'DM Sans',Arial,sans-serif!important}
:root{--bg:#07121D;--card:#101C29;--card2:#0C1722;--text:#F5F7FA;--muted:#AAB6C4;--border:#2B3A4B;--brand:#5D8FC5;--sage:#7AD5A5;--danger:#FF9B9B}
body{min-height:100vh;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 22px;background:rgba(7,18,29,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
.brand{font-family:'DM Serif Display',Georgia,serif!important;font-size:29px;color:#79A0C8}.brand span{color:#8CB69B}
.admin-label{color:var(--muted);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.8px}
.page{max-width:1100px;margin:auto;padding:24px 18px 60px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}.hero h1{font-size:30px}.hero p{margin-top:7px;color:var(--muted);font-size:13px;line-height:1.5}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}.filter{padding:9px 13px;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--muted);font-weight:800}.filter.active{background:#15283A;color:#8EB5DF;border-color:#5D7FA3}
.list{display:grid;gap:15px;margin-top:20px}
.review{padding:19px;border:1px solid var(--border);border-radius:22px;background:var(--card)}
.review-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.company{font-size:20px;font-weight:900}.status{padding:7px 10px;border-radius:999px;font-size:10px;font-weight:900;text-transform:uppercase}.pending_review{background:#2B2414;color:#F3D58F}.approved{background:#102C22;color:#7AD5A5}.rejected{background:#321C22;color:#FF9B9B}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.item{padding:12px;border-radius:14px;background:var(--card2)}.item span{display:block;color:var(--muted);font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.6px}.item strong{display:block;margin-top:5px;font-size:12px;word-break:break-word}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}.btn{min-height:43px;padding:0 15px;border-radius:13px;font-weight:900}.view{border:1px solid var(--border);background:var(--card2);color:var(--text)}.approve{border:0;background:#18794E;color:#fff}.reject{border:1px solid #6E343A;background:#321C22;color:#FFB1B1}
.empty,.message{margin-top:22px;padding:22px;border:1px solid var(--border);border-radius:18px;background:var(--card);color:var(--muted);text-align:center}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:18px;background:rgba(0,0,0,.62)}.modal[hidden]{display:none}.dialog{width:min(520px,100%);padding:22px;border:1px solid var(--border);border-radius:22px;background:var(--card)}.dialog h2{font-size:22px}.dialog p{margin-top:7px;color:var(--muted);font-size:12px;line-height:1.5}.dialog textarea{width:100%;min-height:120px;margin-top:15px;padding:13px;border:1px solid var(--border);border-radius:14px;background:var(--card2);color:var(--text);resize:vertical}.dialog-actions{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:14px}
@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.hero{align-items:flex-start;flex-direction:column}}@media(max-width:480px){.grid{grid-template-columns:1fr}.review-top{flex-direction:column}}
</style>
</head>
<body>
<header class="header">
  <div><div class="brand">Alygnn<span>.</span></div><div class="admin-label">Admin verification</div></div>
  <button class="btn view" id="refresh" type="button">Refresh</button>
</header>

<main class="page">
  <section class="hero">
    <div>
      <h1>Employer verification reviews</h1>
      <p>Review the company information and uploaded EIN document before approving or declining an employer.</p>
    </div>
  </section>

  <div class="filters">
    <button class="filter active" data-status="pending_review" type="button">Pending</button>
    <button class="filter" data-status="approved" type="button">Approved</button>
    <button class="filter" data-status="rejected" type="button">Declined</button>
  </div>

  <div class="message" id="message">Loading employer reviews…</div>
  <div class="list" id="list"></div>
</main>

<div class="modal" id="reject-modal" hidden>
  <div class="dialog">
    <h2>Decline employer</h2>
    <p>Explain what the employer must correct or upload again.</p>
    <textarea id="rejection-reason" placeholder="Example: The legal business name on the document does not match the company profile."></textarea>
    <div class="dialog-actions">
      <button class="btn view" id="cancel-reject" type="button">Cancel</button>
      <button class="btn reject" id="confirm-reject" type="button">Decline Employer</button>
    </div>
  </div>
</div>

<script>
const sb=supabase.createClient(
  'https://auth.alygnn.com',
  'sb_publishable_3l8krRh6WCyvKfNumWDBDw_C6CKr7rG',
  {auth:{persistSession:true,autoRefreshToken:true}}
);

let session=null;
let currentStatus='pending_review';
let rejectingCompanyId='';

const escapeHtml=value=>String(value||'').replace(/[&<>"']/g,char=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
})[char]);

function statusLabel(value){
  if(value==='approved')return'Approved';
  if(value==='rejected')return'Declined';
  return'Pending review';
}

function item(label,value){
  return `<div class="item"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value||'Not provided')}</strong></div>`;
}

async function api(path='',options={}){
  const token=session?.access_token;
  const response=await fetch(`/api/admin/employer-verifications${path}`,{
    ...options,
    headers:{
      'Content-Type':'application/json',
      'Authorization':`Bearer ${token}`,
      ...(options.headers||{})
    }
  });
  const body=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(body.error||`Request failed (${response.status})`);
  return body;
}

function render(rows){
  const list=document.getElementById('list');
  const message=document.getElementById('message');

  if(!rows.length){
    list.innerHTML='';
    message.textContent=`No ${statusLabel(currentStatus).toLowerCase()} employers found.`;
    message.hidden=false;
    return;
  }

  message.hidden=true;
  list.innerHTML=rows.map(row=>`
    <article class="review">
      <div class="review-top">
        <div>
          <div class="company">${escapeHtml(row.company_name||'Unnamed company')}</div>
          <div style="margin-top:5px;color:var(--muted);font-size:11px">${escapeHtml(row.company_id||'')}</div>
        </div>
        <span class="status ${escapeHtml(row.verification_status||'pending_review')}">${escapeHtml(statusLabel(row.verification_status))}</span>
      </div>

      <div class="grid">
        ${item('Website',row.website)}
        ${item('Phone',row.business_phone)}
        ${item('Industry',row.industry)}
        ${item('Company size',row.company_size)}
        ${item('Headquarters',row.headquarters)}
        ${item('EIN last 4',row.ein_last4)}
      </div>

      <div class="actions">
        ${row.document_url?`<button class="btn view" data-view="${escapeHtml(row.document_url)}" type="button">View Verification PDF</button>`:''}
        ${currentStatus==='pending_review'?`
          <button class="btn approve" data-approve="${escapeHtml(row.company_id)}" type="button">Approve</button>
          <button class="btn reject" data-reject="${escapeHtml(row.company_id)}" type="button">Decline</button>
        `:''}
      </div>
      ${row.rejection_reason?`<div style="margin-top:13px;color:#FFB1B1;font-size:11px;line-height:1.5"><strong>Reason:</strong> ${escapeHtml(row.rejection_reason)}</div>`:''}
    </article>
  `).join('');
}

async function load(){
  document.getElementById('message').hidden=false;
  document.getElementById('message').textContent='Loading employer reviews…';
  document.getElementById('list').innerHTML='';

  try{
    const result=await api(`?status=${encodeURIComponent(currentStatus)}`);
    render(result.reviews||[]);
  }catch(error){
    document.getElementById('message').hidden=false;
    document.getElementById('message').textContent=error.message;
  }
}

async function decide(companyId,decision,reason=''){
  try{
    await api('',{
      method:'PATCH',
      body:JSON.stringify({company_id:companyId,decision,reason})
    });
    await load();
  }catch(error){
    alert(error.message);
  }
}

document.querySelectorAll('[data-status]').forEach(button=>{
  button.onclick=()=>{
    document.querySelectorAll('[data-status]').forEach(item=>item.classList.remove('active'));
    button.classList.add('active');
    currentStatus=button.dataset.status;
    load();
  };
});

document.getElementById('list').onclick=event=>{
  const view=event.target.closest('[data-view]');
  if(view){window.open(view.dataset.view,'_blank','noopener');return}

  const approve=event.target.closest('[data-approve]');
  if(approve){decide(approve.dataset.approve,'approved');return}

  const reject=event.target.closest('[data-reject]');
  if(reject){
    rejectingCompanyId=reject.dataset.reject;
    document.getElementById('rejection-reason').value='';
    document.getElementById('reject-modal').hidden=false;
  }
};

document.getElementById('cancel-reject').onclick=()=>document.getElementById('reject-modal').hidden=true;
document.getElementById('confirm-reject').onclick=()=>{
  const reason=document.getElementById('rejection-reason').value.trim();
  if(!reason){alert('Enter a reason before declining the employer.');return}
  document.getElementById('reject-modal').hidden=true;
  decide(rejectingCompanyId,'rejected',reason);
};
document.getElementById('refresh').onclick=load;

(async()=>{
  const {data}=await sb.auth.getSession();
  session=data.session;
  if(!session){
    location.href='app-employer-login.html';
    return;
  }
  load();
})();
</script>
</body>
</html>
