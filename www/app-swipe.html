<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F6F8F7">
<title>Alygnn — Swipe Jobs</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;700;800&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:'DM Sans',Arial,sans-serif!important;
}

:root{
  --brand:#5D7FA3;
  --brand-dark:#345F91;
  --sage:#8CB69B;
  --bg:#F6F8F7;
  --card-bg:#FFFFFF;
  --text:#172333;
  --border:#DDE3E8;
  --mint:#6FBF8F;
  --rose:#D79A9A;
  --text-muted:#56677B;
  --brand-light:rgba(93,127,163,.10);
  --mint-light:rgba(111,191,143,.15);
  --rose-light:rgba(215,154,154,.16);
}

html,body{
  width:100%;
  min-height:100%;
}

body{
  background:
    radial-gradient(circle at top,rgba(93,127,163,.09),transparent 30%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow:hidden;
}

/* HEADER */
.top-header{
  min-height:112px;
  padding:calc(14px + env(safe-area-inset-top)) 18px 14px;
  display:grid;
  grid-template-columns:92px 1fr 92px;
  align-items:center;
  background:rgba(246,248,247,.96);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(16px);
}

.back-btn{
  min-height:44px;
  border:none;
  border-radius:999px;
  background:rgba(93,127,163,.09);
  color:var(--text);
  padding:0 15px;
  font-size:14px;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  cursor:pointer;
}

.brand-block{
  text-align:center;
}

.logo{
  font-family:'DM Serif Display',Georgia,serif!important;
  font-size:31px;
  line-height:1;
  color:var(--brand);
}

.logo span{
  color:var(--sage);
}

.tagline{
  margin-top:5px;
  font-size:11px;
  color:var(--text-muted);
  font-weight:600;
}

.profile-chip{
  justify-self:end;
  width:46px;
  height:46px;
  border:none;
  border-radius:50%;
  background:linear-gradient(145deg,var(--brand),#6E95BE);
  color:#fff;
  font-size:14px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* PROGRESS */
.progress-shell{
  padding:12px 18px 0;
}

.progress-card{
  max-width:430px;
  margin:0 auto;
  background:rgba(255,255,255,.88);
  border:1px solid var(--border);
  border-radius:20px;
  padding:12px 14px;
  display:grid;
  grid-template-columns:repeat(3,1fr) 1.4fr;
  gap:8px;
  align-items:center;
  box-shadow:0 8px 22px rgba(25,40,60,.05);
}

.stat{
  text-align:center;
}

.stat-val{
  font-size:18px;
  font-weight:900;
  color:var(--text);
}

.stat-label{
  margin-top:2px;
  font-size:9px;
  color:var(--text-muted);
  text-transform:uppercase;
  letter-spacing:.8px;
  font-weight:800;
}

.job-progress{
  border-left:1px solid var(--border);
  padding-left:12px;
}

.progress-copy{
  font-size:11px;
  font-weight:800;
  color:var(--text);
  text-align:center;
  margin-bottom:6px;
}

.progress-track{
  width:100%;
  height:7px;
  background:#E8EDF2;
  border-radius:999px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0;
  background:var(--brand);
  border-radius:inherit;
  transition:width .25s ease;
}

/* MAIN */
.swipe-area{
  height:calc(100vh - 112px - 84px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:14px 18px calc(92px + env(safe-area-inset-bottom));
}

.card-stack{
  position:relative;
  width:100%;
  max-width:430px;
  height:min(440px,calc(100vh - 345px));
}

.job-card{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at top right,rgba(93,127,163,.08),transparent 28%),
    var(--card-bg);
  border:1px solid var(--border);
  border-radius:30px;
  padding:24px;
  box-shadow:0 22px 60px rgba(27,43,63,.12);
  display:flex;
  flex-direction:column;
  cursor:grab;
  user-select:none;
  touch-action:none;
  transform-origin:center bottom;
  transition:transform .22s ease,box-shadow .22s ease;
}

.job-card:nth-child(2){
  transform:scale(.97) translateY(10px);
  z-index:1;
  pointer-events:none;
}

.job-card:nth-child(3){
  transform:scale(.94) translateY(20px);
  z-index:0;
  pointer-events:none;
}

/* Background cards are only visual stack shells.
   Hiding their children prevents duplicate footer/text from showing below
   the active card. */
.job-card:nth-child(n+2) > *{
  visibility:hidden !important;
}

.job-card:first-child{
  z-index:2;
}

.job-card.is-dragging{
  transition:none;
  box-shadow:0 22px 55px rgba(27,43,63,.17);
}

.job-card.swipe-left{animation:swipeLeft .35s ease forwards}
.job-card.swipe-right{animation:swipeRight .35s ease forwards}

.stamp{
  position:absolute;
  top:24px;
  padding:7px 16px;
  border-radius:10px;
  font-size:19px;
  font-weight:900;
  letter-spacing:2px;
  opacity:0;
  border:3px solid;
  pointer-events:none;
}

.stamp-apply{
  right:24px;
  color:var(--mint);
  border-color:var(--mint);
  transform:rotate(12deg);
}

.stamp-skip{
  left:24px;
  color:var(--rose);
  border-color:var(--rose);
  transform:rotate(-12deg);
}

.card-toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.match{
  display:inline-flex;
  align-items:center;
  gap:7px;
  width:max-content;
  background:linear-gradient(180deg,#EDF8F1,#E4F3EA);
  color:#257B52;
  padding:9px 14px;
  border-radius:999px;
  border:1px solid rgba(111,191,143,.28);
  font-size:13px;
  font-weight:900;
}

.save-btn{
  width:36px;
  height:36px;
  border-radius:50%;
  border:1px solid var(--border);
  background:#fff;
  color:var(--text);
  font-size:19px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card-top{
  display:flex;
  gap:15px;
  margin-bottom:18px;
  align-items:flex-start;
}

.company-logo{
  width:68px;
  height:68px;
  border-radius:22px;
  background:linear-gradient(145deg,#F5F8FA,#E5ECF2);
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  font-weight:900;
  color:var(--brand-dark);
  flex-shrink:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9);
}

.job-title{
  font-family:'DM Serif Display',Georgia,serif!important;
  font-size:31px;
  line-height:1.02;
  letter-spacing:-.4px;
  color:var(--text);
  text-transform:none;
}

.company-line{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:6px;
}

.company-name{
  font-size:15px;
  color:var(--text-muted);
}

.verified{
  width:17px;
  height:17px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--brand);
  color:white;
  font-size:10px;
  font-weight:900;
}

.card-pills{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:18px;
}

.pill{
  font-size:12px;
  padding:8px 12px;
  border-radius:999px;
  border:1px solid var(--border);
  color:var(--text-muted);
  background:rgba(250,252,253,.92);
  font-weight:800;
}

.salary{
  background:var(--brand-light);
  color:var(--brand-dark);
}

.card-overview{
  margin-top:12px;
  padding-top:11px;
  border-top:1px solid rgba(93,127,163,.18);
}

.card-overview-label{
  margin-bottom:5px;
  font-size:9px;
  font-weight:900;
  letter-spacing:1.15px;
  text-transform:uppercase;
  color:var(--brand-dark);
}

.card-desc{
  font-size:12px;
  color:var(--text-muted);
  line-height:1.5;
  max-width:100%;
  overflow:hidden;
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:3;
}

.card-bottom{
  border-top:1px solid var(--border);
  padding-top:11px;
  margin-top:auto;
  display:flex;
  justify-content:flex-end;
  align-items:center;
}

.view-full-ad{
  width:auto;
  min-height:36px;
  padding:5px 2px 5px 12px;
  border:none;
  border-radius:10px;
  background:transparent;
  color:var(--brand-dark);
  display:inline-flex;
  align-items:center;
  justify-content:flex-end;
  gap:7px;
  font-size:12px;
  font-weight:900;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.view-full-ad:active{
  opacity:.68;
}

.view-full-ad-arrow{
  font-size:15px;
  line-height:1;
}

.apply-link{
  text-decoration:none;
}



/* COMPACT ALYGNN MATCH */
.alygnn-match-mini{
  border:1px solid var(--border);
  background:rgba(248,250,252,.82);
  border-radius:19px;
  padding:12px 13px;
  margin:2px 0 16px;
}

.alygnn-match-mini-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
}

.alygnn-match-mini-title{
  font-size:12px;
  font-weight:900;
  color:var(--text);
}

.alygnn-match-mini-sub{
  margin-top:2px;
  font-size:9px;
  color:var(--text-muted);
  font-weight:700;
}

.alygnn-match-mini-body{
  display:grid;
  grid-template-columns:64px 1fr;
  gap:13px;
  align-items:center;
}

.alygnn-score-ring{
  --score:0;
  width:62px;
  height:62px;
  border-radius:50%;
  display:grid;
  place-items:center;
  position:relative;
  background:
    conic-gradient(
      var(--mint) calc(var(--score) * 1%),
      rgba(93,127,163,.13) 0
    );
}

.alygnn-score-ring::after{
  content:'';
  position:absolute;
  width:46px;
  height:46px;
  border-radius:50%;
  background:var(--card-bg);
  border:1px solid rgba(93,127,163,.08);
}

.alygnn-score-number{
  position:relative;
  z-index:1;
  text-align:center;
  font-size:16px;
  line-height:1;
  color:var(--text);
  font-weight:900;
}

.alygnn-score-number small{
  display:block;
  margin-top:3px;
  font-size:7px;
  letter-spacing:.8px;
  text-transform:uppercase;
  color:var(--text-muted);
  font-weight:900;
}

.alygnn-mini-metrics{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px 12px;
}

.alygnn-mini-row{
  min-width:0;
}

.alygnn-mini-row-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  margin-bottom:4px;
}

.alygnn-mini-label{
  font-size:9px;
  color:var(--text-muted);
  font-weight:800;
  white-space:nowrap;
}

.alygnn-mini-value{
  font-size:9px;
  color:var(--brand-dark);
  font-weight:900;
}

.alygnn-mini-track{
  height:4px;
  background:rgba(93,127,163,.12);
  border-radius:999px;
  overflow:hidden;
}

.alygnn-mini-fill{
  height:100%;
  width:0;
  background:var(--mint);
  border-radius:999px;
}

.details-match-wrap{
  margin-top:14px;
}

@media(max-height:760px){
  .alygnn-match-mini{
    padding:10px 11px;
    margin-bottom:12px;
  }

  .alygnn-match-mini-head{
    margin-bottom:8px;
  }

  .alygnn-match-mini-body{
    grid-template-columns:56px 1fr;
    gap:10px;
  }

  .alygnn-score-ring{
    width:54px;
    height:54px;
  }

  .alygnn-score-ring::after{
    width:40px;
    height:40px;
  }

  .alygnn-score-number{
    font-size:14px;
  }

  .alygnn-mini-metrics{
    gap:6px 10px;
  }
}


.quick-facts{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin:2px 0 18px;
}

.fact{
  border:1px solid var(--border);
  background:rgba(248,250,252,.9);
  border-radius:16px;
  padding:11px 10px;
}

.fact-label{
  font-size:9px;
  letter-spacing:.8px;
  text-transform:uppercase;
  color:var(--text-muted);
  font-weight:900;
}

.fact-value{
  margin-top:5px;
  font-size:12px;
  line-height:1.25;
  color:var(--text);
  font-weight:900;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.card-actions-mini{
  display:flex;
  align-items:center;
  gap:4px;
}

.icon-btn{
  width:36px;
  height:36px;
  border-radius:50%;
  border:1px solid var(--border);
  background:#fff;
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
}

/* ACTIONS */
.action-buttons{
  width:100%;
  max-width:430px;
  display:grid;
  grid-template-columns:82px minmax(0,1fr) minmax(0,1.45fr);
  gap:10px;
  margin-top:14px;
  padding:11px;
  border:1px solid var(--border);
  border-radius:20px;
  background:rgba(252,252,250,.94);
  box-shadow:0 10px 30px rgba(27,43,63,.08);
}

.action-btn{
  min-width:0;
  height:68px;
  border-radius:16px;
  border:1px solid var(--border);
  background:var(--card-bg);
  color:var(--text);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  -webkit-tap-highlight-color:transparent;
  transition:transform .12s ease,opacity .12s ease;
}

.action-btn:active{
  transform:scale(.985);
}

.btn-undo{
  flex-direction:column;
  gap:3px;
}

.action-undo-icon{
  font-size:22px;
  line-height:1;
}

.action-main{
  display:block;
  font-size:12px;
  line-height:1.15;
  font-weight:900;
  white-space:nowrap;
}

.action-sub{
  display:block;
  margin-top:4px;
  font-size:9px;
  line-height:1.1;
  color:var(--text-muted);
  font-weight:700;
  white-space:nowrap;
}

.btn-skip{
  flex-direction:column;
  padding:0 10px;
  border-color:var(--brand);
  background:transparent;
}

.btn-apply{
  position:relative;
  flex-direction:column;
  align-items:flex-start;
  padding:0 34px 0 17px;
  border-color:transparent;
  background:linear-gradient(135deg,#4E7EAE,#73A2D1);
  color:#fff;
}

.btn-apply .action-sub{
  color:rgba(255,255,255,.76);
}

.action-arrow{
  position:absolute;
  right:15px;
  top:50%;
  transform:translateY(-50%);
  font-size:20px;
  line-height:1;
}

@media(max-width:390px){
  .action-buttons{
    grid-template-columns:72px minmax(0,1fr) minmax(0,1.35fr);
    gap:8px;
    padding:9px;
  }

  .action-btn{
    height:64px;
  }

  .action-main{
    font-size:11px;
  }

  .action-sub{
    font-size:8px;
  }

  .btn-apply{
    padding-left:13px;
    padding-right:29px;
  }

  .action-arrow{
    right:11px;
  }
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  max-width:520px;
  margin:0 auto;
  min-height:72px;
  padding:10px 12px calc(13px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.96);
  border-top:1px solid var(--border);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  z-index:50;
  backdrop-filter:blur(16px);
}

.nav-link{
  border:none;
  background:transparent;
  color:var(--text-muted);
  font-size:11px;
  font-weight:800;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}

.nav-icon{
  font-size:19px;
  line-height:1;
}

.nav-link.active{
  color:var(--brand-dark);
}

/* EMPTY + TOAST */
.empty-screen{
  display:none;
  height:calc(100vh - 112px);
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:30px;
}

.empty-title{
  font-family:'DM Serif Display',Georgia,serif!important;
  font-size:32px;
  margin-bottom:10px;
}

.empty-sub{
  color:var(--text-muted);
  line-height:1.6;
  max-width:320px;
}

.toast{
  position:fixed;
  bottom:92px;
  left:50%;
  transform:translateX(-50%) translateY(18px);
  background:var(--text);
  color:white;
  padding:12px 22px;
  border-radius:999px;
  font-size:14px;
  transition:opacity .2s ease, transform .2s ease;
  z-index:100;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  white-space:nowrap;
}

.toast.show{
  transform:translateX(-50%) translateY(0);
  opacity:1;
  visibility:visible;
}

@keyframes swipeLeft{
  to{transform:translateX(-130%) rotate(-22deg);opacity:0}
}

@keyframes swipeRight{
  to{transform:translateX(130%) rotate(22deg);opacity:0}
}

@media(max-height:760px){
  .top-header{min-height:96px;padding-top:calc(9px + env(safe-area-inset-top))}
  .logo{font-size:27px}
  .tagline{display:none}
  .progress-shell{padding-top:7px}
  .progress-card{padding:9px 12px}
  .swipe-area{height:calc(100vh - 96px - 72px);padding-top:9px}
  .card-stack{height:min(415px,calc(100vh - 315px))}
  .job-card{padding:19px}
  .job-title{font-size:25px}
  .card-desc{-webkit-line-clamp:5}
  .action-buttons{margin-top:13px}
}


/* FULL JOB AD */
body.details-open{overflow:hidden}
.job-details-overlay{
  position:fixed;inset:0;z-index:300;background:rgba(23,35,51,.42);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .22s ease;
}
.job-details-overlay.open{opacity:1;pointer-events:auto}
.job-details-sheet{
  width:100%;max-height:94vh;background:var(--bg);border-radius:30px 30px 0 0;
  transform:translateY(100%);transition:transform .34s cubic-bezier(.2,.8,.2,1);
  overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 -22px 70px rgba(23,35,51,.18);
}
.job-details-overlay.open .job-details-sheet{transform:translateY(0)}
.details-grip{width:44px;height:5px;border-radius:999px;background:#D4DCE3;margin:10px auto 5px;flex-shrink:0}
.details-header{
  padding:8px 18px 14px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;
  border-bottom:1px solid var(--border);background:rgba(246,248,247,.96)
}
.details-close,.details-save{
  width:42px;height:42px;border:1px solid var(--border);border-radius:50%;background:#fff;
  color:var(--text);font-size:20px;display:grid;place-items:center
}
.details-header-title{text-align:center;font-size:13px;font-weight:900;color:var(--text)}
.details-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 17px 120px}
.details-hero{background:#fff;border:1px solid var(--border);border-radius:24px;padding:20px;box-shadow:0 12px 32px rgba(23,35,51,.07)}
.details-company-row{display:flex;gap:14px;align-items:flex-start}
.details-logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(145deg,#F5F8FA,#E5ECF2);border:1px solid var(--border);display:grid;place-items:center;font-size:22px;font-weight:900;color:var(--brand-dark);flex-shrink:0}
.details-title{font-family:'DM Serif Display',Georgia,serif!important;font-size:29px;line-height:1.05;color:var(--text)}

<script>
const sb=supabase.createClient(
  'https://auth.alygnn.com',
  'sb_publishable_3l8krRh6WCyvKfNumWDBDw_C6CKr7rG',
  {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}
);

let session=null;
let candidateProfile={};
let candidatePreferences={};
let candidateResume={};
let jobs=[];
let currentIndex=0;
const SWIPE_COMMIT_THRESHOLD=70;
let applied=0;
let skipped=0;
let history=[];
let activeCard=null;
let isDragging=false;
let startX=0;
let startY=0;
let currentX=0;
let activePointerId=null;
let toastTimer;
let detailsJobIndex=null;
let dragDistance=0;

function escapeHtml(value){
  return String(value??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  })[c]);
}

function initials(value){
  const parts=String(value||'A').trim().split(/\s+/).filter(Boolean);
  return ((parts[0]?.[0]||'A')+(parts[1]?.[0]||'')).toUpperCase();
}

function salaryText(job){
  if(job.salary)return job.salary;
  if(job.salary_min&&job.salary_max){
    return '$'+Number(job.salary_min).toLocaleString()+'–$'+Number(job.salary_max).toLocaleString();
  }
  if(job.salary_min)return 'From $'+Number(job.salary_min).toLocaleString();
  if(job.salary_max)return 'Up to $'+Number(job.salary_max).toLocaleString();
  return 'Salary not listed';
}

function postedText(value){
  if(!value)return 'Recently posted';
  const date=new Date(value);
  if(Number.isNaN(date.getTime()))return 'Recently posted';
  const days=Math.floor((Date.now()-date.getTime())/86400000);
  if(days<=0)return 'Today';
  if(days===1)return '1 day ago';
  return days+' days ago';
}



function normalizeList(value){
  if(Array.isArray(value))return value.map(v=>String(v).trim()).filter(Boolean);
  if(!value)return [];
  if(typeof value==='object')return Object.values(value).flatMap(normalizeList);
  return String(value)
    .split(/\n|•|;|\|/)
    .map(v=>v.replace(/^[-–—✓✔]\s*/, '').trim())
    .filter(Boolean);
}


function parseObject(value){
  if(!value)return {};
  if(typeof value==='object'&&!Array.isArray(value))return value;
  if(typeof value==='string'){
    try{
      const parsed=JSON.parse(value);
      return parsed&&typeof parsed==='object'&&!Array.isArray(parsed)?parsed:{};
    }catch(_error){
      return {};
    }
  }
  return {};
}

function normalizeMatchText(value){
  return String(value||'')
    .toLowerCase()
    .replace(/&/g,' and ')
    .replace(/[–—]/g,'-')
    .replace(/[^a-z0-9+#.\s-]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

const MATCH_STOP_WORDS=new Set([
  'a','an','and','are','as','at','be','by','for','from','in','is','it','of',
  'on','or','the','to','with','your','you','our','we','this','that','will',
  'job','role','position','work','working','team','candidate','company'
]);

function matchTokens(value){
  return normalizeMatchText(value)
    .split(/[\s/,_-]+/)
    .map(token=>token.trim())
    .filter(token=>token.length>1&&!MATCH_STOP_WORDS.has(token));
}

function textSimilarity(left,right){
  const a=normalizeMatchText(left);
  const b=normalizeMatchText(right);
  if(!a||!b)return null;
  if(a===b)return 100;
  if(a.includes(b)||b.includes(a))return 95;
  const aTokens=[...new Set(matchTokens(a))];
  const bTokens=[...new Set(matchTokens(b))];
  if(!aTokens.length||!bTokens.length)return 0;
  const bSet=new Set(bTokens);
  const overlap=aTokens.filter(token=>bSet.has(token)).length;
  const denominator=Math.max(aTokens.length,bTokens.length);
  if(!overlap)return 0;
  return Math.min(100,Math.round((overlap/denominator)*100));
}

function canonicalWorkStyle(value){
  const text=normalizeMatchText(value).replace(/\s+/g,'');
  if(text.includes('remote'))return 'remote';
  if(text.includes('hybrid'))return 'hybrid';
  if(text.includes('onsite')||text.includes('on-site'))return 'onsite';
  return text;
}

function canonicalJobType(value){
  const text=normalizeMatchText(value).replace(/[\s-]+/g,'');
  if(text.includes('fulltime'))return 'fulltime';
  if(text.includes('parttime'))return 'parttime';
  if(text.includes('contractor')||text.includes('contract'))return 'contract';
  if(text.includes('internship')||text.includes('intern'))return 'intern';
  if(text.includes('temporary')||text.includes('temp'))return 'temporary';
  return text;
}

function splitLocation(value){
  const raw=String(value||'').trim();
  const parts=raw.split(',').map(part=>normalizeMatchText(part)).filter(Boolean);
  return {raw:normalizeMatchText(raw),city:parts[0]||'',state:parts[1]||''};
}

function locationScore(job){
  const wanted=candidatePreferences.location||[candidatePreferences.city,candidatePreferences.state].filter(Boolean).join(', ');
  const offered=job.location||[job.location_city||job.city,job.location_state||job.state].filter(Boolean).join(', ');
  if(!wanted||!offered)return null;
  const preferredStyle=canonicalWorkStyle(candidatePreferences.workStyle);
  const jobStyle=canonicalWorkStyle(job.work_style||job.work_arrangement);
  if(jobStyle==='remote')return preferredStyle==='remote'?100:90;
  const a=splitLocation(wanted);
  const b=splitLocation(offered);
  if(a.raw===b.raw)return 100;
  if(a.city&&b.city&&a.city===b.city&&a.state&&b.state&&a.state===b.state)return 100;
  if(a.city&&b.city&&a.city===b.city)return 90;
  if(a.state&&b.state&&a.state===b.state)return 75;
  return 20;
}

function workStyleScore(job){
  const wanted=canonicalWorkStyle(candidatePreferences.workStyle);
  const offered=canonicalWorkStyle(job.work_style||job.work_arrangement);
  if(!wanted||!offered)return null;
  if(wanted===offered)return 100;
  if(wanted==='hybrid'&&(offered==='remote'||offered==='onsite'))return 65;
  if(offered==='hybrid'&&(wanted==='remote'||wanted==='onsite'))return 65;
  return 15;
}

function jobTypeScore(job){
  const wantedRaw=Array.isArray(candidatePreferences.jobTypes)&&candidatePreferences.jobTypes.length
    ?candidatePreferences.jobTypes
    :[candidatePreferences.jobType].filter(Boolean);
  if(!wantedRaw.length)return null;
  const wanted=wantedRaw.map(canonicalJobType).filter(Boolean);
  const offered=canonicalJobType(job.job_type||job.employment_type);
  if(!offered)return null;
  return wanted.includes(offered)?100:10;
}

function extractMoneyValues(text){
  const source=String(text||'');
  const values=[];
  const regex=/\$?\s*(\d+(?:,\d{3})*(?:\.\d+)?)\s*([kK])?/g;
  let match;
  while((match=regex.exec(source))){
    let value=Number(match[1].replace(/,/g,''));
    if(match[2])value*=1000;
    if(Number.isFinite(value))values.push(value);
  }
  return values;
}

function annualizePay(value,periodText){
  if(!Number.isFinite(value))return null;
  const period=normalizeMatchText(periodText);
  if(period.includes('hour'))return value*2080;
  if(period.includes('week'))return value*52;
  if(period.includes('month'))return value*12;
  if(period.includes('day'))return value*260;
  return value;
}

function jobPayRange(job){
  let min=Number(job.pay_min??job.salary_min??NaN);
  let max=Number(job.pay_max??job.salary_max??NaN);
  const salaryTextValue=job.salary||'';
  const period=job.pay_period||salaryTextValue;
  if(!Number.isFinite(min)&&!Number.isFinite(max)){
    const numbers=extractMoneyValues(salaryTextValue);
    if(numbers.length){
      min=numbers[0];
      max=numbers.length>1?numbers[1]:numbers[0];
    }
  }
  if(!Number.isFinite(min)&&Number.isFinite(max))min=max;
  if(!Number.isFinite(max)&&Number.isFinite(min))max=min;
  if(!Number.isFinite(min)||!Number.isFinite(max))return null;
  min=annualizePay(min,period);
  max=annualizePay(max,period);
  if(!Number.isFinite(min)||!Number.isFinite(max))return null;
  if(min>max)[min,max]=[max,min];
  return {min,max};
}

function salaryScore(job){
  const wantedMin=Number(candidatePreferences.salary_min);
  const wantedMax=Number(candidatePreferences.salary_max);
  const offered=jobPayRange(job);
  if(!Number.isFinite(wantedMin)||!Number.isFinite(wantedMax)||!offered)return null;
  if(offered.max>=wantedMin&&offered.min<=wantedMax)return 100;
  if(offered.min>wantedMax)return 95;
  const gap=wantedMin-offered.max;
  const denominator=Math.max(wantedMin,1);
  return Math.max(0,Math.round(100-(gap/denominator)*160));
}

function candidateSkills(){
  const direct=normalizeList(candidateResume.skills);
  const profileSkills=normalizeList(candidateProfile.skills||candidateProfile.skill_list||candidateProfile.top_skills);
  return [...new Set([...direct,...profileSkills].map(skill=>String(skill).trim()).filter(Boolean))];
}

function resumeRoleText(){
  const personal=parseObject(candidateResume.personal);
  const experiences=Array.isArray(candidateResume.experience)?candidateResume.experience:[];
  return [
    candidatePreferences.query,
    candidateResume.title,
    personal.professional_title,
    ...experiences.map(item=>item?.title||item?.job_title||'')
  ].filter(Boolean).join(' ');
}

function jobSearchText(job){
  return [job.title,job.description,job.requirements,job.qualifications,job.skills,job.responsibilities,job.tasks,job.duties]
    .flatMap(value=>Array.isArray(value)?value:[value])
    .filter(Boolean)
    .join(' ');
}

function roleScore(job){
  const candidateRole=resumeRoleText();
  const jobTitle=job.title||'';
  if(!candidateRole||!jobTitle)return null;
  if(candidatePreferences.query){
    const preferred=textSimilarity(candidatePreferences.query,jobTitle);
    if(preferred!=null&&preferred>=80)return preferred;
  }
  return textSimilarity(candidateRole,jobTitle);
}

function skillsScore(job){
  const skills=candidateSkills();
  if(!skills.length)return null;
  const haystack=normalizeMatchText(jobSearchText(job));
  if(!haystack)return null;
  let matched=0;
  skills.forEach(skill=>{
    const normalized=normalizeMatchText(skill);
    if(!normalized)return;
    if(haystack.includes(normalized)){
      matched++;
      return;
    }
    const tokens=matchTokens(normalized);
    if(tokens.length&&tokens.every(token=>haystack.includes(token)))matched++;
  });
  return Math.round((matched/skills.length)*100);
}


function experienceScore(job){
  const experiences=Array.isArray(candidateResume.experience)
    ?candidateResume.experience
    :[];

  if(!experiences.length)return null;

  const jobTitle=job.title||'';
  const jobText=normalizeMatchText(jobSearchText(job));

  let bestTitle=0;
  const experienceText=[];

  experiences.forEach(item=>{
    if(!item||typeof item!=='object')return;

    const title=
      item.title||
      item.job_title||
      item.position||
      item.role||
      '';

    const description=
      item.description||
      item.details||
      item.summary||
      item.responsibilities||
      '';

    if(title){
      const similarity=textSimilarity(title,jobTitle);
      if(Number.isFinite(similarity)){
        bestTitle=Math.max(bestTitle,similarity);
      }
    }

    experienceText.push(
      title,
      item.company||item.company_name||'',
      description
    );
  });

  const candidateText=normalizeMatchText(experienceText.filter(Boolean).join(' '));

  let keywordScore=0;

  if(candidateText&&jobText){
    const jobTokens=[...new Set(matchTokens(jobText))];
    const candidateTokens=new Set(matchTokens(candidateText));

    if(jobTokens.length){
      const overlap=jobTokens.filter(token=>candidateTokens.has(token)).length;
      keywordScore=Math.min(
        100,
        Math.round((overlap/Math.min(jobTokens.length,18))*100)
      );
    }
  }

  return Math.round(
    Math.min(
      100,
      (bestTitle*.65)+(keywordScore*.35)
    )
  );
}

function scoreMetric(job,key){
  const value=job?._alygnn_breakdown?.[key];
  return Number.isFinite(Number(value))
    ?Math.max(0,Math.min(100,Math.round(Number(value))))
    :null;
}

function compactMetric(label,value){
  const display=value==null?'—':value+'%';
  const width=value==null?0:value;

  return `
    <div class="alygnn-mini-row">
      <div class="alygnn-mini-row-top">
        <span class="alygnn-mini-label">${escapeHtml(label)}</span>
        <span class="alygnn-mini-value">${escapeHtml(display)}</span>
      </div>
      <div class="alygnn-mini-track">
        <div class="alygnn-mini-fill" style="width:${width}%"></div>
      </div>
    </div>
  `;
}

function renderCompactAlygnnMatch(job){
  const score=Number.isFinite(Number(job?.match_score))
    ?Math.max(0,Math.min(100,Math.round(Number(job.match_score))))
    :null;

  const breakdown=job?._alygnn_breakdown||{};

  const skills=scoreMetric(job,'skills');
  const experience=scoreMetric(job,'experience');
  const salary=scoreMetric(job,'salary');
  const location=scoreMetric(job,'location');

  return `
    <div class="alygnn-match-mini">
      <div class="alygnn-match-mini-head">
        <div>
          <div class="alygnn-match-mini-title">Your Alygnn match</div>
          <div class="alygnn-match-mini-sub">Based on your resume + preferences</div>
        </div>
      </div>

      <div class="alygnn-match-mini-body">
        <div
          class="alygnn-score-ring"
          style="--score:${score==null?0:score}"
          aria-label="${score==null?'Alygnn score pending':score+' percent Alygnn match'}"
        >
          <div class="alygnn-score-number">
            ${score==null?'—':score+'%'}
            <small>Match</small>
          </div>
        </div>

        <div class="alygnn-mini-metrics">
          ${compactMetric('Skills',skills)}
          ${compactMetric('Experience',experience)}
          ${compactMetric('Salary',salary)}
          ${compactMetric('Location',location)}
        </div>
      </div>
    </div>
  `;
}


function benefitsScore(job){
  const wanted=normalizeList(candidatePreferences.benefits);
  const offeredText=normalizeMatchText(Array.isArray(job.benefits)?job.benefits.join(' '):(job.benefits||job.perks||''));
  if(!wanted.length||!offeredText)return null;
  let matches=0;
  wanted.forEach(item=>{
    const text=normalizeMatchText(item);
    const tokens=matchTokens(text);
    if(offeredText.includes(text)||(tokens.length&&tokens.some(token=>offeredText.includes(token))))matches++;
  });
  return Math.round((matches/wanted.length)*100);
}

function industryScore(job){
  const wanted=normalizeList(candidatePreferences.industries);
  const offered=job.industry||job.industry_name||job.category||'';
  if(!wanted.length||!offered)return null;
  return Math.max(...wanted.map(industry=>textSimilarity(industry,offered)??0));
}

function calculateAlygnnScore(job){
  const criteria=[
    {key:'role',weight:12,value:roleScore(job)},
    {key:'skills',weight:20,value:skillsScore(job)},
    {key:'experience',weight:15,value:experienceScore(job)},
    {key:'location',weight:13,value:locationScore(job)},
    {key:'workStyle',weight:10,value:workStyleScore(job)},
    {key:'jobType',weight:10,value:jobTypeScore(job)},
    {key:'salary',weight:15,value:salaryScore(job)},
    {key:'benefits',weight:3,value:benefitsScore(job)},
    {key:'industry',weight:2,value:industryScore(job)}
  ];
  const available=criteria.filter(item=>Number.isFinite(item.value));
  if(!available.length)return {score:null,breakdown:{}};
  const totalWeight=available.reduce((sum,item)=>sum+item.weight,0);
  const weighted=available.reduce((sum,item)=>sum+(item.value*item.weight),0);
  const score=Math.max(0,Math.min(100,Math.round(weighted/totalWeight)));
  return {
    score,
    breakdown:Object.fromEntries(available.map(item=>[item.key,Math.round(item.value)]))
  };
}

function renderCards(){
  const stack=document.getElementById('card-stack');
  stack.innerHTML='';

  const remaining=jobs.slice(currentIndex,currentIndex+3);

  if(!remaining.length){
    document.getElementById('swipe-area').style.display='none';
    document.getElementById('empty-screen').style.display='flex';
    updateStats();
    return;
  }

  document.getElementById('swipe-area').style.display='flex';
  document.getElementById('empty-screen').style.display='none';

  remaining.forEach((job,i)=>{
    stack.appendChild(buildCard(job,currentIndex+i));
  });

  updateStats();
  setupTopCard();
  resetDecisionStamps(activeCard);
}

function setupTopCard(){
  activeCard=document.querySelector('.job-card:first-child');
}

function setupDrag(card){
  card.addEventListener('pointerdown',dragStart,{passive:false});
}

function resetDecisionStamps(card=activeCard){
  if(!card)return;
  const applyStamp=card.querySelector('.stamp-apply');
  const skipStamp=card.querySelector('.stamp-skip');
  if(applyStamp)applyStamp.style.opacity=0;
  if(skipStamp)skipStamp.style.opacity=0;
}

function dragStart(e){
  setupTopCard();
  if(!activeCard||activeCard!==e.currentTarget)return;
  if(e.target.closest('button,.apply-link')){
    return;
  }

  e.preventDefault();
  isDragging=true;
  activePointerId=e.pointerId;
  startX=e.clientX;
  startY=e.clientY;
  currentX=0;
  dragDistance=0;
  resetDecisionStamps(activeCard);

  activeCard.classList.add('is-dragging');
  activeCard.style.transition='none';

  try{activeCard.setPointerCapture(e.pointerId)}catch(_){}

  activeCard.addEventListener('pointermove',dragMove,{passive:false});
  activeCard.addEventListener('pointerup',dragEnd);
  activeCard.addEventListener('pointercancel',dragEnd);
}

function dragMove(e){
  if(!isDragging||!activeCard)return;
  if(activePointerId!==null&&e.pointerId!==activePointerId)return;

  e.preventDefault();

  currentX=e.clientX-startX;
  const currentY=e.clientY-startY;
  dragDistance=Math.hypot(currentX,currentY);
  const rotate=currentX*.08;

  activeCard.style.transform=`translate(${currentX}px,${currentY*.25}px) rotate(${rotate}deg)`;

  const applyStamp=activeCard.querySelector('.stamp-apply');
  const skipStamp=activeCard.querySelector('.stamp-skip');

  // No preview state. If a stamp is visible, releasing performs it.
  if(currentX>=SWIPE_COMMIT_THRESHOLD){
    if(applyStamp)applyStamp.style.opacity=1;
    if(skipStamp)skipStamp.style.opacity=0;
  }else if(currentX<=-SWIPE_COMMIT_THRESHOLD){
    if(skipStamp)skipStamp.style.opacity=1;
    if(applyStamp)applyStamp.style.opacity=0;
  }else{
    resetDecisionStamps(activeCard);
  }
}

function dragEnd(e){
  if(!isDragging||!activeCard)return;

  isDragging=false;
  activePointerId=null;

  activeCard.removeEventListener('pointermove',dragMove);
  activeCard.removeEventListener('pointerup',dragEnd);
  activeCard.removeEventListener('pointercancel',dragEnd);
  activeCard.classList.remove('is-dragging');

  const tapped=dragDistance<9&&Math.abs(currentX)<9;
  const tappedIndex=activeCard.dataset.index;

  if(currentX>=SWIPE_COMMIT_THRESHOLD){
    resetDecisionStamps(activeCard);
    animateSwipe('right');
  }else if(currentX<=-SWIPE_COMMIT_THRESHOLD){
    resetDecisionStamps(activeCard);
    animateSwipe('left');
  }else{
    resetDecisionStamps(activeCard);
    activeCard.style.transition='transform .25s ease';
    activeCard.style.transform='';
    if(tapped)setTimeout(()=>openJobDetails(tappedIndex),40);
  }
}

async function createApplication(job){
  const {data:existing,error:checkError}=await sb
    .from('applications')
    .select('id')
    .eq('candidate_id',session.user.id)
    .eq('job_id',job.id)
    .maybeSingle();

  if(checkError)console.warn(checkError);
  if(existing)return true;

  const {error}=await sb.from('applications').insert({
    candidate_id:session.user.id,
    job_id:job.id,
    status:'applied',
    applied_at:new Date().toISOString(),
    match_score:Number.isFinite(Number(job.match_score))
      ?Math.round(Number(job.match_score))
      :null
  });

  if(error)throw error;
  return false;
}

async function animateSwipe(direction){
  setupTopCard();
  if(!activeCard)return;

  const job=jobs[Number(activeCard.dataset.index)];
  activeCard.classList.add(direction==='right'?'swipe-right':'swipe-left');

  history.push({job,direction,index:currentIndex});

  if(direction==='right'){
    try{
      const alreadyExists=await createApplication(job);
      applied++;
      showToast(alreadyExists?'Already applied':'Application submitted');
    }catch(error){
      console.error(error);
      showToast(error.message||'Could not apply');
    }
  }else{
    skipped++;
    showToast('Passed');
  }

  currentIndex++;

  setTimeout(renderCards,350);
}

function skipCurrent(){
  setupTopCard();
  if(activeCard)animateSwipe('left');
}

function applyCurrent(){
  setupTopCard();
  if(activeCard)animateSwipe('right');
}

function undo(){
  if(!history.length){
    showToast('Nothing to undo');
    return;
  }

  const last=history.pop();

  if(last.direction==='right'){
    applied=Math.max(0,applied-1);
  }else{
    skipped=Math.max(0,skipped-1);
  }

  currentIndex=last.index;
  renderCards();
  showToast('Undone');
}

function updateStats(){
  const remaining=Math.max(0,jobs.length-currentIndex);
  const position=jobs.length?Math.min(currentIndex+1,jobs.length):0;
  const completed=jobs.length?Math.min(currentIndex,jobs.length):0;
  const progress=jobs.length?(completed/jobs.length)*100:0;

  document.getElementById('stat-applied').textContent=applied;
  document.getElementById('stat-skipped').textContent=skipped;
  document.getElementById('stat-remaining').textContent=remaining;
  document.getElementById('job-progress-copy').textContent=`Job ${position} of ${jobs.length}`;
  document.getElementById('progress-fill').style.width=progress+'%';
}

function showToast(message){
  const toast=document.getElementById('toast');
  toast.textContent=message;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toast.classList.remove('show'),1800);
}

async function loadJobs(){
  const {data,error}=await sb
    .from('jobs')
    .select('*')
    .eq('status','active')
    .order('created_at',{ascending:false});

  if(error){
    console.error(error);
    showToast(error.message||'Could not load jobs');
    jobs=[];
    renderCards();
    return;
  }

  jobs=(data||[])
    .map(job=>{
      const result=calculateAlygnnScore(job);
      return {
        ...job,
        match_score:result.score,
        _alygnn_breakdown:result.breakdown
      };
    })
    .sort((a,b)=>{
      const scoreA=Number.isFinite(Number(a.match_score))?Number(a.match_score):-1;
      const scoreB=Number.isFinite(Number(b.match_score))?Number(b.match_score):-1;
      return scoreB-scoreA;
    });

  currentIndex=0;
  history=[];
  renderCards();
}

function getCandidateThemePreference(){
  const saved=
    localStorage.getItem('alygnn_candidate_theme') ||
    localStorage.getItem('alygnn-theme') ||
    'system';

  return ['system','light','dark'].includes(saved)
    ?saved
    :'system';
}

function resolveCandidateTheme(preference=getCandidateThemePreference()){
  if(preference==='light'||preference==='dark'){
    return preference;
  }

  return window.matchMedia &&
    window.matchMedia('(prefers-color-scheme: dark)').matches
      ?'dark'
      :'light';
}

function applyCandidateTheme(){
  const preference=getCandidateThemePreference();
  const resolved=resolveCandidateTheme(preference);

  document.body.dataset.theme=resolved;
  document.body.dataset.themePreference=preference;

  const themeMeta=document.querySelector('meta[name="theme-color"]:not([media])');
  if(themeMeta){
    themeMeta.setAttribute(
      'content',
      resolved==='dark' ? '#061821' : '#F6F8F7'
    );
  }

  return resolved;
}

function watchCandidateTheme(){
  applyCandidateTheme();

  if(window.matchMedia){
    const media=window.matchMedia('(prefers-color-scheme: dark)');
    const onSystemThemeChange=()=>{
      if(getCandidateThemePreference()==='system'){
        applyCandidateTheme();
      }
    };

    if(typeof media.addEventListener==='function'){
      media.addEventListener('change',onSystemThemeChange);
    }else if(typeof media.addListener==='function'){
      media.addListener(onSystemThemeChange);
    }
  }

  window.addEventListener('storage',event=>{
    if(
      event.key==='alygnn_candidate_theme' ||
      event.key==='alygnn-theme'
    ){
      applyCandidateTheme();
    }
  });

  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden){
      applyCandidateTheme();
    }
  });

  window.addEventListener('pageshow',applyCandidateTheme);
}

function enforceCandidateNav(){
  const label=document.getElementById('discover-nav-label');
  if(label&&label.textContent!=='Discover'){

(async function initialize(){
  watchCandidateTheme();

  const {data,error}=await sb.auth.getSession();

  if(error||!data.session){
    window.location.replace('app-login.html');
    return;
  }

  session=data.session;

  const fullName=
    session.user.user_metadata?.full_name||
    session.user.user_metadata?.name||
    session.user.email?.split('@')[0]||
    'User';

  document.getElementById('profile-button').textContent=initials(fullName);

  const {count}=await sb
    .from('applications')
    .select('*',{count:'exact',head:true})
    .eq('candidate_id',session.user.id);

  applied=count||0;

  try{
    await loadCandidateMatchingProfile();
  }catch(profileError){
    console.error('Could not load Alygnn matching profile:',profileError);
    showToast('Could not load your Alygnn matching profile');
  }

  await loadJobs();

  enforceCandidateNav();
  setTimeout(enforceCandidateNav,250);
  setTimeout(enforceCandidateNav,1000);
})();
</script>
