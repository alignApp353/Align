<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Alygnn — Messages</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'DM Sans',Arial,sans-serif!important}
:root{--brand:#5D7FA3;--brand-dark:#345F91;--sage:#8CB69B;--bg:#F6F8F7;--card:#fff;--text:#172333;--muted:#647282;--border:#DDE3E8;--soft:#EAF0F6;--danger:#C74747}
@media(prefers-color-scheme:dark){:root{--bg:#061821;--card:#10232D;--text:#F3F7FA;--muted:#A9B8C5;--border:#29404C;--soft:#172A40}}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
button{font:inherit}.shell{width:100%;max-width:620px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 18px 28px}
.top{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;min-height:78px}.back{width:46px;height:46px;border:1px solid var(--border);border-radius:50%;background:var(--card);color:var(--text);font-size:22px}.logo{text-align:center;font-family:'DM Serif Display',Georgia,serif!important;font-size:38px;color:var(--brand)}.logo span{color:var(--sage)}
.eyebrow{margin-top:22px;color:var(--brand-dark);font-size:11px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase}.title{margin-top:7px;font-size:34px;line-height:1.06;font-weight:900;letter-spacing:-.8px}.sub{margin-top:8px;color:var(--muted);font-size:14px;line-height:1.55}
.list{display:grid;gap:12px;margin-top:22px}.thread{width:100%;border:1px solid var(--border);border-radius:22px;background:var(--card);padding:16px;display:grid;grid-template-columns:50px 1fr auto;gap:12px;align-items:center;text-align:left;color:var(--text)}.avatar{width:50px;height:50px;border-radius:16px;background:var(--soft);color:var(--brand-dark);display:grid;place-items:center;font-size:14px;font-weight:900}.name{font-size:15px;font-weight:900}.job{margin-top:3px;color:var(--muted);font-size:11px}.preview{margin-top:7px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}.time{font-size:9px;color:var(--muted);white-space:nowrap}.unread{display:inline-grid;place-items:center;min-width:20px;height:20px;margin-top:7px;padding:0 5px;border-radius:999px;background:#E64141;color:#fff;font-size:9px;font-weight:900}.empty{margin-top:24px;padding:38px 24px;border:1px solid var(--border);border-radius:24px;background:var(--card);text-align:center}.empty strong{font-size:17px}.empty p{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.55}.notice{margin-top:18px;padding:13px 15px;border-radius:15px;background:var(--soft);color:var(--brand-dark);font-size:12px;font-weight:700;line-height:1.5}.error{background:#FCECEC;color:var(--danger)}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:20;min-height:76px;padding:8px 5px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 96%,transparent);border-top:1px solid var(--border);display:grid;backdrop-filter:blur(18px)}.bottom-nav.candidate{grid-template-columns:repeat(5,1fr)}.bottom-nav.employer{grid-template-columns:repeat(6,1fr)}.nav{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:8px;font-weight:900}.nav.active{color:var(--brand-dark)}.nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="shell">
  <div class="top"><button class="back" id="back" type="button">←</button><div class="logo">Alygnn<span>.</span></div><div></div></div>
  <div class="eyebrow" id="eyebrow">Messages</div>
  <h1 class="title">Messages</h1>
  <p class="sub" id="sub">Hiring conversations connected to applications.</p>
  <div id="notice" class="notice" hidden></div>
  <div id="list" class="list"><div class="empty"><strong>Loading conversations…</strong></div></div>
</div>
<nav class="bottom-nav candidate" id="nav"></nav>
<script>
const sb=supabase.createClient('https://auth.alygnn.com','sb_publishable_3l8krRh6WCyvKfNumWDBDw_C6CKr7rG',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let session=null,role='candidate',channelA=null,channelB=null,reloadTimer=null;
const icon={profile:'<circle cx="12" cy="7.5" r="3.5"></circle><path d="M5.5 20c.7-4 3-6 6.5-6s5.8 2 6.5 6"></path>',discover:'<circle cx="10.5" cy="10.5" r="5.5"></circle><path d="m15 15 4.5 4.5"></path>',jobs:'<rect x="4" y="7" width="16" height="12" rx="2"></rect><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7"></path>',messages:'<path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z"></path><path d="M8 9h8"></path><path d="M8 13h5"></path>',settings:'<circle cx="12" cy="12" r="3"></circle><path d="M19 12a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"></path>',dashboard:'<rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect>',applicants:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle>',company:'<path d="M3 21h18"></path><path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"></path>'};
function navButton(name,label,url,active=false){return `<button class="nav ${active?'active':''}" onclick="location.href='${url}'"><svg viewBox="0 0 24 24">${icon[name]}</svg><span>${label}</span></button>`}
function renderNav(){const n=$('nav');if(role==='employer'){n.className='bottom-nav employer';n.innerHTML=navButton('dashboard','Dashboard','app-employer-dashboard.html?view=dashboard')+navButton('jobs','Jobs','app-employer-dashboard.html?view=jobs')+navButton('applicants','Applicants','app-employer-dashboard.html?view=applicants')+navButton('messages','Messages','app-messages.html?role=employer',true)+navButton('company','Company','app-employer-dashboard.html?view=company')+navButton('settings','Settings','app-employer-dashboard.html?view=settings')}else{n.className='bottom-nav candidate';n.innerHTML=navButton('profile','My Profile','app-account.html')+navButton('discover','Discover','app-swipe.html')+navButton('jobs','My Jobs','app-applied.html')+navButton('messages','Messages','app-messages.html?role=candidate',true)+navButton('settings','Settings','app-account.html#settings')}}
function initials(v){return String(v||'A').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'A'}
function time(v){if(!v)return'';const d=new Date(v),s=Math.max(0,(Date.now()-d)/1000);if(s<60)return'Now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';if(s<604800)return Math.floor(s/86400)+'d';return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}
async function resolveRole(){const q=new URLSearchParams(location.search).get('role');if(q==='employer'||q==='candidate')return q;try{const {data}=await sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle();if(String(data?.role||'').toLowerCase()==='employer')return'employer'}catch(_){}const meta=String(session.user.user_metadata?.role||session.user.user_metadata?.account_type||session.user.app_metadata?.role||'').toLowerCase();return meta==='employer'?'employer':'candidate'}
async function load(){try{const {data,error}=await sb.from('application_conversations').select('*').order('last_message_at',{ascending:false});if(error)throw error;const conversations=data||[];if(!conversations.length){$('list').innerHTML=`<div class="empty"><strong>No messages yet</strong><p>${role==='candidate'?'When an employer messages you about an application, the conversation will appear here. Candidates cannot start new employer chats.':'Open an applicant and choose Message Candidate to start a conversation.'}</p></div>`;return}const jobIds=[...new Set(conversations.map(x=>x.job_id).filter(Boolean))];const candidateIds=[...new Set(conversations.map(x=>x.candidate_id).filter(Boolean))];const conversationIds=conversations.map(x=>x.id);let jobs=[],profiles=[],messages=[];if(jobIds.length){const r=await sb.from('jobs').select('*').in('id',jobIds);jobs=r.data||[]}if(candidateIds.length){const r=await sb.from('profiles').select('*').in('id',candidateIds);profiles=r.data||[]}if(conversationIds.length){const r=await sb.from('application_messages').select('*').in('conversation_id',conversationIds).order('created_at',{ascending:false});messages=r.data||[]}const jobMap=new Map(jobs.map(x=>[String(x.id),x])),profileMap=new Map(profiles.map(x=>[String(x.id),x]));const last=new Map(),unread=new Map();for(const m of messages){const id=String(m.conversation_id);if(!last.has(id))last.set(id,m);if(String(m.sender_id)!==String(session.user.id)&&!m.read_at)unread.set(id,(unread.get(id)||0)+1)}$('list').innerHTML=conversations.map(c=>{const j=jobMap.get(String(c.job_id))||{},p=profileMap.get(String(c.candidate_id))||{},m=last.get(String(c.id));const candidate=p.full_name||p.name||[p.first_name,p.last_name].filter(Boolean).join(' ')||'Candidate';const company=j.company||j.company_name||j.employer_name||'Employer';const name=role==='employer'?candidate:company;const count=unread.get(String(c.id))||0;return `<button class="thread" onclick="location.href='app-chat.html?role=${role}&application=${encodeURIComponent(c.application_id)}'"><div class="avatar">${esc(initials(name))}</div><div><div class="name">${esc(name)}</div><div class="job">${esc(j.title||'Job application')}</div><div class="preview">${esc(m?.body||'Conversation started')}</div></div><div><div class="time">${esc(time(m?.created_at||c.last_message_at))}</div>${count?`<div class="unread">${count>99?'99+':count}</div>`:''}</div></button>`}).join('')}catch(error){console.error(error);$('notice').hidden=false;$('notice').className='notice error';$('notice').textContent='Messaging could not be loaded. Run the Alygnn messaging SQL in Supabase, then try again.';$('list').innerHTML=''}}
function schedule(){clearTimeout(reloadTimer);reloadTimer=setTimeout(load,150)}
function realtime(){channelA=sb.channel('alygnn-conversations-'+session.user.id).on('postgres_changes',{event:'*',schema:'public',table:'application_conversations'},schedule).subscribe();channelB=sb.channel('alygnn-messages-'+session.user.id).on('postgres_changes',{event:'*',schema:'public',table:'application_messages'},schedule).subscribe()}
$('back').onclick=()=>location.href=role==='employer'?'app-employer-dashboard.html?view=applicants':'app-applied.html';
(async()=>{const {data,error}=await sb.auth.getSession();if(error||!data.session){location.replace('app-login.html');return}session=data.session;role=await resolveRole();$('eyebrow').textContent=role==='employer'?'Employer workspace':'Candidate workspace';$('sub').textContent=role==='candidate'?'Only conversations started by an employer after you applied appear here.':'Start and manage conversations with candidates who applied to your jobs.';renderNav();await load();realtime()})();
</script>
</body>
</html>
