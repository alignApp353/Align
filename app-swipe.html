<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alygnn — Swipe Jobs</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;700;800&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:'DM Sans',Arial,sans-serif!important;
}

:root{
  --brand:#5D7FA3;
  --brand-dark:#345F91;
  --sage:#8CB69B;
  --bg:#F6F8F7;
  --card-bg:#FFFFFF;
  --text:#172333;
  --border:#DDE3E8;
  --mint:#6FBF8F;
  --rose:#D79A9A;
  --text-muted:#56677B;
  --brand-light:rgba(93,127,163,.10);
  --mint-light:rgba(111,191,143,.15);
  --rose-light:rgba(215,154,154,.16);
}

html,body{
  width:100%;
  min-height:100%;
}

body{
  background:
    radial-gradient(circle at top,rgba(93,127,163,.09),transparent 30%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow:hidden;
}

/* HEADER */
.top-header{
  min-height:112px;
  padding:calc(14px + env(safe-area-inset-top)) 18px 14px;
  display:grid;
  grid-template-columns:92px 1fr 92px;
  align-items:center;
  background:rgba(246,248,247,.96);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(16px);
}

.back-btn{
  min-height:44px;
  border:none;
  border-radius:999px;
  background:rgba(93,127,163,.09);
  color:var(--text);
  padding:0 15px;
  font-size:14px;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  cursor:pointer;
}

.brand-block{
  text-align:center;
}

.logo{
  font-family:'DM Serif Display',Georgia,serif!important;
  font-size:31px;
  line-height:1;
  color:var(--brand);
}

.logo span{
  color:var(--sage);
}

.tagline{
  margin-top:5px;
  font-size:11px;
  color:var(--text-muted);
  font-weight:600;
}

.profile-chip{
  justify-self:end;
  width:46px;
  height:46px;
  border:none;
  border-radius:50%;
  background:linear-gradient(145deg,var(--brand),#6E95BE);
  color:#fff;
  font-size:14px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* PROGRESS */
.progress-shell{
  padding:12px 18px 0;
}

.progress-card{
  max-width:430px;
  margin:0 auto;
  background:rgba(255,255,255,.88);
  border:1px solid var(--border);
  border-radius:20px;
  padding:12px 14px;
  display:grid;
  grid-template-columns:repeat(3,1fr) 1.4fr;
  gap:8px;
  align-items:center;
  box-shadow:0 8px 22px rgba(25,40,60,.05);
}

.stat{
  text-align:center;
}

.stat-val{
  font-size:18px;
  font-weight:900;
  color:var(--text);
}

.stat-label{
  margin-top:2px;
  font-size:9px;
  color:var(--text-muted);
  text-transform:uppercase;
  letter-spacing:.8px;
  font-weight:800;
}

.job-progress{
  border-left:1px solid var(--border);
  padding-left:12px;
}

.progress-copy{
  font-size:11px;
  font-weight:800;
  color:var(--text);
  text-align:center;
  margin-bottom:6px;
}

.progress-track{
  width:100%;
  height:7px;
  background:#E8EDF2;
  border-radius:999px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0;
  background:var(--brand);
  border-radius:inherit;
  transition:width .25s ease;
}

/* MAIN */
.swipe-area{
  height:calc(100vh - 112px - 84px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:14px 18px calc(92px + env(safe-area-inset-bottom));
}

.card-stack{
  position:relative;
  width:100%;
  max-width:430px;
  height:min(525px,calc(100vh - 305px));
}

.job-card{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at top right,rgba(93,127,163,.08),transparent 28%),
    var(--card-bg);
  border:1px solid var(--border);
  border-radius:30px;
  padding:24px;
  box-shadow:0 22px 60px rgba(27,43,63,.12);
  display:flex;
  flex-direction:column;
  cursor:grab;
  user-select:none;
  touch-action:none;
  transform-origin:center bottom;
  transition:transform .22s ease,box-shadow .22s ease;
}

.job-card:nth-child(2){
  transform:scale(.97) translateY(10px);
  z-index:1;
}

.job-card:nth-child(3){
  transform:scale(.94) translateY(20px);
  z-index:0;
}

.job-card:first-child{
  z-index:2;
}

.job-card.is-dragging{
  transition:none;
  box-shadow:0 22px 55px rgba(27,43,63,.17);
}

.job-card.swipe-left{animation:swipeLeft .35s ease forwards}
.job-card.swipe-right{animation:swipeRight .35s ease forwards}

.stamp{
  position:absolute;
  top:24px;
  padding:7px 16px;
  border-radius:10px;
  font-size:19px;
  font-weight:900;
  letter-spacing:2px;
  opacity:0;
  border:3px solid;
  pointer-events:none;
}

.stamp-apply{
  right:24px;
  color:var(--mint);
  border-color:var(--mint);
  transform:rotate(12deg);
}

.stamp-skip{
  left:24px;
  color:var(--rose);
  border-color:var(--rose);
  transform:rotate(-12deg);
}

.card-toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.match{
  display:inline-flex;
  align-items:center;
  gap:7px;
  width:max-content;
  background:linear-gradient(180deg,#EDF8F1,#E4F3EA);
  color:#257B52;
  padding:9px 14px;
  border-radius:999px;
  border:1px solid rgba(111,191,143,.28);
  font-size:13px;
  font-weight:900;
}

.save-btn{
  width:36px;
  height:36px;
  border-radius:50%;
  border:1px solid var(--border);
  background:#fff;
  color:var(--text);
  font-size:19px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card-top{
  display:flex;
  gap:15px;
  margin-bottom:18px;
  align-items:flex-start;
}

.company-logo{
  width:68px;
  height:68px;
  border-radius:22px;
  background:linear-gradient(145deg,#F5F8FA,#E5ECF2);
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  font-weight:900;
  color:var(--brand-dark);
  flex-shrink:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9);
}

.job-title{
  font-family:'DM Serif Display',Georgia,serif!important;
  font-size:31px;
  line-height:1.02;
  letter-spacing:-.4px;
  color:var(--text);
  text-transform:none;
}

.company-line{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:6px;
}

.company-name{
  font-size:15px;
  color:var(--text-muted);
}

.verified{
  width:17px;
  height:17px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--brand);
  color:white;
  font-size:10px;
  font-weight:900;
}

.card-pills{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:18px;
}

.pill{
  font-size:12px;
  padding:8px 12px;
  border-radius:999px;
  border:1px solid var(--border);
  color:var(--text-muted);
  background:rgba(250,252,253,.92);
  font-weight:800;
}

.salary{
  background:var(--brand-light);
  color:var(--brand-dark);
}

.card-desc{
  font-size:14px;
  color:var(--text-muted);
  line-height:1.68;
  flex:1;
  overflow:hidden;
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:6;
}

.card-bottom{
  border-top:1px solid var(--border);
  padding-top:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:17px;
}

.posted-time{
  font-size:12px;
  color:var(--text-muted);
}

.apply-link{
  color:var(--brand-dark);
  text-decoration:none;
  font-size:13px;
  font-weight:900;
}


.quick-facts{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin:2px 0 18px;
}

.fact{
  border:1px solid var(--border);
  background:rgba(248,250,252,.9);
  border-radius:16px;
  padding:11px 10px;
}

.fact-label{
  font-size:9px;
  letter-spacing:.8px;
  text-transform:uppercase;
  color:var(--text-muted);
  font-weight:900;
}

.fact-value{
  margin-top:5px;
  font-size:12px;
  line-height:1.25;
  color:var(--text);
  font-weight:900;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.card-actions-mini{
  display:flex;
  align-items:center;
  gap:4px;
}

.icon-btn{
  width:36px;
  height:36px;
  border-radius:50%;
  border:1px solid var(--border);
  background:#fff;
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
}

/* ACTIONS */
.action-buttons{
  display:flex;
  align-items:flex-end;
  gap:22px;
  margin-top:20px;
}

.action-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}

.action-label{
  font-size:11px;
  color:var(--text-muted);
  font-weight:800;
}

.action-btn{
  border:none;
  border-radius:50%;
  background:white;
  border:1.5px solid var(--border);
  box-shadow:0 5px 16px rgba(27,43,63,.10);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

.btn-undo{
  width:48px;
  height:48px;
  font-size:19px;
  color:var(--text);
}

.btn-skip{
  width:60px;
  height:60px;
  font-size:27px;
  color:#D25B67;
}

.btn-apply{
  width:70px;
  height:70px;
  font-size:31px;
  background:var(--brand);
  color:white;
  border:none;
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  max-width:520px;
  margin:0 auto;
  min-height:72px;
  padding:10px 12px calc(13px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.96);
  border-top:1px solid var(--border);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  z-index:50;
  backdrop-filter:blur(16px);
}

.nav-link{
  border:none;
  background:transparent;
  color:var(--text-muted);
  font-size:11px;
  font-weight:800;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}

.nav-icon{
  font-size:19px;
  line-height:1;
}

.nav-link.active{
  color:var(--brand-dark);
}

/* EMPTY + TOAST */
.empty-screen{
  display:none;
  height:calc(100vh - 112px);
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:30px;
}

.empty-title{
  font-family:'DM Serif Display',Georgia,serif!important;
  font-size:32px;
  margin-bottom:10px;
}

.empty-sub{
  color:var(--text-muted);
  line-height:1.6;
  max-width:320px;
}

.toast{
  position:fixed;
  bottom:92px;
  left:50%;
  transform:translateX(-50%) translateY(18px);
  background:var(--text);
  color:white;
  padding:12px 22px;
  border-radius:999px;
  font-size:14px;
  transition:opacity .2s ease, transform .2s ease;
  z-index:100;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  white-space:nowrap;
}

.toast.show{
  transform:translateX(-50%) translateY(0);
  opacity:1;
  visibility:visible;
}

@keyframes swipeLeft{
  to{transform:translateX(-130%) rotate(-22deg);opacity:0}
}

@keyframes swipeRight{
  to{transform:translateX(130%) rotate(22deg);opacity:0}
}

@media(max-height:760px){
  .top-header{min-height:96px;padding-top:calc(9px + env(safe-area-inset-top))}
  .logo{font-size:27px}
  .tagline{display:none}
  .progress-shell{padding-top:7px}
  .progress-card{padding:9px 12px}
  .swipe-area{height:calc(100vh - 96px - 72px);padding-top:9px}
  .card-stack{height:min(470px,calc(100vh - 270px))}
  .job-card{padding:19px}
  .job-title{font-size:25px}
  .card-desc{-webkit-line-clamp:5}
  .action-buttons{margin-top:13px}
}


/* FULL JOB AD */
body.details-open{overflow:hidden}
.job-details-overlay{
  position:fixed;inset:0;z-index:300;background:rgba(23,35,51,.42);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .22s ease;
}
.job-details-overlay.open{opacity:1;pointer-events:auto}
.job-details-sheet{
  width:100%;max-height:94vh;background:var(--bg);border-radius:30px 30px 0 0;
  transform:translateY(100%);transition:transform .34s cubic-bezier(.2,.8,.2,1);
  overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 -22px 70px rgba(23,35,51,.18);
}
.job-details-overlay.open .job-details-sheet{transform:translateY(0)}
.details-grip{width:44px;height:5px;border-radius:999px;background:#D4DCE3;margin:10px auto 5px;flex-shrink:0}
.details-header{
  padding:8px 18px 14px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;
  border-bottom:1px solid var(--border);background:rgba(246,248,247,.96)
}
.details-close,.details-save{
  width:42px;height:42px;border:1px solid var(--border);border-radius:50%;background:#fff;
  color:var(--text);font-size:20px;display:grid;place-items:center
}
.details-header-title{text-align:center;font-size:13px;font-weight:900;color:var(--text)}
.details-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 17px 120px}
.details-hero{background:#fff;border:1px solid var(--border);border-radius:24px;padding:20px;box-shadow:0 12px 32px rgba(23,35,51,.07)}
.details-company-row{display:flex;gap:14px;align-items:flex-start}
.details-logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(145deg,#F5F8FA,#E5ECF2);border:1px solid var(--border);display:grid;place-items:center;font-size:22px;font-weight:900;color:var(--brand-dark);flex-shrink:0}
.details-title{font-family:'DM Serif Display',Georgia,serif!important;font-size:29px;line-height:1.05;color:var(--text)}
.details-company{margin-top:6px;font-size:14px;color:var(--text-muted);font-weight:700}
.details-pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:17px}
.details-pill{font-size:11px;font-weight:800;padding:8px 11px;border-radius:999px;border:1px solid var(--border);background:#F9FBFC;color:var(--text-muted)}
.details-pill.pay{background:var(--brand-light);color:var(--brand-dark);border-color:rgba(93,127,163,.2)}
.details-section{margin-top:14px;background:#fff;border:1px solid var(--border);border-radius:21px;padding:18px}
.details-section h2{font-size:16px;font-weight:900;margin-bottom:10px;color:var(--text)}
.details-copy{font-size:14px;color:var(--text-muted);line-height:1.7;white-space:pre-wrap;word-break:break-word}
.details-list{display:grid;gap:10px;list-style:none}
.details-list li{position:relative;padding-left:17px;font-size:13px;color:var(--text-muted);line-height:1.55}
.details-list li::before{content:'';position:absolute;left:0;top:.58em;width:6px;height:6px;border-radius:50%;background:var(--brand)}
.details-empty{font-size:13px;color:var(--text-muted);font-style:italic}
.details-footer{position:absolute;left:0;right:0;bottom:0;padding:11px 16px calc(11px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid var(--border);backdrop-filter:blur(18px)}
.details-apply{width:100%;min-height:56px;border:none;border-radius:17px;background:var(--brand-dark);color:#fff;font-size:15px;font-weight:900;box-shadow:0 9px 22px rgba(52,95,145,.22)}
.details-apply:disabled{opacity:.6}
.tap-hint{font-size:11px;color:var(--brand-dark);font-weight:900}
@media(min-width:700px){.job-details-overlay{align-items:center;justify-content:center;padding:24px}.job-details-sheet{max-width:560px;border-radius:30px;max-height:90vh}.details-footer{border-radius:0 0 30px 30px}}

</style>

<style id="candidate-four-tab-nav">
.bottom-nav{
  display:grid!important;
  grid-template-columns:repeat(4,1fr)!important;
}
.bottom-nav .nav-item{
  position:relative;
  min-height:54px;
  border:none;
  background:transparent;
  color:#738394;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:9px;
  font-weight:800;
  cursor:pointer;
}
.bottom-nav .nav-item.active{color:#35679A}
.bottom-nav .nav-item.active:before{
  content:'';
  position:absolute;
  top:-9px;
  width:34px;
  height:3px;
  border-radius:999px;
  background:#35679A;
}
.bottom-nav .nav-icon{font-size:17px;line-height:1}
</style>


<script src="app-candidate-theme.js"></script>
<link rel="stylesheet" href="app-candidate-theme.css">

<style id="swipe-caught-up-fix">
.empty-screen{
  min-height:calc(100vh - 250px)!important;
  height:auto!important;
  padding:28px 18px 118px!important;
}

.empty-card{
  width:100%;
  max-width:430px;
  margin:auto;
  padding:28px 22px;
  border:1px solid var(--border);
  border-radius:26px;
  background:#FFFFFF;
  box-shadow:0 14px 36px rgba(23,35,51,.055);
}

.empty-kicker{
  color:var(--brand-dark);
  font-size:10px;
  font-weight:900;
  letter-spacing:1.2px;
  text-transform:uppercase;
  margin-bottom:10px;
}

.empty-title{
  margin-bottom:9px!important;
}

.empty-sub{
  margin:0 auto;
}

.empty-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:22px;
}

.empty-primary,
.empty-secondary{
  min-height:48px;
  border-radius:15px;
  font-size:12px;
  font-weight:900;
}

.empty-primary{
  border:0;
  background:var(--brand-dark);
  color:#fff;
}

.empty-secondary{
  border:1px solid var(--border);
  background:#fff;
  color:var(--text);
}

/* Keep toast readable in dark mode. */
html[data-effective-theme="dark"] .toast{
  background:#22303C!important;
  color:#F4F7F9!important;
  border:1px solid #334452!important;
  box-shadow:0 10px 30px rgba(0,0,0,.28)!important;
}

html[data-effective-theme="dark"] .empty-card{
  background:#15202B!important;
  border-color:#2B3946!important;
  color:#F4F7F9!important;
}

html[data-effective-theme="dark"] .empty-secondary{
  background:#101A23!important;
  border-color:#2B3946!important;
  color:#F4F7F9!important;
}

@media(max-width:390px){
  .empty-actions{grid-template-columns:1fr}
}
</style>
</head>

<body>
<header class="top-header">
  <button class="back-btn" id="back-button" type="button">
    <span aria-hidden="true">←</span>
    <span>Back</span>
  </button>

  <div class="brand-block">
    <div class="logo">Alygnn<span>.</span></div>
    <div class="tagline">Get better job matches.</div>
  </div>

  <button class="profile-chip" id="profile-button" type="button" aria-label="Open profile">JE</button>
</header>

<section class="progress-shell">
  <div class="progress-card">
    <div class="stat">
      <div class="stat-val" id="stat-applied">0</div>
      <div class="stat-label">Applied</div>
    </div>

    <div class="stat">
      <div class="stat-val" id="stat-skipped">0</div>
      <div class="stat-label">Passed</div>
    </div>

    <div class="stat">
      <div class="stat-val" id="stat-remaining">0</div>
      <div class="stat-label">Left</div>
    </div>

    <div class="job-progress">
      <div class="progress-copy" id="job-progress-copy">Job 0 of 0</div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>
  </div>
</section>

<main class="swipe-area" id="swipe-area">

      <button class="details-apply" id="details-apply" type="button">Apply Now</button>

<div class="toast" id="toast"></div>

<script>
const sb=supabase.createClient(
  'https://auth.alygnn.com',
  'sb_publishable_3l8krRh6WCyvKfNumWDBDw_C6CKr7rG',
  {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}
);

let session=null;
let jobs=[];
let currentIndex=0;
let applied=0;
let skipped=0;
let history=[];
let activeCard=null;
let isDragging=false;
let startX=0;
let startY=0;
let currentX=0;
let activePointerId=null;
let toastTimer;
let detailsJobIndex=null;
let dragDistance=0;

function escapeHtml(value){
  return String(value??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  })[c]);
}

function initials(value){
  const parts=String(value||'A').trim().split(/\s+/).filter(Boolean);
  return ((parts[0]?.[0]||'A')+(parts[1]?.[0]||'')).toUpperCase();
}

function salaryText(job){
  if(job.salary)return job.salary;
  if(job.salary_min&&job.salary_max){
    return '$'+Number(job.salary_min).toLocaleString()+'–$'+Number(job.salary_max).toLocaleString();
  }
  if(job.salary_min)return 'From $'+Number(job.salary_min).toLocaleString();
  if(job.salary_max)return 'Up to $'+Number(job.salary_max).toLocaleString();
  return 'Salary not listed';
}

function postedText(value){
  if(!value)return 'Recently posted';
  const date=new Date(value);
  if(Number.isNaN(date.getTime()))return 'Recently posted';
  const days=Math.floor((Date.now()-date.getTime())/86400000);
  if(days<=0)return 'Today';
  if(days===1)return '1 day ago';
  return days+' days ago';
}



function normalizeList(value){
  if(Array.isArray(value))return value.map(v=>String(v).trim()).filter(Boolean);
  if(!value)return [];
  if(typeof value==='object')return Object.values(value).flatMap(normalizeList);
  return String(value)
    .split(/\n|•|;|\|/)
    .map(v=>v.replace(/^[-–—✓✔]\s*/, '').trim())
    .filter(Boolean);
}

function renderList(items,emptyText){
  const clean=normalizeList(items);
  if(!clean.length)return `<div class="details-empty">${escapeHtml(emptyText)}</div>`;
  return `<ul class="details-list">${clean.map(item=>`<li>${escapeHtml(item)}</li>`).join('')}</ul>`;
}

function getJobLists(job){
  return {
    responsibilities: job.responsibilities||job.tasks||job.duties||[],
    requirements: job.requirements||job.qualifications||job.skills||[],
    benefits: job.benefits||job.perks||[]
  };
}

function openJobDetails(index){
  const job=jobs[Number(index)];
  if(!job)return;
  detailsJobIndex=Number(index);

  const company=job.company||job.company_name||'Employer';
  const location=job.location||[job.city,job.state].filter(Boolean).join(', ')||'Location not listed';
  const type=job.job_type||job.employment_type||'Job';
  const style=job.work_style||'';
  const lists=getJobLists(job);
  const companyAbout=job.company_description||job.company_headline||job.about_company||'';

  document.getElementById('details-scroll').innerHTML=`
    <article class="details-hero">
      <div class="details-company-row">
        <div class="details-logo">${escapeHtml(initials(company))}</div>
        <div>
          <h1 class="details-title" id="details-job-title">${escapeHtml(job.title||'Job Opportunity')}</h1>
          <div class="details-company">${escapeHtml(company)} · Verified employer</div>
        </div>
      </div>
      <div class="details-pills">
        <span class="details-pill">⌖ ${escapeHtml(location)}</span>
        <span class="details-pill">▣ ${escapeHtml(type)}</span>
        ${style?`<span class="details-pill">⌂ ${escapeHtml(style)}</span>`:''}
        <span class="details-pill pay">${escapeHtml(salaryText(job))}</span>
      </div>
    </article>

    <section class="details-section">
      <h2>About the role</h2>
      <div class="details-copy">${escapeHtml(job.description||'The employer has not added a full description yet.')}</div>
    </section>

    <section class="details-section">
      <h2>Responsibilities</h2>
      ${renderList(lists.responsibilities,'Responsibilities will be discussed during the hiring process.')}
    </section>

    <section class="details-section">
      <h2>Requirements</h2>
      ${renderList(lists.requirements,'No additional requirements were listed.')}
    </section>

    <section class="details-section">
      <h2>Benefits</h2>
      ${renderList(lists.benefits,'Benefits were not listed for this role.')}
    </section>

    <section class="details-section">
      <h2>About ${escapeHtml(company)}</h2>
      <div class="details-copy">${escapeHtml(companyAbout||'This is a verified employer on Alygnn.')}</div>
    </section>
  `;

  document.getElementById('details-save').textContent='♡';
  document.getElementById('details-apply').textContent='Apply Now';
  document.getElementById('details-apply').disabled=false;
  document.getElementById('details-scroll').scrollTop=0;
  document.body.classList.add('details-open');
  const overlay=document.getElementById('job-details-overlay');
  overlay.classList.add('open');
  overlay.setAttribute('aria-hidden','false');
}

function closeJobDetails(){
  const overlay=document.getElementById('job-details-overlay');
  overlay.classList.remove('open');
  overlay.setAttribute('aria-hidden','true');
  document.body.classList.remove('details-open');
  setTimeout(()=>{detailsJobIndex=null;},220);
}

async function applyFromDetails(){
  if(detailsJobIndex===null)return;
  const button=document.getElementById('details-apply');
  const job=jobs[detailsJobIndex];
  if(!job)return;
  button.disabled=true;
  button.textContent='Applying…';
  try{
    const alreadyExists=await createApplication(job);
    if(!alreadyExists)applied++;
    button.textContent=alreadyExists?'Already Applied':'✓ Applied';
    updateStats();
    showToast(alreadyExists?'Already applied':'Application submitted');
    setTimeout(()=>{
      closeJobDetails();
      if(detailsJobIndex===currentIndex){
        history.push({job,direction:'right',index:currentIndex});
        currentIndex++;
        setTimeout(renderCards,230);
      }
    },650);
  }catch(error){
    console.error(error);
    button.disabled=false;
    button.textContent='Apply Now';
    showToast(error.message||'Could not apply');
  }
}

function buildCard(job,index){
  const card=document.createElement('div');
  card.className='job-card';
  card.dataset.index=index;

  const company=job.company||job.company_name||'Employer';
  const location=job.location||[job.city,job.state].filter(Boolean).join(', ')||'Location not listed';
  const type=job.job_type||job.employment_type||'Job';
  const style=job.work_style||'';
  const match=job.match_score!=null?job.match_score+'% Match':'New Match';

  card.innerHTML=`
    <div class="stamp stamp-apply">APPLY</div>
    <div class="stamp stamp-skip">PASS</div>

    <div class="card-toolbar">
      <div class="match">★ ${escapeHtml(match)}</div>
      <div class="card-actions-mini">
        <button class="icon-btn share-btn" type="button" aria-label="Share job">↗</button>
        <button class="save-btn" type="button" aria-label="Save job">♡</button>
      </div>
    </div>

    <div class="card-top">
      <div class="company-logo">${escapeHtml(initials(company))}</div>
      <div>
        <div class="job-title">${escapeHtml(job.title||'Job Opportunity')}</div>
        <div class="company-line">
          <div class="company-name">${escapeHtml(company)}</div>
          <div class="verified" title="Verified employer">✓</div>
        </div>
      </div>
    </div>

    <div class="card-pills">
      <span class="pill">⌖ ${escapeHtml(location)}</span>
      <span class="pill">▣ ${escapeHtml(type)}</span>
      ${style?`<span class="pill">⌂ ${escapeHtml(style)}</span>`:''}
      <span class="pill salary">$ ${escapeHtml(salaryText(job))}</span>
    </div>

    <div class="quick-facts">
      <div class="fact">
        <div class="fact-label">Match</div>
        <div class="fact-value">${escapeHtml(match)}</div>
      </div>
      <div class="fact">
        <div class="fact-label">Work Style</div>
        <div class="fact-value">${escapeHtml(style||'Flexible')}</div>
      </div>
      <div class="fact">
        <div class="fact-label">Posted</div>
        <div class="fact-value">${escapeHtml(postedText(job.created_at))}</div>
      </div>
    </div>

    <div class="card-desc">${escapeHtml(job.description||'Open this job to see the full details and requirements.')}</div>

    <div class="card-bottom">
      <div class="posted-time">Verified Alygnn listing</div>
      <span class="apply-link tap-hint">Tap to view full ad →</span>
    </div>
  `;

  setupDrag(card);
  return card;
}

function renderCards(){
  const stack=document.getElementById('card-stack');
  stack.innerHTML='';

  const remaining=jobs.slice(currentIndex,currentIndex+3);

  if(!remaining.length){
    document.getElementById('swipe-area').style.display='none';
    document.getElementById('empty-screen').style.display='flex';
    updateStats();
    return;
  }

  document.getElementById('swipe-area').style.display='flex';
  document.getElementById('empty-screen').style.display='none';

  remaining.forEach((job,i)=>{
    stack.appendChild(buildCard(job,currentIndex+i));
  });

  updateStats();
  setupTopCard();
}

function setupTopCard(){
  activeCard=document.querySelector('.job-card:first-child');
}

function setupDrag(card){
  card.addEventListener('pointerdown',dragStart,{passive:false});
}

function dragStart(e){
  setupTopCard();
  if(!activeCard||activeCard!==e.currentTarget)return;
  if(e.target.closest('button,.apply-link')){
    if(e.target.closest('.apply-link'))openJobDetails(activeCard.dataset.index);
    return;
  }

  e.preventDefault();
  isDragging=true;
  activePointerId=e.pointerId;
  startX=e.clientX;
  startY=e.clientY;
  currentX=0;
  dragDistance=0;

  activeCard.classList.add('is-dragging');
  activeCard.style.transition='none';

  try{activeCard.setPointerCapture(e.pointerId)}catch(_){}

  activeCard.addEventListener('pointermove',dragMove,{passive:false});
  activeCard.addEventListener('pointerup',dragEnd);
  activeCard.addEventListener('pointercancel',dragEnd);
}

function dragMove(e){
  if(!isDragging||!activeCard)return;
  if(activePointerId!==null&&e.pointerId!==activePointerId)return;

  e.preventDefault();

  currentX=e.clientX-startX;
  const currentY=e.clientY-startY;
  dragDistance=Math.hypot(currentX,currentY);
  const rotate=currentX*.08;

  activeCard.style.transform=`translate(${currentX}px,${currentY*.25}px) rotate(${rotate}deg)`;

  const applyStamp=activeCard.querySelector('.stamp-apply');
  const skipStamp=activeCard.querySelector('.stamp-skip');
  const ratio=Math.min(Math.abs(currentX)/80,1);

  if(currentX>20){
    applyStamp.style.opacity=ratio;
    skipStamp.style.opacity=0;
  }else if(currentX<-20){
    skipStamp.style.opacity=ratio;
    applyStamp.style.opacity=0;
  }else{
    applyStamp.style.opacity=0;
    skipStamp.style.opacity=0;
  }
}

function dragEnd(e){
  if(!isDragging||!activeCard)return;

  isDragging=false;
  activePointerId=null;

  activeCard.removeEventListener('pointermove',dragMove);
  activeCard.removeEventListener('pointerup',dragEnd);
  activeCard.removeEventListener('pointercancel',dragEnd);
  activeCard.classList.remove('is-dragging');

  const tapped=dragDistance<9&&Math.abs(currentX)<9;
  const tappedIndex=activeCard.dataset.index;

  if(currentX>70){
    animateSwipe('right');
  }else if(currentX<-70){
    animateSwipe('left');
  }else{
    activeCard.style.transition='transform .25s ease';
    activeCard.style.transform='';
    if(tapped)setTimeout(()=>openJobDetails(tappedIndex),40);
  }
}

async function createApplication(job){
  const {data:existing,error:checkError}=await sb
    .from('applications')
    .select('id')
    .eq('candidate_id',session.user.id)
    .eq('job_id',job.id)
    .maybeSingle();

  if(checkError)console.warn(checkError);
  if(existing)return true;

  const {error}=await sb.from('applications').insert({
    candidate_id:session.user.id,
    job_id:job.id,
    status:'applied',
    applied_at:new Date().toISOString(),
    match_score:job.match_score??null
  });

  if(error)throw error;
  return false;
}


async function recordPassedJob(job){
  if(!job?.id)return false;

  const {data:existing,error:checkError}=await sb
    .from('skipped_jobs')
    .select('job_id')
    .eq('candidate_id',session.user.id)
    .eq('job_id',job.id)
    .maybeSingle();

  if(checkError){
    console.warn('Could not check passed job:',checkError);
  }

  if(existing)return false;

  const {error}=await sb
    .from('skipped_jobs')
    .insert({
      candidate_id:session.user.id,
      job_id:job.id
    });

  if(error){
    // Duplicate-safe in case the table has a unique candidate/job constraint.
    if(error.code==='23505')return false;
    throw error;
  }

  return true;
}

async function removePassedJob(jobId){
  if(!jobId)return;

  const {error}=await sb
    .from('skipped_jobs')
    .delete()
    .eq('candidate_id',session.user.id)
    .eq('job_id',jobId);

  if(error)throw error;
}

async function removeApplicationForUndo(jobId){
  if(!jobId)return;

  const {error}=await sb
    .from('applications')
    .delete()
    .eq('candidate_id',session.user.id)
    .eq('job_id',jobId);

  if(error)throw error;
}

async function animateSwipe(direction){
  setupTopCard();
  if(!activeCard)return;

  const job=jobs[Number(activeCard.dataset.index)];
  activeCard.classList.add(direction==='right'?'swipe-right':'swipe-left');

  const historyEntry={
    job,
    direction,
    index:currentIndex,
    createdApplication:false,
    createdPassed:false
  };

  if(direction==='right'){
    try{
      const alreadyExists=await createApplication(job);
      historyEntry.createdApplication=!alreadyExists;
      applied++;
      showToast(alreadyExists?'Already applied':'Application submitted');
    }catch(error){
      console.error(error);
      showToast(error.message||'Could not apply');
    }
  }else{
    try{
      historyEntry.createdPassed=await recordPassedJob(job);
      skipped++;
      showToast('Passed · saved to My Jobs');
    }catch(error){
      console.error(error);
      skipped++;
      showToast('Passed');
    }
  }

  history.push(historyEntry);
  currentIndex++;

  setTimeout(renderCards,350);
}

function skipCurrent(){
  setupTopCard();
  if(activeCard)animateSwipe('left');
}

function applyCurrent(){
  setupTopCard();
  if(activeCard)animateSwipe('right');
}

async function undo(){
  if(!history.length){
    showToast('Nothing to undo');
    return;
  }

  const last=history.pop();

  try{
    if(last.direction==='right'){
      if(last.createdApplication){
        await removeApplicationForUndo(last.job?.id);
      }
      applied=Math.max(0,applied-1);
    }else{
      if(last.createdPassed){
        await removePassedJob(last.job?.id);
      }
      skipped=Math.max(0,skipped-1);
    }

    currentIndex=last.index;
    renderCards();
    showToast('Undone');
  }catch(error){
    console.error('Could not undo swipe:',error);
    history.push(last);
    showToast('Could not undo');
  }
}

function updateStats(){
  const remaining=Math.max(0,jobs.length-currentIndex);
  const position=jobs.length?Math.min(currentIndex+1,jobs.length):0;
  const completed=jobs.length?Math.min(currentIndex,jobs.length):0;
  const progress=jobs.length?(completed/jobs.length)*100:0;

  document.getElementById('stat-applied').textContent=applied;
  document.getElementById('stat-skipped').textContent=skipped;
  document.getElementById('stat-remaining').textContent=remaining;
  document.getElementById('job-progress-copy').textContent=`Job ${position} of ${jobs.length}`;
  document.getElementById('progress-fill').style.width=progress+'%';
}

function showToast(message){
  const toast=document.getElementById('toast');
  toast.textContent=message;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toast.classList.remove('show'),1800);
}

async function loadJobs(){
  const [
    jobsResult,
    applicationsResult,
    skippedResult
  ]=await Promise.all([
    sb
      .from('jobs')
      .select('*')
      .eq('status','active')
      .order('created_at',{ascending:false}),

    sb
      .from('applications')
      .select('job_id')
      .eq('candidate_id',session.user.id),

    sb
      .from('skipped_jobs')
      .select('job_id')
      .eq('candidate_id',session.user.id)
  ]);

  if(jobsResult.error){
    console.error(jobsResult.error);
    showToast(jobsResult.error.message||'Could not load jobs');
    jobs=[];
    renderCards();
    return;
  }

  const appliedIds=new Set(
    (applicationsResult.data||[])
      .map(row=>String(row.job_id||''))
      .filter(Boolean)
  );

  const skippedIds=skippedResult.error
    ?new Set()
    :new Set(
      (skippedResult.data||[])
        .map(row=>String(row.job_id||''))
        .filter(Boolean)
    );

  if(!applicationsResult.error){
    applied=appliedIds.size;
  }

  if(!skippedResult.error){
    skipped=skippedIds.size;
  }

  jobs=(jobsResult.data||[]).filter(job=>{
    const id=String(job.id||'');
    return id && !appliedIds.has(id) && !skippedIds.has(id);
  });

  currentIndex=0;
  history=[];
  renderCards();
}

document.getElementById('back-button').addEventListener('click',()=>{
  window.location.href='app-account.html';
});

document.getElementById('profile-button').addEventListener('click',()=>{
  window.location.href='app-account.html';
});

document.getElementById('undo-button').addEventListener('click',undo);
document.getElementById('skip-button').addEventListener('click',skipCurrent);
document.getElementById('apply-button').addEventListener('click',applyCurrent);

document.addEventListener('click',event=>{
  const saveButton=event.target.closest('.save-btn');
  if(saveButton){
    event.stopPropagation();
    saveButton.textContent=saveButton.textContent==='♡'?'♥':'♡';
    showToast(saveButton.textContent==='♥'?'Job saved':'Removed from saved');
    return;
  }

  const shareButton=event.target.closest('.share-btn');
  if(shareButton){
    event.stopPropagation();
    showToast('Share option coming next');
  }
});



document.getElementById('details-close').addEventListener('click',closeJobDetails);
document.getElementById('details-apply').addEventListener('click',applyFromDetails);
document.getElementById('details-save').addEventListener('click',event=>{
  const button=event.currentTarget;
  button.textContent=button.textContent==='♡'?'♥':'♡';
  showToast(button.textContent==='♥'?'Job saved':'Removed from saved');
});
document.getElementById('job-details-overlay').addEventListener('click',event=>{
  if(event.target===event.currentTarget)closeJobDetails();
});
document.getElementById('job-details-sheet').addEventListener('click',event=>event.stopPropagation());
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'&&document.getElementById('job-details-overlay').classList.contains('open'))closeJobDetails();
});

(async function initialize(){
  const {data,error}=await sb.auth.getSession();

  if(error||!data.session){
    window.location.replace('app-login.html');
    return;
  }

  session=data.session;

  const fullName=
    session.user.user_metadata?.full_name||
    session.user.user_metadata?.name||
    session.user.email?.split('@')[0]||
    'User';

  document.getElementById('profile-button').textContent=initials(fullName);

  const {count}=await sb
    .from('applications')
    .select('*',{count:'exact',head:true})
    .eq('candidate_id',session.user.id);

  applied=count||0;
  await loadJobs();
})();
</script>
