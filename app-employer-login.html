<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#F6F8F7"
>

<title>Employer Login | Alygnn</title>

<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
>

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
>

<link
  href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=DM+Serif+Display&display=swap"
  rel="stylesheet"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:'DM Sans',Arial,sans-serif!important;
}

:root{
  --brand:#5D7FA3;
  --sage:#8CB69B;
  --bg:#F6F8F7;
  --text:#172333;
  --muted:#59697A;
  --border:#DDE3E8;

  --accent:#3568C0;
  --accent-dark:#2857A8;
  --accent-bg:#EAF1FC;

  --danger:#B64040;
  --danger-bg:#FCEDED;

  --success:#18794E;
  --success-bg:#E8F6EE;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;

  background:
    radial-gradient(
      circle at 12% 8%,
      rgba(140,182,155,.13),
      transparent 28%
    ),
    radial-gradient(
      circle at 90% 84%,
      rgba(93,127,163,.13),
      transparent 31%
    ),
    var(--bg);

  color:var(--text);
}

button,
input,
a{
  font:inherit;
}

button{
  cursor:pointer;
}

.page{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:0 auto;

  padding:
    calc(18px + env(safe-area-inset-top))
    20px
    calc(28px + env(safe-area-inset-bottom));

  display:flex;
  flex-direction:column;
}

.topbar{
  min-height:51px;

  display:grid;
  grid-template-columns:48px 1fr 48px;
  align-items:center;
}

.back-btn{
  width:44px;
  height:44px;

  border:1px solid var(--border);
  border-radius:50%;

  background:#fff;
  color:var(--text);

  font-size:21px;

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:
    0 5px 16px
    rgba(23,35,51,.06);
}

.brand{
  text-align:center;

  font-family:
    'DM Serif Display',
    Georgia,
    serif!important;

  font-size:31px;
  color:var(--brand);
}

.brand span{
  color:var(--sage);
}

.login{
  flex:1;

  display:flex;
  flex-direction:column;
  justify-content:center;

  padding:24px 0 14px;
}

.identity{
  text-align:center;
}

.identity-icon{
  width:72px;
  height:72px;

  margin:0 auto;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  color:var(--accent);
  background:var(--accent-bg);
}

.identity-icon svg{
  width:35px;
  height:35px;
}

h1{
  margin-top:19px;

  font-size:30px;
  line-height:1.1;
  letter-spacing:-.55px;
  font-weight:900;
}

.subtitle{
  max-width:330px;

  margin:
    9px
    auto
    0;

  color:var(--muted);

  font-size:14px;
  line-height:1.5;
}

.form{
  margin-top:31px;
}

.field{
  margin-top:17px;
}

.field:first-child{
  margin-top:0;
}

.label-row{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:8px;
}

label{
  font-size:13px;
  font-weight:900;
}

.forgot{
  border:none;
  background:transparent;

  color:var(--accent-dark);

  font-size:12px;
  font-weight:900;
}

.input-wrap{
  min-height:56px;

  padding:0 15px;

  border:
    1px solid
    var(--border);

  border-radius:17px;

  background:
    rgba(
      255,
      255,
      255,
      .94
    );

  display:flex;
  align-items:center;
  gap:11px;
}

.input-wrap:focus-within{
  border-color:var(--accent);

  box-shadow:
    0 0 0 4px
    rgba(93,127,163,.1);
}

.field-icon{
  width:20px;
  height:20px;

  color:#7A8794;

  flex:0 0 20px;
}

input{
  width:100%;
  min-width:0;

  border:none;
  outline:none;

  background:transparent;
  color:var(--text);

  font-size:15px;
}

input::placeholder{
  color:#98A2AD;
}

.show-btn{
  border:none;
  background:transparent;

  color:var(--muted);

  font-size:12px;
  font-weight:900;
}

.message{
  display:none;

  margin-top:16px;

  padding:
    12px
    14px;

  border-radius:14px;

  font-size:12px;
  line-height:1.45;
  font-weight:700;
}

.message.error{
  display:block;

  color:var(--danger);
  background:var(--danger-bg);
}

.message.success{
  display:block;

  color:var(--success);
  background:var(--success-bg);
}

.primary{
  width:100%;
  min-height:56px;

  margin-top:22px;

  border:none;
  border-radius:17px;

  background:var(--accent);
  color:#fff;

  font-size:15px;
  font-weight:900;

  box-shadow:
    0 9px 24px
    rgba(52,95,145,.2);
}

.primary:disabled,
.social:disabled{
  opacity:.65;
}

.divider{
  margin:
    25px
    0
    15px;

  display:flex;
  align-items:center;
  gap:13px;

  color:#8995A1;

  font-size:11px;
  font-weight:800;

  text-transform:uppercase;
  letter-spacing:.7px;
}

.divider::before,
.divider::after{
  content:"";

  flex:1;

  height:1px;

  background:var(--border);
}

.social{
  width:100%;
  min-height:54px;

  margin-top:10px;

  border:
    1px solid
    var(--border);

  border-radius:17px;

  background:#fff;
  color:var(--text);

  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;

  font-size:14px;
  font-weight:900;
}

.social:first-of-type{
  margin-top:0;
}

.google-mark{
  width:22px;
  height:22px;

  border-radius:50%;

  display:grid;
  place-items:center;

  font-size:16px;
  font-weight:900;

  color:#4285F4;
}

.apple-mark{
  font-size:22px;
  line-height:1;
}

.signup{
  margin-top:25px;

  text-align:center;

  color:var(--muted);

  font-size:13px;
  line-height:1.6;
}

.signup a{
