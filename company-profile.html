<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Company profile — Alygnn</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --brand:#5D7FA3;
  --sage:#8CB69B;
  --bg:#F6F8F7;
  --card-bg:#FCFCFA;
  --text:#1A2530;
  --text-muted:#4A5968;
  --border:#DDE3E8;
  --mint:#6FBF8F;
  --rose:#D79A9A;
}

*,*::before,*::after{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  min-height:100%;
  background:var(--bg);
  color:var(--text);
}

body{
  padding-top:64px;
  font-family:'DM Sans',Arial,sans-serif;
}

nav{
  position:fixed;
  top:0;
  left:0;
  right:0;
  width:100%;
  height:64px;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 5%;
  background:rgba(246,248,247,.95);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}

.logo{
  font-family:'DM Serif Display',serif;
  font-size:22px;
  color:var(--brand);
  letter-spacing:-.5px;
  text-decoration:none;
}

.logo span{ color:var(--sage); }

.nav-back{
  color:var(--text-muted);
  text-decoration:none;
  font-size:14px;
}
.nav-back:hover{ color:var(--text); }

.loading,.error-state{
  max-width:880px;
  margin:0 auto;
  padding:64px 6%;
  color:var(--text-muted);
  font-size:14px;
}

.error-state{ display:none; }

.page{
  max-width:920px;
  margin:0 auto;
  padding:48px 5% 90px;
  opacity:0;
  transform:translateY(8px);
  transition:opacity .22s ease,transform .22s ease;
}
.page.ready{
  opacity:1;
  transform:translateY(0);
}

.company-card{
  overflow:hidden;
  margin-bottom:28px;
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:24px;
  box-shadow:0 12px 34px rgba(26,37,48,.055);
}

.company-accent{
  height:5px;
  background:linear-gradient(90deg,var(--brand),var(--sage));
}

.company-main{
  display:flex;
  align-items:flex-start;
  gap:22px;
  padding:30px 32px 24px;
}

.company-logo{
  width:92px;
  height:92px;
  flex:0 0 92px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border-radius:22px;
  border:1px solid var(--border);
  background:rgba(93,127,163,.10);
  color:var(--brand);
  font-family:'DM Serif Display',serif;
  font-size:30px;
}

.company-logo img{
  width:100%;
  height:100%;
  object-fit:contain;
  background:white;
}

.company-copy{
  min-width:0;
  flex:1;
}

.eyebrow{
  margin-bottom:7px;
  color:var(--brand);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.4px;
  text-transform:uppercase;
}

.company-title-row{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.company-name{
  font-family:'DM Serif Display',serif;
  font-size:34px;
  letter-spacing:-.7px;
  line-height:1.1;
}

.verified{
  display:none;
  align-items:center;
  gap:5px;
  padding:5px 10px;
  border-radius:100px;
  background:rgba(111,191,143,.14);
  color:#2d8a57;
  font-size:11px;
  font-weight:700;
}
.verified.show{ display:inline-flex; }

.company-about{
  max-width:700px;
  margin-top:12px;
  color:var(--text-muted);
  font-size:14px;
  line-height:1.65;
}

.company-links{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  padding:0 32px 28px;
}

.company-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:38px;
  padding:8px 14px;
  border:1px solid var(--border);
  border-radius:100px;
  background:white;
  color:var(--brand);
  text-decoration:none;
  font-size:12px;
  font-weight:500;
}
.company-link:hover{
  border-color:var(--brand);
  background:rgba(93,127,163,.05);
}
.company-link.website{
  border-color:rgba(93,127,163,.38);
  background:rgba(93,127,163,.08);
}

.section-heading{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:16px;
  margin-bottom:14px;
}

.section-heading h2{
  font-family:'DM Serif Display',serif;
  font-size:24px;
  letter-spacing:-.4px;
}

.job-count{
  color:var(--text-muted);
  font-size:12px;
}

.jobs{
  display:grid;
  gap:12px;
}

.job-row{
  display:flex;
  align-items:center;
  gap:18px;
  padding:18px 20px;
  border:1px solid var(--border);
  border-radius:16px;
  background:var(--card-bg);
}

.job-copy{
  min-width:0;
  flex:1;
}

.job-title{
  margin-bottom:5px;
  font-size:15px;
  font-weight:700;
  color:var(--text);
}

.job-meta{
  color:var(--text-muted);
  font-size:12px;
  line-height:1.5;
}

.job-badges{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:8px;
}

.badge{
  padding:4px 9px;
  border:1px solid var(--border);
  border-radius:100px;
  font-size:10px;
  color:var(--text-muted);
}

.badge.urgent{
  border-color:rgba(215,154,154,.55);
  background:rgba(215,154,154,.14);
  color:#9a5151;
  font-weight:700;
}

.badge.recommended{
  border-color:rgba(93,127,163,.35);
  background:rgba(93,127,163,.10);
  color:var(--brand);
  font-weight:700;
}

.view-job{
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:38px;
  padding:8px 14px;
  border:1px solid var(--border);
  border-radius:100px;
  background:white;
  color:var(--brand);
  text-decoration:none;
  font-size:12px;
  font-weight:500;
}

.view-job:hover{
  border-color:var(--brand);
  background:rgba(93,127,163,.05);
}

.empty-jobs{
  padding:30px;
  border:1px dashed var(--border);
  border-radius:16px;
  background:rgba(252,252,250,.55);
  color:var(--text-muted);
  text-align:center;
  font-size:13px;
}

.footer{
  padding:28px 5% 40px;
  text-align:center;
  color:var(--text-muted);
  font-size:12px;
}
.footer a{
  color:var(--text-muted);
  text-decoration:none;
}

@media(max-width:640px){
  .company-main{
    flex-direction:column;
    padding:24px;
  }
  .company-links{
    padding:0 24px 24px;
  }
  .company-name{
    font-size:30px;
  }
  .job-row{
    align-items:flex-start;
    flex-direction:column;
  }
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">Alygnn<span>.</span></a>
  <a href="swipe.html" class="nav-back" id="nav-back">← Back to jobs</a>
</nav>

<div class="loading" id="loading">Loading company profile...</div>
<div class="error-state" id="error-state">We couldn't load this company profile.</div>

<main class="page" id="page">
  <section class="company-card">
    <div class="company-accent"></div>

    <div class="company-main">
      <div class="company-logo" id="company-logo">CO</div>

      <div class="company-copy">
        <div class="eyebrow">Company profile</div>

        <div class="company-title-row">
          <h1 class="company-name" id="company-name">Company</h1>
          <span class="verified" id="verified-badge">✓ Verified business</span>
        </div>

        <p class="company-about" id="company-about" style="display:none;"></p>
      </div>
    </div>

    <div class="company-links" id="company-links"></div>
  </section>

  <section>
    <div class="section-heading">
      <h2>Open jobs</h2>
      <div class="job-count" id="job-count"></div>
    </div>

    <div class="jobs" id="jobs"></div>
  </section>
</main>

<footer class="footer">
  <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a>
</footer>

<script>
const SUPABASE_URL = 'https://auth.alygnn.com';
const SUPABASE_ANON_KEY = 'sb_publishable_3l8krRh6WCyvKfNumWDBDw_C6CKr7rG';

function alygnnAuthStorageKey(){
  let tabId = window.sessionStorage.getItem('alygnn_auth_tab_id');

  if(!tabId){
    tabId = (window.crypto && typeof window.crypto.randomUUID === 'function')
      ? window.crypto.randomUUID()
      : `${Date.now()}-${Math.random().toString(36).slice(2)}-${Math.random().toString(36).slice(2)}`;

    window.sessionStorage.setItem('alygnn_auth_tab_id', tabId);
  }

  return `alygnn-auth-${tabId}`;
}

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth:{
    storage:window.sessionStorage,
    storageKey:alygnnAuthStorageKey(),
    persistSession:true,
    autoRefreshToken:true,
    detectSessionInUrl:true
  }
});

function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

function escapeHtml(value){
  return String(value || '')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'",'&#039;');
}

function safeUrl(value){
  const cleaned = String(value || '').trim();
  if(!cleaned) return '';

  try{
    const url = new URL(cleaned);
    if(url.protocol !== 'https:') return '';
    return url.toString();
  }catch{
    return '';
  }
}

function getInitials(name){
  const parts = String(name || 'Company')
    .trim()
    .split(/\s+/)
    .filter(Boolean)
    .slice(0,2);

  return parts.map(part => part.charAt(0).toUpperCase()).join('') || 'CO';
}

function fmtSalary(min,max){
  const format = n => '$' + Number(n).toLocaleString();
  if(min && max) return `${format(min)} – ${format(max)}`;
  if(min) return `${format(min)}+`;
  if(max) return `Up to ${format(max)}`;
  return '';
}

function showError(message){
  document.getElementById('loading').style.display = 'none';
  const error = document.getElementById('error-state');
  error.textContent = message || "We couldn't load this company profile.";
  error.style.display = 'block';
}

function showPage(){
  document.getElementById('loading').style.display = 'none';
  document.getElementById('page').classList.add('ready');
}

function configureBackLink(){
  const back = document.getElementById('nav-back');
  const from = getParam('from');
  const jobId = getParam('job');

  if(from === 'job-details' && jobId){
    back.href = `job-details.html?job=${encodeURIComponent(jobId)}`;
    back.textContent = '← Back to job';
    return;
  }

  if(from === 'swipe'){
    back.href = 'swipe.html';
    back.textContent = '← Back to jobs';
    return;
  }

  back.href = 'account.html';
  back.textContent = '← Back to account';
}

function renderCompany(profile){
  const companyName = profile.company_name || 'Company';
  document.title = `${companyName} — Alygnn`;
  document.getElementById('company-name').textContent = companyName;

  const logo = document.getElementById('company-logo');
  const logoUrl = safeUrl(profile.company_logo_url);

  if(logoUrl){
    logo.innerHTML = '';
    const img = document.createElement('img');
    img.src = logoUrl;
    img.alt = `${companyName} logo`;
    img.onerror = () => {
      logo.innerHTML = '';
      logo.textContent = getInitials(companyName);
    };
    logo.appendChild(img);
  }else{
    logo.textContent = getInitials(companyName);
  }

  if(profile.employer_verified === true){
    document.getElementById('verified-badge').classList.add('show');
  }

  const about = String(profile.company_headline || '').trim();
  if(about){
    const aboutEl = document.getElementById('company-about');
    aboutEl.textContent = about;
    aboutEl.style.display = '';
  }

  const links = [
    { label:'Website', url:profile.company_website, cls:'website' },
    { label:'LinkedIn', url:profile.linkedin_url },
    { label:'Instagram', url:profile.instagram_url },
    { label:'Facebook', url:profile.facebook_url }
  ]
    .map(item => ({ ...item, url:safeUrl(item.url) }))
    .filter(item => item.url);

  document.getElementById('company-links').innerHTML = links.map(item =>
    `<a class="company-link ${item.cls || ''}" href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.label)} ↗</a>`
  ).join('');
}

function renderJobs(jobs){
  const wrap = document.getElementById('jobs');
  const count = document.getElementById('job-count');

  count.textContent = jobs.length === 1 ? '1 active job' : `${jobs.length} active jobs`;

  if(!jobs.length){
    wrap.innerHTML = '<div class="empty-jobs">This company does not have any active jobs on Alygnn right now.</div>';
    return;
  }

  wrap.innerHTML = jobs.map(job => {
    const salary = job.salary || fmtSalary(job.salary_min, job.salary_max);
    const meta = [job.job_type, job.work_style, job.location, salary].filter(Boolean).join(' · ');

    const badges = [
      job.alygnn_recommended === true ? '<span class="badge recommended">Alygnn Recommended</span>' : '',
      job.urgently_hiring === true ? '<span class="badge urgent">Urgently Hiring</span>' : ''
    ].filter(Boolean).join('');

    return `
      <article class="job-row">
        <div class="job-copy">
          <div class="job-title">${escapeHtml(job.title || 'Untitled role')}</div>
          <div class="job-meta">${escapeHtml(meta)}</div>
          ${badges ? `<div class="job-badges">${badges}</div>` : ''}
        </div>

        <a class="view-job" href="job-details.html?job=${encodeURIComponent(job.id)}">View job →</a>
      </article>
    `;
  }).join('');
}

async function init(){
  configureBackLink();

  const { data:{ session }, error:sessionError } = await sb.auth.getSession();
  if(sessionError || !session){
    window.location.href = 'login.html';
    return;
  }

  const employerId = getParam('employer');
  if(!employerId){
    showError('This company profile link is missing the employer.');
    return;
  }

  const [{ data:profileData, error:profileError }, { data:jobsData, error:jobsError }] = await Promise.all([
    sb.rpc('get_public_company_profile', { target_employer: employerId }),
    sb
      .from('jobs')
      .select('*')
      .eq('employer_id', employerId)
      .eq('status', 'active')
      .order('created_at', { ascending:false })
  ]);

  if(profileError){
    console.error('Could not load company profile:', profileError);
    showError('We could not load this company profile.');
    return;
  }

  const profile = Array.isArray(profileData) ? (profileData[0] || null) : (profileData || null);
  if(!profile){
    showError('This company profile is not available.');
    return;
  }

  if(jobsError){
    console.warn('Could not load company jobs:', jobsError);
  }

  renderCompany(profile);
  renderJobs(jobsData || []);
  showPage();
}

init();
</script>
</body>
</html>
