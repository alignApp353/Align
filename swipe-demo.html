<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Alygnn — Swipe Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --brand: #5D7FA3;
    --sage: #8CB69B;
    --bg: #F0F3F2;
    --card-bg: #FCFCFA;
    --text: #1A2530;
    --border: #DDE3E8;
    --mint: #6FBF8F;
    --rose: #D79A9A;
    --text-muted: #4A5968;
    --brand-light: rgba(93,127,163,0.08);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    overscroll-behavior: none;
  }

  /* NAV */
  nav {
    background: rgba(246,248,247,0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 5%;
    display: flex; align-items: center; justify-content: space-between;
    height: 64px; flex-shrink: 0; z-index: 10;
  }
  .logo { font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--brand); letter-spacing: -0.5px; text-decoration: none; }
  .logo span { color: var(--sage); }
  .nav-stats { display: flex; gap: 20px; }
  .stat { text-align: center; }
  .stat-val { font-size: 18px; font-weight: 500; color: var(--text); line-height: 1; }
  .stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
  .nav-back { font-size: 14px; color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
  .nav-back:hover { color: var(--text); }

  /* LOADING STATE */
  .loading-screen {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
  }
  .loading-spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--brand);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .loading-text { font-size: 16px; color: var(--text-muted); }
  .loading-sub { font-size: 13px; color: var(--text-muted); opacity: 0.7; }

  /* ERROR STATE */
  .error-screen {
    flex: 1; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    text-align: center; padding: 40px;
  }
  .error-icon { font-size: 40px; }
  .error-title { font-size: 18px; font-weight: 500; }
  .error-sub { font-size: 14px; color: var(--text-muted); max-width: 320px; line-height: 1.6; }
  .btn-retry {
    margin-top: 8px;
    background: var(--brand); color: white;
    border: none; border-radius: 100px;
    padding: 12px 28px; font-size: 14px; font-weight: 500;
    font-family: 'DM Sans', sans-serif; cursor: pointer;
  }
  .state-actions {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    margin-top: 8px;
  }
  .state-actions .btn-retry, .state-actions .btn-reload { margin-top: 0; }
  .btn-preferences {
    background: transparent; color: var(--brand);
    border: 1.5px solid var(--brand); border-radius: 100px;
    padding: 11px 24px; font-size: 14px; font-weight: 500;
    font-family: 'DM Sans', sans-serif; cursor: pointer; transition: all 0.2s;
  }
  .btn-preferences:hover { background: var(--brand-light); transform: translateY(-1px); }

  /* SWIPE AREA */
  .swipe-area {
    flex: 1; display: none;
    flex-direction: column; align-items: center;
    justify-content: center; padding: 20px;
    position: relative;
  }

  /* CARD STACK */
  .card-stack { position: relative; width: 100%; max-width: 480px; height: 520px; }

  .job-card {
    position: absolute; inset: 0;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 28px;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    -webkit-touch-callout: none;
    transform-origin: center bottom;
    transition: box-shadow 0.2s;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    display: flex; flex-direction: column;
  }
  .job-card:active { cursor: grabbing; }
  .job-card.is-dragging { transition: none; box-shadow: 0 16px 48px rgba(0,0,0,0.16); }
  .job-card.swipe-left { animation: swipeLeft 0.35s ease forwards; }
  .job-card.swipe-right { animation: swipeRight 0.35s ease forwards; }
  .action-buttons button:disabled { pointer-events: none; }

  /* Behind cards */
  .job-card:nth-child(2) { transform: scale(0.96) translateY(8px); z-index: 1; }
  .job-card:nth-child(3) { transform: scale(0.92) translateY(16px); z-index: 0; }
  .job-card:nth-child(n+4) { display: none; }
  .job-card:first-child { z-index: 2; }

  /* LIKE/NOPE overlays */
  .stamp {
    position: absolute; top: 28px;
    padding: 6px 16px; border-radius: 8px;
    font-size: 22px; font-weight: 700;
    letter-spacing: 2px; opacity: 0;
    border: 3px solid;
    pointer-events: none;
    transition: opacity 0.1s;
  }
  .stamp-apply { right: 28px; color: var(--mint); border-color: var(--mint); transform: rotate(12deg); }
  .stamp-skip  { left: 28px;  color: var(--rose); border-color: var(--rose); transform: rotate(-12deg); }

  /* CARD CONTENT */
  .card-top { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 18px; }
  .company-logo {
    width: 52px; height: 52px; border-radius: 12px;
    background: var(--brand-light);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 500; color: var(--brand); flex-shrink: 0; overflow: hidden;
    border: 1px solid var(--border);
    font-family: 'DM Serif Display', serif;
  }
  .card-top-text { flex: 1; min-width: 0; }
  .job-title { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--text); letter-spacing: -0.3px; line-height: 1.2; margin-bottom: 3px; }
  .company-name { font-size: 14px; color: var(--text-muted); }

  .card-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .pill {
    font-size: 11px; padding: 4px 10px; border-radius: 100px;
    border: 1px solid var(--border); color: var(--text-muted);
  }
  .pill.remote { background: rgba(111,191,143,0.1); color: #2e7a52; border-color: rgba(111,191,143,0.3); }
  .pill.salary { background: var(--brand-light); color: var(--brand); border-color: rgba(93,127,163,0.2); }
  .pill.urgent {
    background: rgba(215,154,154,0.14);
    color: #9a5151;
    border-color: rgba(215,154,154,0.55);
    font-weight: 700;
  }

  .pill.recommended {
    background: rgba(93,127,163,0.10);
    color: var(--brand);
    border-color: rgba(93,127,163,0.35);
    font-weight: 700;
  }

  .match-badge {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(111,191,143,0.15); color: #3a9463;
    font-size: 12px; font-weight: 500; padding: 4px 12px;
    border-radius: 100px; margin-bottom: 12px;
  }
  .match-badge.pending { background: var(--border); color: var(--text-muted); }

  .card-desc {
    font-size: 13px; color: var(--text-muted); line-height: 1.65; margin-bottom: 16px;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-highlights { margin-bottom: 16px; }
  .highlights-label { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
  .highlight-item { display: flex; align-items: flex-start; gap: 6px; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; line-height: 1.4; }
  .highlight-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--brand); margin-top: 5px; flex-shrink: 0; }

  .card-benefits { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .benefit-tag { font-size: 10px; padding: 3px 9px; border-radius: 100px; background: rgba(111,191,143,0.1); color: #2e7a52; }

  .card-bottom { display: flex; align-items: center; justify-content: space-between; padding-top: 14px; border-top: 1px solid var(--border); margin-top: auto; }
  .posted-time { font-size: 11px; color: var(--text-muted); }
  .view-details-link {
    font-size: 12px; font-weight: 500; color: var(--brand);
    text-decoration: none; background: var(--brand-light);
    padding: 5px 12px; border-radius: 100px; transition: opacity 0.2s;
  }
  .view-details-link:hover { opacity: 0.8; }

  /* ACTION BUTTONS */
  .action-buttons {
    display:flex;
    align-items:stretch;
    justify-content:center;
    gap:12px;
    margin-top:20px;
    width:min(100%, 520px);
    flex-wrap:wrap;
  }

  .btn-undo,
  .btn-skip,
  .btn-apply{
    border-radius:18px;
    min-height:72px;
    padding:12px 18px;
    cursor:pointer;
    transition:all .2s;
    font-family:'DM Sans', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .btn-undo{
    min-width:120px;
    background:var(--card-bg);
    border:1.5px solid var(--border);
    color:var(--text);
    box-shadow:0 6px 18px rgba(26,37,48,.08);
  }

  .btn-skip{
    min-width:150px;
    background:var(--card-bg);
    border:1.5px solid var(--border);
    color:var(--text);
    box-shadow:0 6px 18px rgba(26,37,48,.08);
  }

  .btn-apply{
    min-width:170px;
    background:var(--brand);
    border:1.5px solid var(--brand);
    box-shadow:0 8px 20px rgba(93,127,163,0.30);
  }

  .btn-undo:hover{
    border-color:var(--brand);
    transform:translateY(-1px);
  }

  .btn-skip:hover{
    border-color:var(--rose);
    color:#9a5151;
    transform:translateY(-1px);
  }

  .btn-apply:hover{
    transform:translateY(-1px);
    opacity:.92;
  }

  .action-btn-stack{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
  }

  .action-btn-icon{
    font-size:18px;
    line-height:1;
    font-weight:600;
  }

  .btn-apply .action-btn-icon{
    color:white;
  }

  .btn-undo .action-btn-icon,
  .btn-skip .action-btn-icon{
    color:var(--text);
  }

  .action-btn-label{
    font-size:16px;
    line-height:1.1;
    font-weight:700;
  }

  .btn-apply .action-btn-label{
    color:white;
  }

  .btn-undo .action-btn-label,
  .btn-skip .action-btn-label{
    color:var(--text);
  }

  .action-btn-sub{
    font-size:11px;
    line-height:1.15;
    font-weight:400;
  }

  .btn-apply .action-btn-sub{
    color:rgba(255,255,255,.88);
  }

  .btn-undo .action-btn-sub,
  .btn-skip .action-btn-sub{
    color:var(--text-muted);
  }

  .action-buttons button:disabled{
    pointer-events:none;
    opacity:.55;
  }

  @media (max-width:640px){
    .action-buttons{
      width:100%;
      gap:10px;
    }

    .btn-undo{ min-width:96px; }
    .btn-skip{ min-width:132px; }
    .btn-apply{ min-width:154px; }
  }

  /* EMPTY STATE */
  .empty-screen {
    flex: 1; display: none;
    flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; text-align: center; padding: 40px;
  }
  .empty-icon { font-size: 48px; }
  .empty-title { font-family: 'DM Serif Display', serif; font-size: 28px; color: var(--text); }
  .empty-sub { font-size: 15px; color: var(--text-muted); max-width: 300px; line-height: 1.6; }
  .btn-reload {
    margin-top: 8px; background: var(--brand); color: white;
    border: none; border-radius: 100px;
    padding: 14px 32px; font-size: 15px; font-weight: 500;
    font-family: 'DM Sans', sans-serif; cursor: pointer; transition: all 0.2s;
  }
  .btn-reload:hover { opacity: 0.88; transform: translateY(-1px); }

  /* TOAST */
  .toast {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--text); color: white;
    padding: 10px 20px; border-radius: 100px;
    font-size: 13px; font-weight: 500;
    transition: transform 0.3s ease; z-index: 100;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes swipeLeft {
    to { transform: translateX(-120%) rotate(-20deg); opacity: 0; }
  }
  @keyframes swipeRight {
    to { transform: translateX(120%) rotate(20deg); opacity: 0; }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .demo-nav-right { display:flex; align-items:center; gap:20px; }
  .demo-badge {
    font-size:12px; color:var(--text-muted); background:rgba(93,127,163,.07);
    border:1px solid rgba(93,127,163,.06); border-radius:100px;
    padding:5px 12px; white-space:nowrap;
  }
  @media (max-width:640px){
    .demo-badge{ display:none; }
    nav{ padding:0 4%; }
    .nav-stats{ gap:12px; }
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">Alygnn<span>.</span></a>
  <div class="nav-stats">
    <div class="stat"><div class="stat-val" id="stat-applied">0</div><div class="stat-label">Applied</div></div>
    <div class="stat"><div class="stat-val" id="stat-skipped">0</div><div class="stat-label">Skipped</div></div>
    <div class="stat"><div class="stat-val" id="stat-remaining">5</div><div class="stat-label">Left</div></div>
  </div>
  <div class="demo-nav-right">
    <span class="demo-badge">Demo · example data</span>
    <a href="demo.html" class="nav-back">← Back to Alygnn</a>
  </div>
</nav>

<div class="loading-screen" id="loading-screen" style="display:none;">
  <div class="loading-spinner"></div>
  <div class="loading-text">Loading demo jobs...</div>
</div>

<div class="error-screen" id="error-screen">
  <div class="error-icon">!</div>
  <div class="error-title">Couldn't load demo</div>
  <div class="error-sub" id="error-msg">Refresh the page and try again.</div>
</div>

<div class="swipe-area" id="swipe-area" style="display:flex;">
  <div class="card-stack" id="card-stack"></div>

  <div class="action-buttons">
    <button class="btn-undo" onclick="undo()" title="Undo">
      <span class="action-btn-stack">
        <span class="action-btn-icon">↩</span>
        <span class="action-btn-label">Undo</span>
        <span class="action-btn-sub">Bring it back</span>
      </span>
    </button>

    <button class="btn-skip" onclick="skipCurrent()" title="Pass">
      <span class="action-btn-stack">
        <span class="action-btn-icon">✕</span>
        <span class="action-btn-label">Pass</span>
        <span class="action-btn-sub">Skip this job</span>
      </span>
    </button>

    <button class="btn-apply" onclick="applyCurrent()" title="Apply now">
      <span class="action-btn-stack">
        <span class="action-btn-icon">✓</span>
        <span class="action-btn-label">Apply now</span>
        <span class="action-btn-sub">Send my application</span>
      </span>
    </button>
  </div>
</div>

<div class="empty-screen" id="empty-screen">
  <div class="empty-icon">✓</div>
  <div class="empty-title">You've seen them all!</div>
  <div class="empty-sub">That was the candidate swipe demo. Reset it to try the flow again.</div>
  <div class="state-actions">
    <button class="btn-reload" onclick="resetDemo()">Reset demo</button>
    <button class="btn-preferences" onclick="window.location.href='demo.html'">Back to demos</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const demoJobs = [{"id": "demo-designer", "title": "Senior Product Designer", "company": "Demo Co.", "location": "Remote", "job_type": "Full-time", "work_style": "Remote", "salary": "$145k\u2013$175k", "alygnn_recommended": true, "urgently_hiring": false, "match_score": 92, "description": "Lead end-to-end design for our core product, partnering closely with engineering and product to ship features used by thousands of customers.", "requirements": "5+ years of product design experience\nStrong portfolio in B2B SaaS\nProficiency in Figma and design systems", "benefits": "Health insurance\n401(k)\nFlexible PTO\nRemote work", "created_at": "2026-09-04T12:00:00Z"}, {"id": "demo-accountant", "title": "Accountant", "company": "NexEra", "location": "Raleigh, NC", "job_type": "Full-time", "work_style": "On-site", "salary": "$65k\u2013$82k", "alygnn_recommended": true, "urgently_hiring": true, "match_score": 88, "description": "Join a growing finance team and help maintain accurate records, support month-end close, reconcile accounts, and prepare reports for leadership.", "requirements": "Bachelor's degree\n2+ years of accounting experience\nStrong Excel skills", "benefits": "Medical\nDental\n401(k)\nPaid time off", "created_at": "2026-09-06T12:00:00Z"}, {"id": "demo-sdr", "title": "Sales Development Representative", "company": "LaunchWorks", "location": "Raleigh, NC", "job_type": "Full-time", "work_style": "On-site", "salary": "$55k\u2013$75k", "alygnn_recommended": true, "urgently_hiring": false, "match_score": 86, "description": "Join a fast-growing sales team helping local businesses find the right solutions while building strong communication and account-management skills.", "requirements": "Strong communication skills\nCompetitive and coachable mindset\nComfort speaking with business owners", "benefits": "Paid training\nPerformance bonuses\nCareer development", "created_at": "2026-09-03T12:00:00Z"}, {"id": "demo-product", "title": "Product Manager", "company": "Northline Labs", "location": "Remote", "job_type": "Full-time", "work_style": "Remote", "salary": "$105k\u2013$135k", "alygnn_recommended": false, "urgently_hiring": false, "match_score": 83, "description": "Own roadmap decisions, work closely with design and engineering, and help ship tools used by growing teams across the country.", "requirements": "3+ years in product management\nExperience with SaaS products\nExcellent cross-functional communication", "benefits": "Health insurance\nEquity\nRemote work\nFlexible PTO", "created_at": "2026-09-02T12:00:00Z"}, {"id": "demo-analyst", "title": "Data Analyst", "company": "BrightPath", "location": "Charlotte, NC", "job_type": "Full-time", "work_style": "Hybrid", "salary": "$75k\u2013$100k", "alygnn_recommended": false, "urgently_hiring": false, "match_score": 79, "description": "Analyze business data, build dashboards, and turn trends into clear recommendations for leadership and operations teams.", "requirements": "SQL proficiency\nExperience with BI tools\nStrong analytical communication", "benefits": "Medical\n401(k)\nHybrid schedule", "created_at": "2026-09-01T12:00:00Z"}];

let jobs = demoJobs.map(job => ({...job}));
let currentIndex = 0;
let applied = 0;
let skipped = 0;
let history = [];

let isDragging = false;
let startX = 0;
let startY = 0;
let currentX = 0;
let activeCard = null;
let activePointerId = null;
let swipeLocked = false;
let swipeFinishTimer = null;
let snapBackTimer = null;

function setSwipeControlsLocked(locked) {
  document.querySelectorAll('.btn-undo, .btn-skip, .btn-apply').forEach(btn => {
    btn.disabled = locked;
    btn.setAttribute('aria-disabled', locked ? 'true' : 'false');
  });
}

function resetSwipeInteractionState() {
  clearTimeout(swipeFinishTimer);
  clearTimeout(snapBackTimer);
  swipeFinishTimer = null;
  snapBackTimer = null;
  isDragging = false;
  activePointerId = null;
  currentX = 0;
  activeCard = null;
  swipeLocked = false;
  setSwipeControlsLocked(false);
}

function getInitials(name) {
  if (!name) return 'D';
  return name.trim().split(/\s+/).map(w => w[0]).join('').substring(0, 2).toUpperCase();
}

function escapeHtml(value) {
  return String(value || '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function timeAgo(dateString) {
  if (!dateString) return 'Demo listing';
  const then = new Date(dateString).getTime();
  const now = Date.now();
  const days = Math.max(0, Math.floor((now - then) / 86400000));
  if (days <= 0) return 'Today';
  if (days === 1) return 'Yesterday';
  if (days < 7) return days + ' days ago';
  return Math.floor(days / 7) + ' weeks ago';
}


function buildCard(job, index) {
  const card = document.createElement('div');
  card.className = 'job-card';
  card.dataset.index = index;

  const pillsHTML = [
    job.alygnn_recommended === true ? '<span class="pill recommended">Alygnn Recommended</span>' : '',
    job.urgently_hiring === true ? '<span class="pill urgent">Urgently Hiring</span>' : '',
    job.work_style === 'Remote' ? '<span class="pill remote">🌐 Remote</span>' : '',
    job.location ? `<span class="pill">📍 ${escapeHtml(job.location)}</span>` : '',
    job.job_type ? `<span class="pill">${escapeHtml(job.job_type)}</span>` : '',
    job.salary ? `<span class="pill salary">${escapeHtml(job.salary)}</span>` : '',
  ].filter(Boolean).join('');

  const requirements = (job.requirements || '').split('\n').map(r => r.trim()).filter(Boolean).slice(0, 4);
  const highlightsHTML = requirements.length
    ? `<div class="card-highlights">
        <div class="highlights-label">Requirements</div>
        ${requirements.map(r => `<div class="highlight-item"><div class="highlight-dot"></div>${escapeHtml(r)}</div>`).join('')}
      </div>`
    : '';

  const benefits = (job.benefits || '').split('\n').map(b => b.trim()).filter(Boolean).slice(0, 5);
  const benefitsHTML = benefits.length
    ? `<div class="card-benefits">${benefits.map(b => `<span class="benefit-tag">${escapeHtml(b)}</span>`).join('')}</div>`
    : '';

  card.innerHTML = `
    <div class="stamp stamp-apply">APPLIED ✓</div>
    <div class="stamp stamp-skip">PASSED ✕</div>
    <div class="card-top">
      <div class="company-logo">${getInitials(job.company)}</div>
      <div class="card-top-text">
        <div class="job-title">${escapeHtml(job.title)}</div>
        <div class="company-name">${escapeHtml(job.company)}</div>
      </div>
    </div>

    <div class="match-badge">✦ ${Number(job.match_score || 0)}% match</div>

    <div class="card-pills">${pillsHTML}</div>
    <div class="card-desc">${escapeHtml(job.description)}</div>
    ${highlightsHTML}
    ${benefitsHTML}

    <div class="card-bottom">
      <div class="posted-time">${timeAgo(job.created_at)}</div>
      <span class="view-details-link" aria-disabled="true" style="cursor:default;pointer-events:none;user-select:none;">Demo preview</span>
    </div>
  `;

  setupDrag(card);
  return card;
}

function renderCards() {
  const stack = document.getElementById('card-stack');
  resetSwipeInteractionState();
  stack.innerHTML = '';

  const remaining = jobs.slice(currentIndex, currentIndex + 3);
  if (!remaining.length) {
    showScreen('empty');
    updateStats();
    return;
  }

  remaining.forEach((job, i) => {
    stack.appendChild(buildCard(job, currentIndex + i));
  });

  updateStats();
  setupTopCard();
  showScreen('swipe');
}

function showScreen(name) {
  document.getElementById('loading-screen').style.display = name === 'loading' ? 'flex' : 'none';
  document.getElementById('error-screen').style.display = name === 'error' ? 'flex' : 'none';
  document.getElementById('swipe-area').style.display = name === 'swipe' ? 'flex' : 'none';
  document.getElementById('empty-screen').style.display = name === 'empty' ? 'flex' : 'none';
}

function setupTopCard() {
  const stack = document.getElementById('card-stack');
  activeCard = stack.querySelector('.job-card:first-child');
}

function setupDrag(card) {
  card.addEventListener('pointerdown', dragStart, {passive:false});
}

function dragStart(e) {
  if (e.target.closest('a,button')) return;
  setupTopCard();
  if (!activeCard || activeCard !== e.currentTarget || swipeLocked) return;

  e.preventDefault();
  isDragging = true;
  activePointerId = e.pointerId;
  startX = e.clientX;
  startY = e.clientY;
  currentX = 0;

  activeCard.classList.add('is-dragging');
  try { activeCard.setPointerCapture(e.pointerId); } catch (_) {}

  activeCard.addEventListener('pointermove', dragMove, {passive:false});
  activeCard.addEventListener('pointerup', dragEnd);
  activeCard.addEventListener('pointercancel', dragEnd);
}

function dragMove(e) {
  if (!isDragging || !activeCard) return;
  if (activePointerId !== null && e.pointerId !== activePointerId) return;

  e.preventDefault();
  currentX = e.clientX - startX;
  const currentY = e.clientY - startY;
  const rotate = currentX * 0.06;

  activeCard.style.transform = `translate(${currentX}px, ${currentY * .18}px) rotate(${rotate}deg)`;

  const applyStamp = activeCard.querySelector('.stamp-apply');
  const skipStamp = activeCard.querySelector('.stamp-skip');
  const ratio = Math.min(Math.abs(currentX) / 100, 1);

  if (currentX > 20) {
    applyStamp.style.opacity = ratio;
    skipStamp.style.opacity = 0;
  } else if (currentX < -20) {
    skipStamp.style.opacity = ratio;
    applyStamp.style.opacity = 0;
  } else {
    applyStamp.style.opacity = 0;
    skipStamp.style.opacity = 0;
  }
}

function detachDragListeners(card) {
  if (!card) return;
  card.removeEventListener('pointermove', dragMove);
  card.removeEventListener('pointerup', dragEnd);
  card.removeEventListener('pointercancel', dragEnd);
}

function dragEnd(e) {
  if (!isDragging || !activeCard) return;
  if (activePointerId !== null && e.pointerId !== activePointerId) return;

  const card = activeCard;
  detachDragListeners(card);
  card.classList.remove('is-dragging');
  isDragging = false;
  activePointerId = null;

  if (currentX > 80) {
    animateSwipe('right');
  } else if (currentX < -80) {
    animateSwipe('left');
  } else {
    card.style.transition = 'transform .25s ease';
    card.style.transform = '';
    const a = card.querySelector('.stamp-apply');
    const s = card.querySelector('.stamp-skip');
    if (a) a.style.opacity = 0;
    if (s) s.style.opacity = 0;
    snapBackTimer = setTimeout(() => {
      if (card) card.style.transition = '';
      snapBackTimer = null;
    }, 260);
  }
  currentX = 0;
}

function animateSwipe(direction) {
  if (swipeLocked) return;
  setupTopCard();
  if (!activeCard) return;

  const cardToSwipe = activeCard;
  const jobIndex = Number.parseInt(cardToSwipe.dataset.index, 10);
  const job = jobs[jobIndex];
  if (!job) return;

  swipeLocked = true;
  setSwipeControlsLocked(true);
  detachDragListeners(cardToSwipe);
  isDragging = false;
  activePointerId = null;
  currentX = 0;
  cardToSwipe.style.transition = '';
  cardToSwipe.style.pointerEvents = 'none';

  const historyIndex = currentIndex;
  cardToSwipe.classList.add(direction === 'right' ? 'swipe-right' : 'swipe-left');
  history.push({ job, direction, index: historyIndex });

  if (direction === 'right') {
    applied++;
    showToast('✓ Added to applications!');
  } else {
    skipped++;
    showToast('Passed');
  }

  currentIndex = historyIndex + 1;
  updateStats();

  let finished = false;
  const finishSwipe = () => {
    if (finished) return;
    finished = true;
    clearTimeout(swipeFinishTimer);
    swipeFinishTimer = null;
    renderCards();
  };

  cardToSwipe.addEventListener('animationend', finishSwipe, {once:true});
  swipeFinishTimer = setTimeout(finishSwipe, 500);
}

function skipCurrent() {
  if (swipeLocked || isDragging) return;
  animateSwipe('left');
}

function applyCurrent() {
  if (swipeLocked || isDragging) return;
  animateSwipe('right');
}

function undo() {
  if (swipeLocked || isDragging) return;

  if (!history.length) {
    showToast('Nothing to undo');
    return;
  }

  const last = history.pop();
  if (last.direction === 'right') applied = Math.max(0, applied - 1);
  else skipped = Math.max(0, skipped - 1);

  currentIndex = last.index;
  renderCards();
  showToast('↩ Undone');
}

function updateStats() {
  document.getElementById('stat-applied').textContent = applied;
  document.getElementById('stat-skipped').textContent = skipped;
  document.getElementById('stat-remaining').textContent = Math.max(0, jobs.length - currentIndex);
}

function resetDemo() {
  jobs = demoJobs.map(job => ({...job}));
  currentIndex = 0;
  applied = 0;
  skipped = 0;
  history = [];
  renderCards();
  showToast('Demo reset');
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

document.addEventListener('keydown', e => {
  if (e.repeat || swipeLocked || isDragging) return;
  if (e.key === 'ArrowLeft') skipCurrent();
  if (e.key === 'ArrowRight') applyCurrent();
  if (e.key === 'z' && (e.metaKey || e.ctrlKey)) undo();
});

renderCards();
</script>
</body>
</html>
