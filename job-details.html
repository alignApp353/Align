<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Job details — Alygnn</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --brand:#5D7FA3;
  --sage:#8CB69B;
  --bg:#F6F8F7;
  --card-bg:#FCFCFA;
  --text:#1A2530;
  --text-muted:#4A5968;
  --border:#DDE3E8;
}

*, *::before, *::after{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:'DM Sans', Arial, sans-serif !important;
}

html, body{
  min-height:100%;
  background:var(--bg);
  color:var(--text);
}

nav{
  position:sticky;
  top:0;
  z-index:100;
  height:64px;
  padding:0 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(246,248,247,.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}

.logo{
  font-family:'DM Serif Display', serif !important;
  font-size:22px;
  color:var(--brand);
  letter-spacing:-.5px;
  text-decoration:none;
}
.logo span{ font-family:'DM Serif Display', serif !important; color:var(--sage); }

.nav-back{
  color:var(--text-muted);
  text-decoration:none;
  font-size:14px;
}
.nav-back:hover{ color:var(--text); }

.page{
  max-width:720px;
  margin:0 auto;
  padding:48px 6% 100px;
  opacity:0;
  transform:translateY(8px);
  transition:opacity .25s ease, transform .25s ease;
}
.page.ready{ opacity:1; transform:translateY(0); }

.loading, .error-state{
  max-width:720px;
  margin:0 auto;
  padding:56px 6%;
  color:var(--text-muted);
  font-size:14px;
}
.loading.hide, .error-state.hide{ display:none; }

.job-header{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:20px;
  padding:32px;
  margin-bottom:24px;
}

.job-title{
  font-family:'DM Serif Display', serif !important;
  font-size:1.75rem;
  letter-spacing:-.5px;
  margin-bottom:8px;
  color:var(--text);
}

.job-meta{
  font-size:14px;
  color:var(--text-muted);
  margin-bottom:18px;
}

.job-badges{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
}

.badge{
  font-size:12px;
  font-weight:500;
  padding:5px 14px;
  border-radius:100px;
  border:1px solid var(--border);
  color:var(--text-muted);
  white-space:nowrap;
}
.badge.status-accepted{ border-color:var(--sage); color:#2d8a57; background:rgba(140,182,155,.12); }
.badge.status-rejected{ border-color:#D79A9A; color:#a05858; background:rgba(215,154,154,.12); }
.badge.status-applied{ border-color:var(--brand); color:var(--brand); background:rgba(93,127,163,.08); }
.badge.plain{ background:white; }

.applied-note{
  font-size:13px;
  color:var(--text-muted);
  margin-top:14px;
}

.section{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:16px;
  padding:24px 28px;
  margin-bottom:16px;
}

.section h2{
  font-family:'DM Serif Display', serif !important;
  font-size:1.05rem;
  letter-spacing:-.2px;
  margin-bottom:12px;
  color:var(--text);
}

.section p, .section li{
  font-size:14px;
  line-height:1.65;
  color:var(--text);
  white-space:pre-wrap;
}

.section ul{
  margin-left:18px;
}

.field-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.field-grid .field-label{
  font-size:12px;
  font-weight:500;
  color:var(--text-muted);
  margin-bottom:4px;
}

.field-grid .field-value{
  font-size:14px;
  color:var(--text);
}

@media(max-width:600px){
  .field-grid{ grid-template-columns:1fr; }
}
</style>
</head>

<body>

<nav>
  <a href="index.html" class="logo">Alygnn<span>.</span></a>
  <a href="account.html" class="nav-back">← Back to account</a>
</nav>

<div class="loading" id="loading">Loading job details...</div>
<div class="error-state hide" id="error-state">We couldn't find that job. It may have been removed.</div>

<div class="page" id="page">

  <div class="job-header">
    <div class="job-title" id="job-title">—</div>
    <div class="job-meta" id="job-meta">—</div>
    <div class="job-badges" id="job-badges"></div>
    <div class="applied-note" id="applied-note"></div>
  </div>

  <div class="section" id="interview-section" style="display:none;">
    <h2>Interview scheduled</h2>
    <div class="field-grid" id="interview-field-grid"></div>
    <p id="interview-notes" style="margin-top:12px;"></p>
  </div>

  <div class="section" id="description-section" style="display:none;">
    <h2>Description</h2>
    <p id="job-description"></p>
  </div>

  <div class="section" id="requirements-section" style="display:none;">
    <h2>Requirements</h2>
    <div id="job-requirements"></div>
  </div>

  <div class="section" id="benefits-section" style="display:none;">
    <h2>Benefits</h2>
    <div id="job-benefits"></div>
  </div>

  <div class="section" id="details-section" style="display:none;">
    <h2>Details</h2>
    <div class="field-grid" id="job-field-grid"></div>
  </div>

</div>

<script>
const SUPABASE_URL = 'https://auth.alygnn.com';
const SUPABASE_ANON_KEY = 'sb_publishable_3l8krRh6WCyvKfNumWDBDw_C6CKr7rG';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const loadingEl = document.getElementById('loading');
const errorEl = document.getElementById('error-state');
const pageEl = document.getElementById('page');

function escapeHtml(value){
  return String(value || '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function showError(){
  loadingEl.classList.add('hide');
  errorEl.classList.remove('hide');
}

function showPage(){
  loadingEl.classList.add('hide');
  pageEl.classList.add('ready');
}

function fmtDate(value){
  if(!value) return '';
  const d = new Date(value);
  if(isNaN(d.getTime())) return '';
  return d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
}

function fmtDateTime(value){
  if(!value) return '';
  const d = new Date(value);
  if(isNaN(d.getTime())) return '';
  return d.toLocaleString(undefined, {
    weekday: 'long', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit'
  });
}

function fmtSalary(min, max){
  const fmt = (n) => '$' + Number(n).toLocaleString();
  if(min && max) return `${fmt(min)} – ${fmt(max)}`;
  if(min) return `${fmt(min)}+`;
  if(max) return `Up to ${fmt(max)}`;
  return '';
}

// Renders a value that might be a JSON array, a newline-separated string,
// or a comma-separated string, as a bullet list. Falls back to a plain
// paragraph if it's just one short line.
function renderListOrText(value){
  let items = null;

  if(Array.isArray(value)){
    items = value;
  } else if(typeof value === 'string'){
    const trimmed = value.trim();
    if(trimmed.startsWith('[')){
      try{ items = JSON.parse(trimmed); } catch(e){ items = null; }
    }
    if(!items && trimmed.includes('\n')){
      items = trimmed.split('\n').map(s => s.trim()).filter(Boolean);
    }
  }

  if(Array.isArray(items) && items.length > 1){
    return '<ul>' + items.map(i => `<li>${escapeHtml(i)}</li>`).join('') + '</ul>';
  }
  if(Array.isArray(items) && items.length === 1){
    return `<p>${escapeHtml(items[0])}</p>`;
  }
  return `<p>${escapeHtml(value)}</p>`;
}

function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

async function loadApplicationInfo(jobId, appId, candidateId){
  // Prefer the specific application row (passed in from account.html) so
  // this is correct even if someone applied to the same job more than once
  // historically; fall back to the most recent application for this job if
  // no app id was given (e.g. someone lands here with just a job id).
  if(appId){
    const { data, error } = await sb
      .from('applications')
      .select('id, status, applied_at')
      .eq('id', appId)
      .eq('candidate_id', candidateId)
      .maybeSingle();
    if(!error && data) return data;
  }

  const { data, error } = await sb
    .from('applications')
    .select('id, status, applied_at')
    .eq('job_id', jobId)
    .eq('candidate_id', candidateId)
    .order('applied_at', { ascending: false })
    .limit(1)
    .maybeSingle();

  return (!error && data) ? data : null;
}

// Requires the "Candidates view their own interviews" RLS policy on the
// interviews table. Looked up by job_id + candidate_id rather than
// application_id, since a candidate arriving here from my-interviews.html
// only has the job id in the URL, not the application id.
async function loadInterviewInfo(jobId, candidateId){
  const { data, error } = await sb
    .from('interviews')
    .select('scheduled_at, location_or_link, video_link, notes')
    .eq('job_id', jobId)
    .eq('candidate_id', candidateId)
    .maybeSingle();

  return (!error && data) ? data : null;
}

// Known job-table fields we know how to present nicely, in display order.
// Fields not in this list (e.g. internal ids, employer_id, view counters)
// are simply skipped rather than dumped raw onto the page.
const DETAIL_FIELD_MAP = [
  { key: 'job_type', label: 'Job type' },
  { key: 'work_style', label: 'Work style' },
  { key: 'remote_type', label: 'Work style' },
  { key: 'experience_level', label: 'Experience level' },
  { key: 'department', label: 'Department' },
  { key: 'industry', label: 'Industry' },
];

function renderJob(job, appInfo, interviewInfo){
  document.title = `${job.title || 'Job'} — Alygnn`;

  document.getElementById('job-title').textContent = job.title || 'Untitled role';

  const metaParts = [job.company, job.location].filter(Boolean).join(' · ');
  document.getElementById('job-meta').textContent = metaParts || '';

  // Badges: job type + salary range (if present) as plain info badges.
  const badgesEl = document.getElementById('job-badges');
  const badges = [];
  if(job.job_type) badges.push({ text: job.job_type, cls: 'plain' });
  const salaryText = fmtSalary(job.salary_min, job.salary_max);
  if(salaryText) badges.push({ text: salaryText, cls: 'plain' });

  if(appInfo){
    const statusCls = appInfo.status === 'accepted' ? 'status-accepted'
      : appInfo.status === 'rejected' ? 'status-rejected' : 'status-applied';
    const statusLabel = appInfo.status === 'accepted' ? 'Accepted'
      : appInfo.status === 'rejected' ? 'Not selected' : 'Applied';
    badges.push({ text: statusLabel, cls: statusCls });
  }

  badgesEl.innerHTML = badges.map(b => `<span class="badge ${b.cls}">${escapeHtml(b.text)}</span>`).join('');

  const appliedNoteEl = document.getElementById('applied-note');
  if(appInfo?.applied_at){
    appliedNoteEl.textContent = `You applied on ${fmtDate(appInfo.applied_at)}`;
  }

  if(interviewInfo){
    document.getElementById('interview-section').style.display = '';

    const ivGridEl = document.getElementById('interview-field-grid');
    const ivFields = [
      { label: 'Date & time', value: fmtDateTime(interviewInfo.scheduled_at) },
      interviewInfo.location_or_link ? { label: 'Location', value: interviewInfo.location_or_link } : null,
      interviewInfo.video_link ? { label: 'Video link', value: interviewInfo.video_link, isLink: true } : null,
    ].filter(Boolean);

    ivGridEl.innerHTML = ivFields.map(f => `
      <div>
        <div class="field-label">${escapeHtml(f.label)}</div>
        <div class="field-value">${f.isLink
          ? `<a href="${escapeHtml(f.value)}" target="_blank" rel="noopener" style="color:var(--brand);">${escapeHtml(f.value)}</a>`
          : escapeHtml(f.value)}</div>
      </div>
    `).join('');

    const notesEl = document.getElementById('interview-notes');
    if(interviewInfo.notes){
      notesEl.textContent = interviewInfo.notes;
      notesEl.style.display = '';
    } else {
      notesEl.style.display = 'none';
    }
  }

  if(job.description){
    document.getElementById('description-section').style.display = '';
    document.getElementById('job-description').textContent = job.description;
  }

  if(job.requirements){
    document.getElementById('requirements-section').style.display = '';
    document.getElementById('job-requirements').innerHTML = renderListOrText(job.requirements);
  }

  if(job.benefits){
    document.getElementById('benefits-section').style.display = '';
    document.getElementById('job-benefits').innerHTML = renderListOrText(job.benefits);
  }

  const gridEl = document.getElementById('job-field-grid');
  const seenLabels = new Set();
  const gridHtml = DETAIL_FIELD_MAP
    .filter(f => job[f.key] && !seenLabels.has(f.label) && seenLabels.add(f.label))
    .map(f => `
      <div>
        <div class="field-label">${escapeHtml(f.label)}</div>
        <div class="field-value">${escapeHtml(job[f.key])}</div>
      </div>
    `).join('');

  if(gridHtml){
    document.getElementById('details-section').style.display = '';
    gridEl.innerHTML = gridHtml;
  }
}

async function initJobDetailsPage(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){
    window.location.href = 'login.html';
    return;
  }

  const jobId = getParam('job');
  const appId = getParam('app');

  if(!jobId){
    showError();
    return;
  }

  const { data: job, error: jobError } = await sb
    .from('jobs')
    .select('*')
    .eq('id', jobId)
    .maybeSingle();

  if(jobError || !job){
    console.error('Failed to load job:', jobError);
    showError();
    return;
  }

  const appInfo = await loadApplicationInfo(jobId, appId, session.user.id);
  const interviewInfo = await loadInterviewInfo(jobId, session.user.id);

  renderJob(job, appInfo, interviewInfo);
  showPage();
}

initJobDetailsPage();
</script>

</body>
</html>
