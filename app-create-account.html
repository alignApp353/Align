<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - Alygnn</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap');

:root{
    --brand: #5D7FA3;
    --sage: #8CB69B;
    --bg: #F6F8F7;
    --card-bg: #FCFCFA;
    --text: #1A2530;
    --border: #DDE3E8;
    --mint: #6FBF8F;
    --rose: #D79A9A;
    --text-muted: #4A5968;
}

body{
    margin:0;
    font-family:'DM Sans', sans-serif;
    background:var(--bg);
    color:var(--text);
}

.screen{
    min-height:100vh;
    max-width:500px;
    margin:auto;
    padding:40px 24px;
    display:flex;
    flex-direction:column;
}

.logo{
    font-size:44px;
    font-weight:800;
    color:var(--brand);
    margin-top:30px;
    letter-spacing:-1px;
}

.subtitle{
    font-size:18px;
    color:var(--text-muted);
    line-height:1.6;
    margin-top:12px;
    margin-bottom:36px;
}

.input{
    width:100%;
    box-sizing:border-box;
    padding:18px;
    margin-bottom:16px;
    border-radius:18px;
    border:1px solid var(--border);
    background:var(--card-bg);
    font-size:16px;
    font-family:'DM Sans', sans-serif;
    color:var(--text);
}

.input:focus{
    outline:none;
    border-color:var(--brand);
}

.forgot{
    text-align:right;
    margin-bottom:12px;
}

.forgot a{
    color:var(--brand);
    text-decoration:none;
    font-weight:600;
}

.btn{
    width:100%;
    padding:18px;
    border:none;
    border-radius:20px;
    font-size:17px;
    font-weight:700;
    font-family:'DM Sans', sans-serif;
    cursor:pointer;
    transition:.2s;
    margin-top:10px;
}

.primary{
    background:var(--brand);
    color:white;
}

.primary:hover{
    opacity:.95;
}

.google{
    background:var(--card-bg);
    border:1px solid var(--border);
    color:var(--text);
}

.divider{
    display:flex;
    align-items:center;
    gap:12px;
    margin:28px 0 12px;
    color:var(--text-muted);
}

.divider::before,
.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--border);
}

.link{
    text-align:center;
    margin-top:24px;
    color:var(--brand);
    font-weight:700;
    cursor:pointer;
}

.small{
    margin-top:auto;
    padding-top:30px;
    text-align:center;
    color:var(--text-muted);
    font-size:13px;
    line-height:1.6;
}

.verify-card{display:none;margin-top:8px;padding:22px;border:1px solid var(--border);border-radius:22px;background:var(--card-bg)}
.verify-card.show{display:block}
.verify-title{font-size:24px;font-weight:800;margin-bottom:8px}
.verify-copy{color:var(--text-muted);font-size:14px;line-height:1.55;margin-bottom:18px}
.verify-email{color:var(--text);font-weight:700}
.verify-code{text-align:center;font-size:24px;letter-spacing:5px;font-weight:800}
.secondary{background:transparent;color:var(--brand);border:1px solid var(--border)}
.message{display:none;margin-top:14px;padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.45;font-weight:700}
.message.show{display:block}
.message.error{color:#A53E3E;background:#FCEDED}
.message.success{color:#18794E;background:#E8F6EE}
.form-hidden{display:none!important}

</style>
</head>

<body>

<div class="screen">

    <div class="logo">Alygnn</div>
    <div class="subtitle">
        Create your account and start finding jobs.
    </div>

    <div id="signup-fields">
        <input id="firstName" class="input" placeholder="First Name" autocomplete="given-name">
        <input id="lastName" class="input" placeholder="Last Name" autocomplete="family-name">
        <input id="email" class="input" type="email" placeholder="Email" autocomplete="email" inputmode="email">
        <input id="password" class="input" type="password" placeholder="Password" autocomplete="new-password">

        <button id="create-account-btn" class="btn primary" onclick="signup()">Create Account</button>

        <div class="divider">or</div>

        <button class="btn google" onclick="googleSignup()">Continue with Google</button>

        <div class="link" onclick="location.href='app-login.html'">Already have an account? Sign In</div>

        <div class="small">By continuing, you agree to Alygnn's Terms and Privacy Policy.</div>
    </div>

    <div id="verify-card" class="verify-card">
        <div class="verify-title">Check your email</div>
        <div class="verify-copy">
            We sent a verification code to <span id="verify-email" class="verify-email"></span>.
            Enter the code here to confirm your email. The email does not send you to the Alygnn website.
        </div>

        <input id="verification-code" class="input verify-code" type="text"
               inputmode="numeric" autocomplete="one-time-code"
               placeholder="Code" maxlength="8">

        <button id="verify-btn" class="btn primary" onclick="verifyEmailCode()">Verify email</button>
        <button id="resend-btn" class="btn secondary" onclick="resendVerificationCode()">Resend code</button>

        <div id="verify-message" class="message" aria-live="polite"></div>
    </div>

</div>

<script>

const SUPABASE_URL = "https://auth.alygnn.com";
const SUPABASE_KEY = "sb_publishable_3l8krRh6WCyvKfNumWDBDw_C6CKr7rG";

const sb = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let pendingSignupEmail = "";

function setVerifyMessage(text, type){
    const box = document.getElementById("verify-message");
    box.textContent = text;
    box.className = "message show " + type;
}

function showVerificationStep(email){
    pendingSignupEmail = String(email || "").trim().toLowerCase();
    document.getElementById("signup-fields").classList.add("form-hidden");
    document.getElementById("verify-card").classList.add("show");
    document.getElementById("verify-email").textContent = pendingSignupEmail;
    document.getElementById("verification-code").focus();
}

async function signup(){
    const firstName = document.getElementById("firstName").value.trim();
    const lastName = document.getElementById("lastName").value.trim();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const button = document.getElementById("create-account-btn");

    if(!firstName || !lastName || !email || !password){
        alert("Please complete all fields.");
        return;
    }

    if(password.length < 8){
        alert("Password must be at least 8 characters.");
        return;
    }

    button.disabled = true;
    button.textContent = "Creating Account...";

    const { data, error } = await sb.auth.signUp({
        email,
        password,
        options:{
            data:{
                first_name:firstName,
                last_name:lastName,
                EmailFlow:"app"
            }
        }
    });

    button.disabled = false;
    button.textContent = "Create Account";

    if(error){
        alert(error.message);
        return;
    }

    if(data?.session){
        window.location.href = "align-upload.html";
        return;
    }

    showVerificationStep(email);
}

async function verifyEmailCode(){
    const token = document.getElementById("verification-code").value.replace(/\s+/g, "").trim();
    const button = document.getElementById("verify-btn");

    if(!pendingSignupEmail){
        setVerifyMessage("Please create your account again.", "error");
        return;
    }

    if(token.length < 6){
        setVerifyMessage("Enter the verification code from your email.", "error");
        return;
    }

    button.disabled = true;
    button.textContent = "Verifying...";

    const { data, error } = await sb.auth.verifyOtp({
        email: pendingSignupEmail,
        token,
        type: "email"
    });

    button.disabled = false;
    button.textContent = "Verify email";

    if(error){
        setVerifyMessage("That code is invalid or expired. Check the email and try again.", "error");
        return;
    }

    setVerifyMessage("Email confirmed. Continuing...", "success");

    setTimeout(() => {
        window.location.href = data?.session ? "align-upload.html" : "app-login.html";
    }, 600);
}

async function resendVerificationCode(){
    if(!pendingSignupEmail){
        setVerifyMessage("Please create your account again.", "error");
        return;
    }

    const button = document.getElementById("resend-btn");
    button.disabled = true;
    button.textContent = "Sending...";

    const { error } = await sb.auth.resend({
        type: "signup",
        email: pendingSignupEmail
    });

    button.disabled = false;
    button.textContent = "Resend code";

    if(error){
        setVerifyMessage(error.message, "error");
        return;
    }

    setVerifyMessage("A new verification code was sent.", "success");
}

document.addEventListener("keydown", event => {
    if(event.key === "Enter" && document.getElementById("verify-card").classList.contains("show")){
        verifyEmailCode();
    }
});

async function googleSignup(){

    const { error } = await sb.auth.signInWithOAuth({
        provider:"google",
        options:{
            redirectTo:"https://alygnn.com/app-home.html"
        }
    });

    if(error){
        alert(error.message);
    }
}

</script>

</body>
</html>
