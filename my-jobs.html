<style>
:root{
  --brand:#5D7FA3; --sage:#8CB69B; --mint:#6FBF8F; --rose:#D79A9A;
  --bg:#F6F8F7; --card-bg:#FCFCFA; --text:#1A2530; --text-muted:#4A5968;
  --border:#DDE3E8;
}
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; font-family:'DM Sans', Arial, sans-serif; }
body{ min-height:100vh; padding-top:64px; background:var(--bg); color:var(--text); }

nav{
  position:fixed; top:0; left:0; right:0; width:100%; z-index:1000; height:64px; padding:0 5%;
  display:flex; align-items:center; justify-content:space-between;
  background:rgba(246,248,247,.92); backdrop-filter:blur(12px); border-bottom:1px solid var(--border);
}
.logo{ font-family:'DM Serif Display', serif; font-size:22px; color:var(--brand); text-decoration:none; }
.logo span{ color:var(--sage); }
.nav-links{
  display:flex;
  gap:40px;
  align-items:center;
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  height:100%;
}
.nav-links.nav-readiness-pending{ visibility:hidden; }

.nav-links a{
  height:100%;
  display:flex;
  align-items:center;
  position:relative;
  font-size:14px;
  color:var(--text-muted);
  text-decoration:none;
  font-weight:400;
}
.nav-links a:hover{ color:var(--text); }
.nav-links a.active{
  color:var(--text);
  font-weight:500;
}
.nav-links a.active::after{
  content:'';
  position:absolute;
  left:0;
  right:0;
  bottom:20px;
  height:2px;
  border-radius:999px;
  background:var(--brand);
}
.nav-signout{ min-height:38px; padding:0 16px; border-radius:100px; border:1px solid var(--border); background:white; color:var(--text-muted); font-size:13px; cursor:pointer; }

.nav-actions{ display:flex; align-items:center; gap:12px; }

.notification-btn{
  position:relative; width:40px; height:40px; display:grid; place-items:center;
  border:1px solid var(--border); border-radius:50%; background:#fff; color:var(--text-muted);
  cursor:pointer; transition:border-color .2s,color .2s,transform .2s;
}
.notification-btn:hover{ border-color:var(--brand); color:var(--brand); transform:translateY(-1px); }
.notification-btn svg{ width:19px; height:19px; stroke:currentColor; }
.notification-badge{
  position:absolute; top:-4px; right:-3px; min-width:18px; height:18px; padding:0 5px;
  display:flex; align-items:center; justify-content:center; border:2px solid var(--bg);
  border-radius:999px; background:#D85A5A; color:#fff; font-size:10px; line-height:1; font-weight:700;
}
.notification-badge[hidden]{display:none}

.notification-overlay{
  position:fixed; inset:0; z-index:500; display:none; align-items:flex-start; justify-content:flex-end;
  padding:78px 5% 24px; background:rgba(26,37,48,.18);
  backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px);
}
.notification-overlay.open{display:flex}

.notification-panel{
  width:min(430px,100%); max-height:min(70vh,620px); overflow:auto;
  background:#fff; border:1px solid var(--border); border-radius:20px;
  box-shadow:0 20px 70px rgba(26,37,48,.16);
}

.notification-head{
  position:sticky; top:0; z-index:2; display:flex; align-items:flex-start; justify-content:space-between;
  gap:18px; padding:20px 20px 16px; background:#fff; border-bottom:1px solid var(--border);
}
.notification-head h3{ font-family:'DM Serif Display',serif; font-size:22px; margin-bottom:3px; }
.notification-head p{ color:var(--text-muted); font-size:12px; }
.notification-head-actions{ display:flex; align-items:center; gap:8px; }
.mark-read-btn{ border:0; background:transparent; color:var(--brand); font-family:'DM Sans',sans-serif; font-size:11px; cursor:pointer; white-space:nowrap; }
.notification-close{ width:30px; height:30px; border:1px solid var(--border); border-radius:50%; background:#fff; color:var(--text-muted); font-size:19px; line-height:1; cursor:pointer; }

.notification-list{padding:6px 0}

.notification-item{
  width:100%; display:grid; grid-template-columns:38px 1fr auto; gap:12px; align-items:start;
  padding:15px 18px; border:0; border-bottom:1px solid rgba(221,227,232,.72);
  background:#fff; text-align:left; cursor:pointer; font-family:'DM Sans',sans-serif;
}
.notification-item:hover{background:rgba(93,127,163,.055)}
.notification-item.unread{background:rgba(93,127,163,.075)}

.notification-icon{
  width:36px; height:36px; border-radius:11px; display:grid; place-items:center;
  background:rgba(93,127,163,.10); color:var(--brand); font-size:16px; font-weight:700;
}
.notification-icon.green{ background:rgba(111,191,143,.12); color:#438661; }
.notification-icon.amber{ background:rgba(212,165,90,.13); color:#9B6B24; }
.notification-icon.rose{ background:rgba(215,154,154,.15); color:#A85E5E; }
.notification-copy strong{ display:block; color:var(--text); font-size:13px; font-weight:600; margin-bottom:3px; }
.notification-copy span{ display:block; color:var(--text-muted); font-size:12px; line-height:1.45; }
.notification-time{ padding-top:2px; color:var(--text-muted); font-size:10px; white-space:nowrap; }
.notification-empty{ padding:34px 22px; text-align:center; color:var(--text-muted); }
.notification-empty-icon{
  width:44px; height:44px; margin:0 auto 12px; display:grid; place-items:center;
  border-radius:50%; background:rgba(111,191,143,.12); color:#438661; font-size:20px;
}
.notification-empty strong{ display:block; color:var(--text); margin-bottom:5px; font-size:14px; }

@media (max-width:640px){
  .nav-links{
    position:static;
    transform:none;
    gap:14px;
    height:64px;
  }
  .nav-links a{font-size:12px}
  .nav-links a.active::after{bottom:15px}

  .nav-actions{gap:8px}
  .notification-btn{ width:36px; height:36px; }
  .notification-overlay{ padding:68px 12px 12px; }
}

main{ max-width:900px; margin:0 auto; padding:40px 6% 100px; }
.eyebrow{ font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--brand); margin-bottom:8px; }
h1{ font-family:'DM Serif Display', serif; font-size:2rem; letter-spacing:-.5px; margin-bottom:24px; }

.job-row-item{

.job-row-item:hover{ border-color:var(--brand); transform:translateY(-1px); }
.job-row-title{ font-size:14px; font-weight:500; color:var(--text); margin-bottom:3px; }
.job-row-meta{ font-size:12px; color:var(--text-muted); }
.job-row-status{

.job-row-status.status-accepted{ border-color:var(--sage); color:#2d8a57; background:rgba(140,182,155,.12); }
.job-row-status.status-rejected{ border-color:#D79A9A; color:#a05858; background:rgba(215,154,154,.12); }

.job-row-actions{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; flex-shrink:0; }
.job-row-buttons{ display:flex; gap:6px; }
.job-row-actions.job-row-actions-inline{ flex-direction:row; align-items:center; gap:8px; }
.job-action-btn{
  font-size:11px; font-weight:500; padding:5px 12px; border-radius:100px;
  border:1px solid var(--border); background:white; cursor:pointer;
  font-family:'DM Sans', Arial, sans-serif; transition:all .2s; white-space:nowrap;
}
.job-action-btn:hover{ border-color:var(--brand); color:var(--brand); }
.job-action-btn.apply{ color:#2d8a57; border-color:var(--sage); background:rgba(140,182,155,.08); }
.job-action-btn.apply:hover{ background:rgba(140,182,155,.18); border-color:var(--sage); color:#2d8a57; }
.job-action-btn.restore{ color:var(--text-muted); }

.empty-state{ padding:40px 20px; text-align:center; border:1px dashed var(--border); border-radius:16px; background:var(--card-bg); color:var(--text-muted); font-size:14px; }

.mini-footer{ text-align:center; padding:24px 6% 40px; font-size:12px; color:var(--text-muted); }
.mini-footer a{ color:var(--text-muted); text-decoration:none; }
.mini-footer a:hover{ color:var(--brand); }

<script>
const SUPABASE_URL = 'https://auth.alygnn.com';
const SUPABASE_ANON_KEY = 'sb_publishable_3l8krRh6WCyvKfNumWDBDw_C6CKr7rG';

function alygnnAuthStorageKey() {
  let tabId = window.sessionStorage.getItem('alygnn_auth_tab_id');
  if (!tabId) {
    tabId = (window.crypto && typeof window.crypto.randomUUID === 'function')
      ? window.crypto.randomUUID()
      : `${Date.now()}-${Math.random().toString(36).slice(2)}-${Math.random().toString(36).slice(2)}`;
    window.sessionStorage.setItem('alygnn_auth_tab_id', tabId);
  }
  return `alygnn-auth-${tabId}`;
}

const { createClient } = supabase;
const sb = // Keep Alygnn authentication isolated to this browser tab.
// This lets a candidate account stay open in one tab while a different
// employer account is signed in in another tab.
createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {
      storage: window.sessionStorage,
      storageKey: alygnnAuthStorageKey(),
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  });


function syncCandidateSwipeNav(matchingReady) {
  const ready = matchingReady === true;
  const nav = document.getElementById('candidate-nav-links');
  const swipe = document.getElementById('candidate-swipe-link') || document.getElementById('nav-swipe-link');

  try {
    window.sessionStorage.setItem('alygnn_matching_ready_v1', ready ? '1' : '0');
  } catch (_) {}

  if (swipe) swipe.style.display = ready ? '' : 'none';
  if (nav) nav.classList.remove('nav-readiness-pending');
}

let currentUserId = null;
let currentTab = 'applied';
let applications = [];
let skips = [];
let jobMap = {};

function escapeHtml(value){
  const div = document.createElement('div');
  div.textContent = String(value ?? '');
  return div.innerHTML;
}

async function signOut(){
  await sb.auth.signOut({ scope: 'local' });
  window.location.href = 'login.html';
}

// ---- Candidate notifications (ported from account.html, same
// localStorage read-tracking key so read/unread status stays in sync
// across pages) ----
const CANDIDATE_NOTIFICATION_READ_KEY = 'alygnn_candidate_notification_reads_v1';
let candidateNotifications = [];

function getCandidateNotificationReads(){
  try{
    const parsed = JSON.parse(
      localStorage.getItem(CANDIDATE_NOTIFICATION_READ_KEY) || '[]'
    );
    return new Set(Array.isArray(parsed) ? parsed : []);
  }catch(_){
    return new Set();
  }
}

function saveCandidateNotificationReads(reads){
  localStorage.setItem(
    CANDIDATE_NOTIFICATION_READ_KEY,
    JSON.stringify([...reads])
  );
}

function candidateNotificationEscape(value){
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#039;'
  })[char]);
}

function candidateStatusNotification(app, job){
  const raw = String(app?.status || 'applied').trim().toLowerCase();
  const title = job?.title || 'your application';
  const company = job?.company || 'the employer';
  const detailsUrl =
    `job-details.html?job=${encodeURIComponent(app.job_id)}&app=${encodeURIComponent(app.id)}`;

  if(raw === 'reviewed' || raw === 'under_review' || raw === 'under review'){
    return {
      id:`application-${app.id}-reviewed`,
      icon:'✓',
      iconClass:'',
      title:'Your application was reviewed',
      copy:`${company} reviewed your application for ${title}.`,
      time:'Update',
      action:detailsUrl
    };
  }

  if(raw === 'hired' || raw === 'hire' || raw === 'accepted'){
    return {
      id:`application-${app.id}-${raw}`,
      icon:'✓',
      iconClass:'green',
      title:raw === 'accepted' ? 'Application accepted' : 'You were marked hired',
      copy:`There’s a new positive update from ${company} for ${title}.`,
      time:'New',
      action:detailsUrl
    };
  }

  if(raw === 'rejected' || raw === 'declined' || raw === 'not_selected'){
    return {
      id:`application-${app.id}-rejected`,
      icon:'–',
      iconClass:'rose',
      title:'Application update',
      copy:`${company} updated your ${title} application to “Not selected.”`,
      time:'Update',
      action:detailsUrl
    };
  }

  return null;
}


let candidateMessageNotificationChannel = null;
let candidateNotificationProfileCache = null;
let candidateMessageNotificationPollTimer = null;
let candidateMessageNotificationRefreshBusy = false;

async function loadCandidateMessageNotificationItems(){
  if(!currentUserId)return [];

  try{
    const {data:threads,error:threadsError}=await sb
      .from('message_threads')
      .select('id,job_id,employer_id,candidate_id')
      .eq('candidate_id',currentUserId);

    if(threadsError)throw threadsError;

    const candidateThreads=threads||[];
    if(!candidateThreads.length)return [];

    const threadIds=candidateThreads.map(t=>t.id).filter(Boolean);
    if(!threadIds.length)return [];

    const {data:messageRows,error:messagesError}=await sb
      .from('messages')
      .select('id,thread_id,sender_id,body,created_at,read_at')
      .in('thread_id',threadIds)
      .neq('sender_id',currentUserId)
      .is('read_at',null)
      .order('created_at',{ascending:false})
      .limit(20);

    if(messagesError)throw messagesError;

    const unreadMessages=messageRows||[];
    if(!unreadMessages.length)return [];

    const threadMap=new Map(
      candidateThreads.map(thread=>[String(thread.id),thread])
    );

    const jobIds=[...new Set(
      candidateThreads.map(thread=>thread.job_id).filter(Boolean)
    )];

    let jobs=[];
    if(jobIds.length){
      const {data:jobRows,error:jobsError}=await sb
        .from('jobs')
        .select('id,title,company')
        .in('id',jobIds);

      if(jobsError)throw jobsError;
      jobs=jobRows||[];
    }

    const jobMap=new Map(
      jobs.map(job=>[String(job.id),job])
    );

    return unreadMessages.map(message=>{
      const thread=threadMap.get(String(message.thread_id))||{};
      const job=jobMap.get(String(thread.job_id))||{};
      const company=String(job.company||'Employer').trim();
      const jobTitle=String(job.title||'your application').trim();
      const preview=String(message.body||'').trim().replace(/\s+/g,' ');
      const shortPreview=preview.length>90?preview.slice(0,87)+'…':preview;

      return {
        id:`message-${message.id}`,
        icon:'✉',
        iconClass:'',
        title:`New message from ${company}`,
        copy:shortPreview
          ? `${jobTitle}: ${shortPreview}`
          : `You received a new message about ${jobTitle}.`,
        time:'New',
        action:`messages.html?thread=${encodeURIComponent(message.thread_id)}`
      };
    });
  }catch(error){
    console.warn('Could not load message notifications:',error);
    return [];
  }
}

async function refreshCandidateMessageNotifications(){
  if(candidateMessageNotificationRefreshBusy || !currentUserId)return;

  candidateMessageNotificationRefreshBusy = true;
  try{
    await loadCandidateNotifications(candidateNotificationProfileCache);
  }finally{
    candidateMessageNotificationRefreshBusy = false;
  }
}

function ensureCandidateMessageNotificationPolling(){
  if(candidateMessageNotificationPollTimer || !currentUserId)return;

  // Realtime is the primary path. This lightweight fallback makes the bell
  // reliable even if a browser/network temporarily misses a websocket event.
  candidateMessageNotificationPollTimer = window.setInterval(()=>{
    if(document.visibilityState === 'visible'){
      refreshCandidateMessageNotifications();
    }
  },5000);
}

function ensureCandidateMessageNotificationRealtime(){
  if(candidateMessageNotificationChannel||!currentUserId){
    ensureCandidateMessageNotificationPolling();
    return;
  }

  candidateMessageNotificationChannel=sb
    .channel('candidate-message-notifications-'+currentUserId)
    .on('postgres_changes',{
      event:'INSERT',
      schema:'public',
      table:'messages'
    },async payload=>{
      if(payload?.new?.sender_id===currentUserId)return;
      await refreshCandidateMessageNotifications();
    })
    .subscribe(status=>{
      if(status === 'SUBSCRIBED'){
        // Re-check immediately in case a message arrived while the channel
        // was connecting.
        refreshCandidateMessageNotifications();
      }

      if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED'){
        console.warn('Candidate message notification realtime status:',status);
      }
    });

  ensureCandidateMessageNotificationPolling();
}

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState === 'visible' && currentUserId){
    refreshCandidateMessageNotifications();
  }
});

window.addEventListener('focus',()=>{
  if(currentUserId){
    refreshCandidateMessageNotifications();
  }
});

async function loadCandidateNotifications(profile){
  if(!currentUserId) return;

  candidateNotificationProfileCache = profile || null;

  const items = [];
  const hasResume = !!(profile?.resume_file_path || profile?.resume_data);
  const hasPreferences = !!profile?.preferences;

  const messageItems = await loadCandidateMessageNotificationItems();
  items.push(...messageItems);

  try{
    const { data: apps, error: appsError } = await sb
      .from('applications')
      .select('id, job_id, status, applied_at')
      .eq('candidate_id', currentUserId)
      .order('applied_at', { ascending:false });

    if(appsError) throw appsError;

    const jobIds = [...new Set(
      (apps || []).map(app => app.job_id).filter(Boolean)
    )];

    let jobs = [];

    if(jobIds.length){
      const { data: jobsData, error: jobsError } = await sb
        .from('jobs')
        .select('id,title,company')
        .in('id', jobIds);

      if(jobsError) throw jobsError;
      jobs = jobsData || [];
    }

    const jobMapForNotifs = new Map(
      jobs.map(job => [String(job.id), job])
    );

    (apps || []).forEach(app => {
      const item = candidateStatusNotification(
        app,
        jobMapForNotifs.get(String(app.job_id)) || null
      );
      if(item) items.push(item);
    });
  }catch(error){
    console.warn('Could not load application notifications:', error);
  }

  if(!hasResume){
    items.push({
      id:'profile-resume-missing',
      icon:'▤',
      iconClass:'',
      title:'Add your resume',
      copy:'Upload a resume or build one with Alygnn to complete your candidate profile.',
      time:'Profile',
      action:'align-upload.html'
    });
  }

  if(!hasPreferences){
    items.push({
      id:'profile-preferences-missing',
      icon:'◎',
      iconClass:'amber',
      title:'Complete your job preferences',
      copy:'Add your target role, salary, location, and work style so Alygnn can match you better.',
      time:'Profile',
      action:'preferences.html'
    });
  }

  candidateNotifications = items;
  renderCandidateNotifications();
  ensureCandidateMessageNotificationRealtime();
}

function renderCandidateNotifications(){
  const list = document.getElementById('candidate-notification-list');
  const badge = document.getElementById('candidate-notification-badge');
  const countLabel = document.getElementById('candidate-notification-count-label');
  const markRead = document.getElementById('candidate-mark-read-btn');

  if(!list || !badge || !countLabel || !markRead) return;

  const reads = getCandidateNotificationReads();
  const unread = candidateNotifications.filter(item => !reads.has(item.id));

  badge.textContent = String(unread.length);
  badge.hidden = unread.length === 0;

  countLabel.textContent = unread.length
    ? `${unread.length} unread notification${unread.length === 1 ? '' : 's'}`
    : 'You’re all caught up';

  markRead.hidden = unread.length === 0;

  if(!candidateNotifications.length){
    list.innerHTML = `
      <div class="notification-empty">
        <div class="notification-empty-icon">✓</div>
        <strong>You’re all caught up</strong>
        <span>No new messages, application updates, or profile notifications right now.</span>
      </div>
    `;
    return;
  }

  list.innerHTML = candidateNotifications.map(item => {
    const isUnread = !reads.has(item.id);

    return `
      <button
        type="button"
        class="notification-item ${isUnread ? 'unread' : ''}"
        onclick="openCandidateNotificationItem(
          '${candidateNotificationEscape(item.id)}',
          '${candidateNotificationEscape(item.action)}'
        )"
      >
        <span class="notification-icon ${candidateNotificationEscape(item.iconClass)}">
          ${candidateNotificationEscape(item.icon)}
        </span>

        <span class="notification-copy">
          <strong>${candidateNotificationEscape(item.title)}</strong>
          <span>${candidateNotificationEscape(item.copy)}</span>
        </span>

        <span class="notification-time">
          ${candidateNotificationEscape(item.time)}
        </span>
      </button>
    `;
  }).join('');
}

function openCandidateNotifications(){
  const overlay = document.getElementById('candidate-notification-overlay');
  if(!overlay) return;

  renderCandidateNotifications();
  overlay.classList.add('open');
  overlay.setAttribute('aria-hidden','false');
}

function closeCandidateNotifications(){
  const overlay = document.getElementById('candidate-notification-overlay');
  if(!overlay) return;

  overlay.classList.remove('open');
  overlay.setAttribute('aria-hidden','true');
}

function candidateNotificationBackdrop(event){
  if(event.target === event.currentTarget){
    closeCandidateNotifications();
  }
}

function markAllCandidateNotificationsRead(){
  const reads = getCandidateNotificationReads();
  candidateNotifications.forEach(item => reads.add(item.id));
  saveCandidateNotificationReads(reads);
  renderCandidateNotifications();
}

function openCandidateNotificationItem(id, action){
  const reads = getCandidateNotificationReads();
  reads.add(id);
  saveCandidateNotificationReads(reads);
  renderCandidateNotifications();

  if(action){
    window.location.href = action;
  }
}

document.addEventListener('keydown', event => {
  if(event.key === 'Escape'){
    closeCandidateNotifications();
  }
});

// Applications carry a real employer decision — accepted/rejected/applied —
// so they're grouped by that status. Skips aren't a "status" on an
// application at all (they're a separate table of jobs the person passed
// on), so they get their own tab rather than being folded into the status
// groupings, which is what "categorized by status" would otherwise miss.
async function loadData(){
  const { data: apps, error: appsError } = await sb
    .from('applications')
    .select('id, job_id, status, applied_at')
    .eq('candidate_id', currentUserId)
    .order('applied_at', { ascending: false });

  if(appsError) console.error('Failed to load applications:', appsError);
  applications = apps || [];

  const { data: skipRows, error: skipsError } = await sb
    .from('skipped_jobs')
    .select('id, job_id, skipped_at')
    .eq('candidate_id', currentUserId)
    .order('skipped_at', { ascending: false });

  if(skipsError) console.error('Failed to load skipped jobs:', skipsError);
  skips = skipRows || [];

  const jobIds = [...new Set([...applications.map(a => a.job_id), ...skips.map(s => s.job_id)])];
  if(jobIds.length === 0){ jobMap = {}; return; }

  const { data: jobsData, error: jobsError } = await sb
    .from('jobs')
    .select('id, title, company, location, job_type')
    .in('id', jobIds);

  if(jobsError) console.error('Failed to load job details:', jobsError);

  jobMap = {};
  (jobsData || []).forEach(j => { jobMap[j.id] = j; });
}

function renderAppliedRow(app, job){
  const statusClass = app.status === 'accepted' ? 'status-accepted'
    : app.status === 'rejected' ? 'status-rejected' : '';
  const statusLabel = app.status === 'accepted' ? 'Accepted'
    : app.status === 'rejected' ? 'Not selected' : 'Applied';

  const metaParts = [job.company, job.job_type, job.location].filter(Boolean).join(' · ');
  const detailsUrl = `job-details.html?job=${encodeURIComponent(job.id)}&app=${encodeURIComponent(app.id)}`;
  const jobIdAttr = escapeHtml(job.id);

  const skipButtonHtml = app.status === 'applied' || !app.status
    ? `<div class="job-row-buttons">
        <button type="button" class="job-action-btn restore" onclick="event.stopPropagation(); withdrawApplication('${jobIdAttr}')">Skip</button>
      </div>`
    : '';

  return `
    <div class="job-row-item" role="button" tabindex="0"
      onclick="window.location.href='${detailsUrl}'"
      onkeydown="if(event.key==='Enter'){ window.location.href='${detailsUrl}'; }">
      <div style="flex:1; min-width:0;">
        <div class="job-row-title">${escapeHtml(job.title || 'Untitled role')}</div>
        <div class="job-row-meta">${escapeHtml(metaParts)}</div>
      </div>
      <div class="job-row-actions job-row-actions-inline">
        <span class="job-row-status ${statusClass}">${statusLabel}</span>
        ${skipButtonHtml}
      </div>
    </div>
  `;
}

function renderSkippedRow(job){
  const metaParts = [job.company, job.job_type, job.location].filter(Boolean).join(' · ');
  const detailsUrl = `job-details.html?job=${encodeURIComponent(job.id)}`;
  const jobIdAttr = escapeHtml(job.id);

  return `
    <div class="job-row-item" role="button" tabindex="0"
      onclick="window.location.href='${detailsUrl}'"
      onkeydown="if(event.key==='Enter'){ window.location.href='${detailsUrl}'; }">
      <div>
        <div class="job-row-title">${escapeHtml(job.title || 'Untitled role')}</div>
        <div class="job-row-meta">${escapeHtml(metaParts)}</div>
      </div>
      <div class="job-row-actions">
        <div class="job-row-buttons">
          <button type="button" class="job-action-btn apply" onclick="event.stopPropagation(); applyFromSkipped('${jobIdAttr}')">Apply</button>
          <button type="button" class="job-action-btn restore" onclick="event.stopPropagation(); restoreSkippedJob('${jobIdAttr}')">Undo skip</button>
        </div>
      </div>
    </div>
  `;
}

function render(){
  const listEl = document.getElementById('job-list');
  const query = document.getElementById('search-input').value.trim().toLowerCase();

  let rows = [];

  if(currentTab === 'skipped'){
    rows = skips
      .map(skip => ({ skip, job: jobMap[skip.job_id] }))
      .filter(r => r.job);
  } else {
    rows = applications
      .filter(app => (app.status || 'applied') === currentTab)
      .map(app => ({ app, job: jobMap[app.job_id] }))
      .filter(r => r.job);
  }

  if(query){
    rows = rows.filter(r => {
      const haystack = [r.job.title, r.job.company, r.job.location].filter(Boolean).join(' ').toLowerCase();
      return haystack.includes(query);
    });
  }

  if(rows.length === 0){
    const emptyLabel = currentTab === 'skipped' ? 'skipped'
      : currentTab === 'accepted' ? 'accepted'
      : currentTab === 'rejected' ? 'not selected'
      : 'applied';
    listEl.innerHTML = `<div class="empty-state">No ${emptyLabel} jobs${query ? ' match your search' : ' yet'}.</div>`;
    return;
  }

  listEl.innerHTML = rows.map(r =>
    currentTab === 'skipped' ? renderSkippedRow(r.job) : renderAppliedRow(r.app, r.job)
  ).join('');
}

async function withdrawApplication(jobId){
  if(!currentUserId || !jobId) return;

  const { error: deleteError } = await sb
    .from('applications')
    .delete()
    .eq('candidate_id', currentUserId)
    .eq('job_id', jobId);

  if(deleteError){
    console.error('Failed to withdraw application:', deleteError);
    return;
  }

  const { error: insertError } = await sb
    .from('skipped_jobs')
    .insert({ candidate_id: currentUserId, job_id: jobId });

  if(insertError && insertError.code !== '23505'){
    console.error('Failed to record skip after withdrawing:', insertError);
  }

  await loadData();
  render();
}

async function applyFromSkipped(jobId){
  if(!currentUserId || !jobId) return;

  const { error: insertError } = await sb
    .from('applications')
    .insert({ candidate_id: currentUserId, job_id: jobId, status: 'applied' });

  if(insertError && insertError.code !== '23505'){
    console.error('Failed to apply from skipped list:', insertError);
    return;
  }

  const { error: deleteError } = await sb
    .from('skipped_jobs')
    .delete()
    .eq('candidate_id', currentUserId)
    .eq('job_id', jobId);

  if(deleteError){
    console.error('Failed to clear skipped row after applying:', deleteError);
  }

  await loadData();
  render();
}

async function restoreSkippedJob(jobId){
  if(!currentUserId || !jobId) return;

  const { error } = await sb
    .from('skipped_jobs')
    .delete()
    .eq('candidate_id', currentUserId)
    .eq('job_id', jobId);

  if(error){
    console.error('Failed to undo skip:', error);
    return;
  }

  await loadData();
  render();
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    render();
  });
});

document.getElementById('search-input').addEventListener('input', render);

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.replace('login.html'); return; }

  currentUserId = session.user.id;
  document.body.classList.add('auth-ready');

  await loadData();
  render();

  const { data: profile, error: profileError } = await sb
    .from('profiles')
    .select('resume_file_path, resume_data, preferences')
    .eq('id', currentUserId)
    .maybeSingle();

  if (profileError && profileError.code !== 'PGRST116') {
    console.warn('Could not load profile for notifications:', profileError);
  }

  // Only expose Swipe after onboarding is complete.
  const hasResume = !!(profile?.resume_file_path || profile?.resume_data);
  const hasPreferences = !!profile?.preferences;
  syncCandidateSwipeNav(hasResume && hasPreferences);

  await loadCandidateNotifications(profile || null);
})();
</script>
