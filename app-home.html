<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alygnn</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:'DM Sans',Arial,sans-serif!important}
html,body{margin:0;min-height:100%;background:#05080D;color:#fff}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at top,rgba(93,127,163,.28),transparent 34%),linear-gradient(180deg,#05080D,#0A0F17)}
.loader{text-align:center;padding:30px}
.logo{font-size:38px;font-weight:900;color:#5D7FA3;letter-spacing:-1px}
.text{margin-top:12px;color:#A7B0BC;font-weight:700}
.spinner{width:34px;height:34px;margin:22px auto 0;border:3px solid rgba(255,255,255,.12);border-top-color:#5D7FA3;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style id="candidate-portal-theme">

html,body{background:#F5F8F8!important;color:#172333!important}
body{background:radial-gradient(circle at 85% 0%,rgba(93,127,163,.09),transparent 27%),#F5F8F8!important}
.loader{
  min-width:240px;padding:34px 30px!important;border:1px solid #DCE5EB;border-radius:28px;
  background:#fff;box-shadow:0 18px 50px rgba(23,35,51,.06)
}
.logo{font-family:'DM Serif Display',Georgia,serif!important;font-size:40px!important;font-weight:400!important;letter-spacing:0!important;color:#5D7FA3!important}
.logo span{color:#8CB69B}
.text{color:#66788A!important;font-size:13px}
.spinner{border-color:#E1E8ED!important;border-top-color:#35679A!important}

</style>
</head>
<body>
<div class="loader">
  <div class="logo">Alygnn<span>.</span></div>
  <div class="text">Opening your candidate workspace…</div>
  <div class="spinner"></div>
</div>
<script>
const sb=supabase.createClient(
  "https://auth.alygnn.com",
  "sb_publishable_3l8krRh6WCyvKfNumWDBDw_C6CKr7rG",
  {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}
);

(async function routeApp(){
  try{
    const {data,error}=await sb.auth.getSession();
    if(error||!data.session){
      window.location.replace("app-login.html");
      return;
    }
    window.location.replace("app-swipe.html");
  }catch(error){
    console.error(error);
    window.location.replace("app-login.html");
  }
})();
</script>
</body>
</html>
