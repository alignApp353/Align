<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta name="theme-color" content="#F6F8F7">

<title>Employer Account Deactivated | Alygnn</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=DM+Serif+Display&display=swap"
  rel="stylesheet"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  font-family:'DM Sans',Arial,sans-serif;
}

:root{
  --bg:#F6F8F7;
  --card:#FFFFFF;
  --text:#172333;
  --muted:#637181;
  --border:#DDE3E8;
  --brand:#5D7FA3;
  --sage:#8CB69B;
  --danger:#B94A54;
  --danger-bg:#FCEDEF;
}

html,
body{
  margin:0;
  min-height:100%;
}

body{
  min-height:100vh;

  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(93,127,163,.12),
      transparent 30%
    ),
    radial-gradient(
      circle at 90% 90%,
      rgba(140,182,155,.12),
      transparent 30%
    ),
    var(--bg);

  color:var(--text);

  display:flex;
  justify-content:center;
  align-items:center;

  padding:
    calc(24px + env(safe-area-inset-top))
    20px
    calc(24px + env(safe-area-inset-bottom));
}

.card{
  width:min(100%,520px);

  padding:30px 27px;

  border:1px solid var(--border);
  border-radius:26px;

  background:rgba(255,255,255,.96);

  box-shadow:
    0 22px 65px
    rgba(23,35,51,.09);
}

.brand{
  text-align:center;

  font-family:
    'DM Serif Display',
    Georgia,
    serif;

  font-size:34px;

  color:var(--brand);
}

.brand span{
  color:var(--sage);
}

.icon{
  width:76px;
  height:76px;

  margin:
    26px
    auto
    0;

  border-radius:50%;

  background:var(--danger-bg);
  color:var(--danger);

  display:flex;
  align-items:center;
  justify-content:center;
}

.icon svg{
  width:36px;
  height:36px;
}

h1{
  margin:
    21px
    0
    0;

  text-align:center;

  font-size:29px;
  line-height:1.12;

  letter-spacing:-.6px;
}

.subtitle{
  margin:
    11px
    auto
    0;

  max-width:410px;

  color:var(--muted);

  text-align:center;

  font-size:14px;
  line-height:1.6;
}

.notice{
  margin-top:24px;

  padding:17px;

  border:1px solid #F0C8CD;
  border-radius:17px;

  background:var(--danger-bg);
}

.notice-title{
  color:var(--danger);

  font-size:11px;
  font-weight:900;

  text-transform:uppercase;

  letter-spacing:.7px;
}

.notice-copy{
  margin-top:7px;

  color:#71383D;

  font-size:13px;
  line-height:1.55;

  word-break:break-word;
}

.details{
  margin-top:18px;

  padding:17px;

  border-radius:17px;

  background:#EDF3F8;
}

.row{
  display:flex;
  justify-content:space-between;

  gap:20px;

  padding:10px 0;

  border-bottom:
    1px solid
    #D8E1E8;

  font-size:12px;
}

.row:last-child{
  border-bottom:0;
}

.row span{
  color:var(--muted);
}

.row strong{
  text-align:right;

  word-break:break-word;
}

.actions{
  margin-top:22px;

  display:grid;

  gap:10px;
}

button{
  width:100%;
  min-height:54px;

  border-radius:16px;

  font-size:14px;
  font-weight:900;

  cursor:pointer;
}

.primary{
  border:0;

  background:#345F91;
  color:#fff;
}

.secondary{
  border:1px solid var(--border);

  background:#fff;
  color:var(--text);
}

.message{
  display:none;

  margin-top:15px;

  padding:12px 13px;

  border-radius:13px;

  background:#EDF3F8;

  color:var(--muted);

  font-size:12px;
  line-height:1.5;
}

.message.show{
  display:block;
}

@media(max-width:480px){

  .card{
    padding:
      25px
      20px;
  }

  h1{
    font-size:26px;
  }
}
</style>
</head>

<body>

<main class="card">

<div class="brand">
Alygnn<span>.</span>
</div>


<div class="icon">

<svg
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
>
  <circle cx="12" cy="12" r="9"></circle>
  <path d="M8.5 8.5l7 7"></path>
</svg>

</div>


<h1>
Employer account deactivated
</h1>


<p class="subtitle">
Your company’s Alygnn employer access is currently unavailable.
Job publishing and employer workspace access have been disabled.
</p>


<div
  class="notice"
  id="reason-box"
>

<div class="notice-title">
Reason
</div>

<div
  class="notice-copy"
  id="reason"
>
Checking account status…
</div>

</div>


<div class="details">

<div class="row">

<span>
Company
</span>

<strong id="company">
Checking…
</strong>

</div>


<div class="row">

<span>
Verification
</span>

<strong id="verification">
Checking…
</strong>

</div>


<div class="row">

<span>
Account status
</span>

<strong id="account-status">
Deactivated
</strong>

</div>


<div class="row">

<span>
Deactivated
</span>

<strong id="deactivated-at">
Checking…
</strong>

</div>

</div>


<div class="actions">

<button
  class="primary"
  id="check-status"
  type="button"
>
Check Account Status
</button>


<button
  class="secondary"
  id="signout"
  type="button"
>
Sign out
</button>

</div>


<div
  class="message"
  id="message"
></div>

</main>


<script>

const sb =
  supabase.createClient(
    'https://auth.alygnn.com',
    'sb_publishable_3l8krRh6WCyvKfNumWDBDw_C6CKr7rG',
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true
      }
    }
  );


function formatStatus(value){

  return String(
    value || ''
  )
    .replaceAll('_',' ')
    .replace(
      /\b\w/g,
      char =>
        char.toUpperCase()
    );
}


function formatDate(value){

  if(!value){
    return 'Not provided';
  }

  const date =
    new Date(value);


  if(
    Number.isNaN(
      date.getTime()
    )
  ){
    return 'Not provided';
  }


  return date
    .toLocaleString();
}


function showMessage(text){

  const box =
    document.getElementById(
      'message'
    );


  box.textContent =
    text;


  box.classList
    .add('show');
}


async function loadAccountStatus(){

  const {
    data:{
      session
    }
  } =
    await sb.auth
      .getSession();


  if(!session){

    location.replace(
      'app-employer-login.html'
    );

    return;
  }


  const button =
    document.getElementById(
      'check-status'
    );


  button.disabled = true;

  button.textContent =
    'Checking…';


  try{

    const response =
      await fetch(
        'https://alygnn.com/api/company/resolve-company',
        {
          method:'GET',

          headers:{
            'Authorization':
              'Bearer ' +
              session.access_token
          }
        }
      );


    const result =
      await response
        .json()
        .catch(()=>({}));


    if(!response.ok){

      throw new Error(
        result.error ||
        'Unable to check your company account.'
      );
    }


    const company =
      result.company || {};


    document
      .getElementById(
        'company'
      )
      .textContent =
        company.name ||
        'Your company';


    document
      .getElementById(
        'verification'
      )
      .textContent =
        formatStatus(
          company.verificationStatus ||
          'pending_review'
        );


    document
      .getElementById(
        'account-status'
      )
      .textContent =
        formatStatus(
          company.accountStatus ||
          'active'
        );


    document
      .getElementById(
        'deactivated-at'
      )
      .textContent =
        formatDate(
          company.deactivatedAt
        );


    document
      .getElementById(
        'reason'
      )
      .textContent =
        company.deactivationReason ||
        'Your employer account has been deactivated by Alygnn. Contact Alygnn support if you believe this was a mistake.';


    /*
     * ADMIN REACTIVATED THE COMPANY
     */

    if(
      String(
        company.accountStatus ||
        'active'
      ).toLowerCase() !==
      'deactivated'
    ){

      localStorage.removeItem(
        'alygnn_company_deactivation_reason'
      );


      localStorage.removeItem(
        'alygnn_company_deactivated_at'
      );


      showMessage(
        'Your company has been reactivated. Opening your employer account…'
      );


      setTimeout(
        ()=>{

          if(
            String(
              company.verificationStatus ||
              ''
            ).toLowerCase() ===
            'approved'
          ){

            location.replace(
              'app-employer-dashboard.html'
            );

          }else{

            location.replace(
              'app-employer-verification-status.html'
            );
          }

        },
        700
      );


      return;
    }


  }catch(error){

    showMessage(
      error.message ||
      'Unable to check your account status.'
    );

  }finally{

    button.disabled =
      false;


    button.textContent =
      'Check Account Status';
  }
}


document
  .getElementById(
    'check-status'
  )
  .addEventListener(
    'click',
    loadAccountStatus
  );


document
  .getElementById(
    'signout'
  )
  .addEventListener(
    'click',
    async ()=>{

      await sb.auth
        .signOut();


      localStorage.removeItem(
        'alygnn_company_deactivation_reason'
      );


      localStorage.removeItem(
        'alygnn_company_deactivated_at'
      );


      location.replace(
        'app-employer-login.html?logout=1'
      );
    }
  );


loadAccountStatus();

</script>

</body>
</html>
