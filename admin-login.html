<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin sign in — Alygnn</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --brand:#5D7FA3;
    --sage:#8CB69B;
    --bg:#F6F8F7;
    --card:#FCFCFA;
    --text:#1A2530;
    --muted:#4A5968;
    --border:#DDE3E8;
    --rose:#D79A9A;
    --rose-bg:rgba(215,154,154,.14);
    --mint:#6FBF8F;
    --mint-bg:rgba(111,191,143,.14);
  }

  body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:'DM Sans',sans-serif;
    display:grid;
    place-items:center;
    padding:24px;
  }

  .card{
    width:min(100%,460px);
    background:var(--card);
    border:1px solid var(--border);
    border-radius:26px;
    padding:32px;
    box-shadow:0 24px 70px rgba(47,58,69,.10);
  }

  .logo{
    font-family:'DM Serif Display',serif;
    font-size:34px;
    color:var(--brand);
    text-align:center;
  }
  .logo span{color:var(--sage)}

  .pill{
    width:max-content;
    margin:14px auto 0;
    padding:7px 11px;
    border:1px solid var(--border);
    border-radius:999px;
    color:var(--muted);
    font-size:10px;
    font-weight:700;
    letter-spacing:.7px;
  }

  h1{
    font-family:'DM Serif Display',serif;
    font-size:30px;
    font-weight:400;
    margin:28px 0 8px;
  }

  .sub{
    color:var(--muted);
    font-size:14px;
    line-height:1.6;
    margin-bottom:24px;
  }

  label{
    display:block;
    margin:16px 0 8px;
    font-size:12px;
    font-weight:600;
  }

  input{
    width:100%;
    height:52px;
    border:1px solid var(--border);
    border-radius:13px;
    background:#fff;
    color:var(--text);
    padding:0 14px;
    outline:none;
    font-size:15px;
  }

  input:focus{
    border-color:var(--brand);
    box-shadow:0 0 0 3px rgba(93,127,163,.12);
  }

  .password-wrap{position:relative}
  .password-wrap input{padding-right:70px}

  .show{
    position:absolute;
    right:8px;
    top:6px;
    height:40px;
    border:0;
    background:transparent;
    color:var(--brand);
    font-weight:600;
    cursor:pointer;
    padding:0 9px;
  }

  .primary{
    width:100%;
    height:52px;
    margin-top:22px;
    border:0;
    border-radius:13px;
    background:var(--brand);
    color:#fff;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
  }
  .primary:disabled{opacity:.55;cursor:not-allowed}

  .message{
    display:none;
    margin-top:16px;
    padding:12px 13px;
    border-radius:12px;
    font-size:12px;
    font-weight:500;
    line-height:1.5;
  }
  .message.show{display:block}
  .message.error{
    color:#874545;
    background:var(--rose-bg);
    border:1px solid var(--rose);
  }
  .message.success{
    color:#2F7149;
    background:var(--mint-bg);
    border:1px solid var(--mint);
  }

  .back{
    display:block;
    margin-top:20px;
    text-align:center;
    color:var(--brand);
    text-decoration:none;
    font-size:13px;
  }

  .security{
    margin-top:20px;
    padding-top:18px;
    border-top:1px solid var(--border);
    color:var(--muted);
    font-size:11px;
    line-height:1.55;
    text-align:center;
  }
</style>
</head>

<body>
<main class="card">
  <div class="logo">Alygnn<span>.</span></div>
  <div class="pill">ADMIN ACCESS</div>

  <h1>Admin sign in</h1>
  <p class="sub">Sign in with an Alygnn administrator account to review and manually verify employer businesses.</p>

  <div id="form-fields">
    <label for="email">Admin email</label>
    <input id="email" type="email" autocomplete="username" placeholder="you@company.com">

    <label for="password">Password</label>
    <div class="password-wrap">
      <input id="password" type="password" autocomplete="current-password" placeholder="Enter your password">
      <button class="show" id="show-password" type="button">Show</button>
    </div>

    <button class="primary" id="sign-in" type="button">Sign in to Admin</button>
  </div>

  <div id="already-signed-in" style="display:none">
    <div class="message show success" id="already-signed-in-message"></div>
    <button class="primary" id="continue-btn" type="button">Continue to Admin →</button>
    <button class="primary" id="use-different-btn" type="button" style="margin-top:10px;background:transparent;color:var(--muted);border:1px solid var(--border)">Sign out &amp; use a different account</button>
  </div>

  <div class="message" id="message"></div>

  <a class="back" href="login.html">← Back to regular sign in</a>

  <div class="security">
    Access is limited to accounts whose Alygnn profile is marked as an administrator.
  </div>
</main>

<script>
const SUPABASE_URL='https://auth.alygnn.com';
const SUPABASE_KEY='sb_publishable_3l8krRh6WCyvKfNumWDBDw_C6CKr7rG';
const DESTINATION='employer-verification-admin.html';

// Admin sessions use sessionStorage instead of the default localStorage so
// they end automatically when the tab/browser closes — a deliberate
// trade-off for this console (re-login each new session) that regular
// employer/job-seeker accounts do not use. Note: browsers intentionally
// restore sessionStorage when a closed tab is reopened or duplicated, so a
// lingering session can still surface here — which is exactly why we no
// longer auto-redirect on it below. It's always shown plainly and always
// requires an explicit click before it's used.
const sb=supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.sessionStorage}}
);

const email=document.getElementById('email');
const password=document.getElementById('password');
const signInButton=document.getElementById('sign-in');
const message=document.getElementById('message');

function showMessage(text,type='error'){
  message.textContent=text;
  message.className='message show '+type;
}

function clearMessage(){
  message.textContent='';
  message.className='message';
}

function setLoading(loading){
  signInButton.disabled=loading;
  signInButton.textContent=loading?'Checking admin access…':'Sign in to Admin';
}

async function checkAdmin(userId){
  const {data,error}=await sb
    .from('profiles')
    .select('is_admin')
    .eq('id',userId)
    .maybeSingle();

  if(error) throw error;
  return data?.is_admin===true;
}

async function signIn(){
  clearMessage();

  const adminEmail=email.value.trim().toLowerCase();
  const adminPassword=password.value;

  if(!adminEmail){
    showMessage('Enter your admin email.');
    return;
  }
  if(!adminPassword){
    showMessage('Enter your password.');
    return;
  }

  setLoading(true);

  try{
    const {data,error}=await sb.auth.signInWithPassword({
      email:adminEmail,
      password:adminPassword
    });

    if(error) throw error;
    if(!data.session || !data.user) throw new Error('Unable to create an admin session.');

    const isAdmin=await checkAdmin(data.user.id);

    if(!isAdmin){
      await sb.auth.signOut();
      throw new Error('This account is not authorized as an Alygnn administrator.');
    }

    showMessage('Admin access confirmed. Opening employer verification…','success');
    setTimeout(()=>location.replace(DESTINATION),350);

  }catch(error){
    showMessage(error?.message || 'Unable to sign in.');
    setLoading(false);
  }
}

async function redirectIfAlreadyAdmin(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session) return;

  try{
    const isAdmin=await checkAdmin(session.user.id);
    if(isAdmin){
      document.getElementById('form-fields').style.display='none';
      document.getElementById('already-signed-in').style.display='block';
      document.getElementById('already-signed-in-message').textContent=
        `You're already signed in as ${session.user.email}.`;
      return;
    }
    await sb.auth.signOut();
  }catch(error){
    console.error('Admin session check failed:',error);
  }
}

document.getElementById('continue-btn').addEventListener('click',()=>{
  location.replace(DESTINATION);
});

document.getElementById('use-different-btn').addEventListener('click',async()=>{
  await sb.auth.signOut();
  document.getElementById('already-signed-in').style.display='none';
  document.getElementById('form-fields').style.display='block';
});

document.getElementById('show-password').addEventListener('click',()=>{
  const hidden=password.type==='password';
  password.type=hidden?'text':'password';
  document.getElementById('show-password').textContent=hidden?'Hide':'Show';
});

signInButton.addEventListener('click',signIn);
password.addEventListener('keydown',event=>{
  if(event.key==='Enter') signIn();
});

redirectIfAlreadyAdmin();
</script>
</body>
</html>
